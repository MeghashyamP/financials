                        } else {
                            amountVal = deb;
                            typeVal = "expense";
                        }
                    } else {
                        const amtStr = String(row[mappings.amount] || "0").replace(/[^\d.-]/g, '');
                        const parsedAmt = parseFloat(amtStr);
                        amountVal = Math.abs(parsedAmt);
                        if (mappings.type !== -1) {
                            const tStr = String(row[mappings.type]).toLowerCase();
                            typeVal = (tStr.includes("in") || tStr.includes("cred") || parsedAmt > 0) ? "income" : "expense";
                        } else {
                            typeVal = parsedAmt >= 0 ? "income" : "expense";
                        }
                    }

                    // Format date (YYYY-MM-DD)
                    let formattedDate = "";
                    try {
                        const dateObj = new Date(dateVal);
                        if (!isNaN(dateObj.getTime())) {
                            formattedDate = dateObj.toISOString().split('T')[0];
                        }
                    } catch(e) {}

                    if (formattedDate && merchantVal && amountVal > 0) {
                        itemsToInsert.push({
                            date: formattedDate,
                            merchant: merchantVal,
                            amount: amountVal,
                            type: typeVal,
                            account: "CSV Import",
                            source: "csv",
                            documentId: docId
                        });
                    }
                });

                if (itemsToInsert.length === 0) {
                    showToast("No valid transactions parsed from CSV", "warning");
                    setCsvMappingData(null);
                    return;
                }

                const res = await handleAddTransactions(itemsToInsert);
                showToast(`Import summary: ${res.inserted} transactions added, ${res.duplicates} duplicates skipped.`);
                
                // Add CSV document metadata in vault list (Section 8.2)
                await saveDocumentInDB({
                    id: docId,
                    filename,
                    mimeType: "text/csv",
                    size: csvMappingData.rows.length * 100, // mock size
                    status: "stored",
                    source: "manual-csv",
                    createdAt: new Date().toISOString()
                });
                
                setCsvMappingData(null);
                setShowImportModal(false);
                loadState();
            };

            // Modern client-side Directory Picker Watcher sync (Section 17/18 replacement)
            const handleSyncLocalFolder = async () => {
                try {
                    if (!window.showDirectoryPicker) {
                        showToast("Your browser does not support Directory Picker API. Please drag-and-drop files in Documents page.", "warning");
                        return;
                    }

                    const dirHandle = await window.showDirectoryPicker();
                    showToast(`Access granted to directory: ${dirHandle.name}`);

                    let newTxCount = 0;
                    let fileCount = 0;
                    let duplicateCount = 0;
                    
                    const processedIds = [...(settings.processedFileIds || [])];
                    const resetAt = settings.driveResetAt ? new Date(settings.driveResetAt) : null;
                    const updatedProcessedIds = [...processedIds];

                    // Loop directory files
                    for await (const entry of dirHandle.values()) {
                        if (entry.kind === 'file') {
                            const file = await entry.getFile();
                            const fileId = `${file.name}-${file.size}-${file.lastModified}`;

                            // Skip files already processed or modified at/before driveResetAt
                            if (processedIds.includes(fileId)) continue;
                            if (resetAt && new Date(file.lastModified) <= resetAt) continue;

                            const docId = crypto.randomUUID();

                            fileCount++;
                            updatedProcessedIds.push(fileId);

                            // Handle PDF sync parsing (Default)
                            if (file.name.endsWith(".pdf")) {
                                try {
                                    const text = await extractTextFromPDF(file);
                                    const parsedItems = parseTransactionsFromPDFText(text, file.name);
                                    const syncItems = parsedItems.map(item => ({
                                        ...item,
                                        account: "Folder Import",
                                        source: "google-drive", // flag source as drive imports
                                        documentId: docId
                                    }));

                                    if (syncItems.length > 0) {
                                        const res = await handleAddTransactions(syncItems);
                                        newTxCount += res.inserted;
                                        duplicateCount += res.duplicates;
                                    }
                                } catch (err) {
                                    console.error("Error parsing PDF during sync:", err);
                                    showToast(`Failed to parse PDF "${file.name}": ${err.message}`, "error");
                                }
                            }
                            // Handle CSV sync parsing
                            else if (file.name.endsWith(".csv")) {
                                const text = await file.text();
                                const rows = parseCSVText(text);
                                if (rows.length >= 2) {
                                    // Parse with basic heuristic columns
                                    const headers = rows[0].map(h => String(h).toLowerCase());
                                    const dateIdx = headers.findIndex(h => h.includes("date"));
                                    const descIdx = headers.findIndex(h => h.includes("desc") || h.includes("merchant") || h.includes("payee") || h.includes("name"));
                                    const amtIdx = headers.findIndex(h => h.includes("amount") || h.includes("debit") || h.includes("credit"));

                                    if (dateIdx !== -1 && descIdx !== -1 && amtIdx !== -1) {
                                        const syncItems = [];
                                        for (let i = 1; i < rows.length; i++) {
                                            const r = rows[i];
                                            const dateVal = r[dateIdx];
                                            const descVal = r[descIdx];
                                            const amtVal = parseFloat(String(r[amtIdx] || "0").replace(/[^\d.-]/g, ''));
                                            
                                            if (dateVal && descVal && !isNaN(amtVal)) {
                                                syncItems.push({
                                                    date: new Date(dateVal).toISOString().split('T')[0],
                                                    merchant: descVal,
                                                    amount: Math.abs(amtVal),
                                                    type: amtVal >= 0 ? "income" : "expense",
                                                    account: "Folder Import",
                                                    source: "google-drive", // flag source as drive imports
                                                    documentId: docId
                                                });
                                            }
                                        }

                                        if (syncItems.length > 0) {
                                            const res = await handleAddTransactions(syncItems);
                                            newTxCount += res.inserted;
                                            duplicateCount += res.duplicates;
                                        }
                                    }
                                }
                            }

                            // Store Document vault metadata & binary contents (Section 17.2/4.2)
                            await saveDocumentInDB({
                                id: docId,
                                filename: file.name,
                                mimeType: file.type || "application/octet-stream",
                                size: file.size,
                                status: "stored",
                                source: "google-drive",
                                createdAt: new Date(file.lastModified).toISOString(),
                                fileData: file // Save original file bytes as Blob object
                            });
                        }
                    }

                    // Save settings changes
                    await updateSetting("processedFileIds", updatedProcessedIds);
                    await updateSetting("driveSyncMetadata", {
                        lastSync: new Date().toISOString(),
                        folderName: dirHandle.name,
                        filesScanned: fileCount,
                        transactionsAdded: newTxCount,
                        duplicatesSkipped: duplicateCount
                    });
                    
                    showToast(`Sync Complete! Added ${newTxCount} transactions, stored ${fileCount} files.`);
                    loadState();
                } catch(e) {
                    if (e.name !== "AbortError") {
                        showToast("Folder sync cancelled or failed", "error");
                    }
                }
            };

            const filteredTx = filterTransactionsByPeriod(transactions, settings.selectedPeriod);

                </div>
            );
        };

        // --- SUB-PAGE: Dashboard ---

        // --- SUB-COMPONENT: Custom SVG Line/Area Cash Flow Chart ---
        const CashFlowSvgChart = ({ transactions, settings }) => {
            // Group transactions by month (last 7 months)
            const monthsNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const monthlyTotals = {};

            // Initialize last 7 months
            const today = new Date();
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
                const label = `${monthsNames[d.getMonth()]} ${String(d.getFullYear()).slice(-2)}`;
                monthlyTotals[label] = { income: 0, expense: 0, dateObj: d };
            }

            // Fill transactions data into months
            transactions.forEach(t => {
                const tDate = new Date(t.date);
                if (isNaN(tDate.getTime())) return;
                const label = `${monthsNames[tDate.getMonth()]} ${String(tDate.getFullYear()).slice(-2)}`;
                
                if (monthlyTotals[label]) {
                    if (t.type === "income") {
                        monthlyTotals[label].income += t.amount;
                    } else {
                        monthlyTotals[label].expense += t.amount;
                    }
                }
            });

            const keys = Object.keys(monthlyTotals);
            const dataPoints = keys.map(k => ({
                label: k,
                income: monthlyTotals[k].income,
                expense: monthlyTotals[k].expense
            }));

            // Find max value to scale chart
            const maxVal = Math.max(
                ...dataPoints.map(d => Math.max(d.income, d.expense)),
                100 // fallback min height
            );

            // Chart coordinate settings
            const width = 500;
            const height = 200;
            const paddingLeft = 40;
            const paddingRight = 10;
            const paddingTop = 10;
            const paddingBottom = 25;

            const chartWidth = width - paddingLeft - paddingRight;
            const chartHeight = height - paddingTop - paddingBottom;

            // X scale: mapping month index to pixel coordinate
            const getX = (idx) => paddingLeft + (idx / (dataPoints.length - 1)) * chartWidth;
            // Y scale: mapping value to pixel coordinate
            const getY = (val) => height - paddingBottom - (val / maxVal) * chartHeight;

            // Path lines generator
            let incomePoints = "";
            let expensePoints = "";

            dataPoints.forEach((d, idx) => {
                const x = getX(idx);
                const yInc = getY(d.income);
                const yExp = getY(d.expense);

                incomePoints += `${idx === 0 ? 'M' : 'L'} ${x} ${yInc} `;
                expensePoints += `${idx === 0 ? 'M' : 'L'} ${x} ${yExp} `;
            });

            // Path area generator (closing path to bottom grid line)
            const x0 = getX(0);
            const xN = getX(dataPoints.length - 1);
            const yBottom = getY(0);

            const incomeArea = incomePoints ? `${incomePoints} L ${xN} ${yBottom} L ${x0} ${yBottom} Z` : "";
            const expenseArea = expensePoints ? `${expensePoints} L ${xN} ${yBottom} L ${x0} ${yBottom} Z` : "";

            return (
                <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column' }}>
                    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height="100%">
                        
                        {/* Horizontal Grid lines */}
                        {[0, 0.25, 0.5, 0.75, 1].map((ratio, idx) => {
                            const val = maxVal * ratio;
                            const y = getY(val);
                            return (
                                <g key={idx}>
                                    <line x1={paddingLeft} y1={y} x2={width - paddingRight} y2={y} stroke="var(--border-color)" strokeWidth="0.5" strokeDasharray="4 4" />
                                    <text x={paddingLeft - 6} y={y + 3} textAnchor="end" fill="var(--text-light)" fontSize="8px">
                                        {getCurrencySymbol(settings?.currency || "INR")}{Math.round(val)}
                                    </text>
                                </g>
                            );
                        })}

                        {/* Fill Area curves */}
                        {incomeArea && <path d={incomeArea} fill="rgba(16, 185, 129, 0.08)" />}
                        {expenseArea && <path d={expenseArea} fill="rgba(245, 158, 11, 0.08)" />}

                        {/* Stroke lines */}
                        {incomePoints && <path d={incomePoints} fill="none" stroke="var(--success)" strokeWidth="2" strokeLinecap="round" />}
                        {expensePoints && <path d={expensePoints} fill="none" stroke="var(--warning)" strokeWidth="2" strokeLinecap="round" />}

                        {/* Data dots */}
                        {dataPoints.map((d, idx) => (
                            <g key={idx}>
                                <circle cx={getX(idx)} cy={getY(d.income)} r="3" fill="var(--success)" stroke="#FFFFFF" strokeWidth="1" />
                                <circle cx={getX(idx)} cy={getY(d.expense)} r="3" fill="var(--warning)" stroke="#FFFFFF" strokeWidth="1" />
                            </g>
                        ))}

                        {/* Month X Labels */}
                        {dataPoints.map((d, idx) => (
                            <text key={idx} x={getX(idx)} y={height - 8} textAnchor="middle" fill="var(--text-muted)" fontSize="9px">
                                {d.label}
                            </text>
                        ))}
                    </svg>

                    {/* Custom Legend */}
                    <div style={{ display: 'flex', gap: '16px', justifyContent: 'center', fontSize: '0.8rem', marginTop: '10px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                            <span style={{ width: '12px', height: '4px', backgroundColor: 'var(--success)', borderRadius: '2px' }}></span>
                            <span style={{ color: 'var(--text-muted)', fontWeight: 500 }}>Income</span>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                            <span style={{ width: '12px', height: '4px', backgroundColor: 'var(--warning)', borderRadius: '2px' }}></span>
                            <span style={{ color: 'var(--text-muted)', fontWeight: 500 }}>Expenses</span>
                        </div>
                    </div>
                </div>
            );
        };

        // --- SUB-COMPONENT: Custom SVG Category Donut Spend Chart ---
        const CategoryDonutSvgChart = ({ breakdown, total, settings }) => {
            const categories = Object.keys(breakdown);
            const data = categories.map(cat => ({
                label: cat,
                value: breakdown[cat],
                percentage: total > 0 ? (breakdown[cat] / total) * 100 : 0
            })).sort((a, b) => b.value - a.value);

            // Palette colors for sectors
            const colors = ["#6558D3", "#3B82F6", "#10B981", "#F59E0B", "#EF4444", "#EC4899", "#8B5CF6", "#06B6D4", "#10B981", "#6B7280"];

            // Render SVG Donut
            let accumulatedAngle = 0;
            const segments = data.map((d, idx) => {
                const angle = (d.value / total) * 360;
                const strokeDashOffset = 100 - (accumulatedAngle / 360) * 100;
                const strokeDashArray = `${(d.value / total) * 100} ${100 - (d.value / total) * 100}`;
                
                accumulatedAngle += angle;
                return {
                    ...d,
                    color: colors[idx % colors.length],
                    strokeDashArray,
                    strokeDashOffset
                };
            });

            return (
                <div style={{ width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                    <div style={{ width: '130px', height: '130px', position: 'relative' }}>
                        <svg width="100%" height="100%" viewBox="0 0 42 42">
                            {/* Inner gray background circle */}
                            <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="#E5E7EB" strokeWidth="3"></circle>
                            
                            {/* Colorful donut sectors */}
                            {segments.map((seg, idx) => (
                                <circle 
                                    key={idx}
                                    cx="21"
                                    cy="21"
                                    r="15.915"
                                    fill="transparent"
                                    stroke={seg.color}
                                    strokeWidth="3.5"
                                    strokeDasharray={seg.strokeDashArray}
                                    strokeDashoffset={seg.strokeDashOffset}
                                    transform="rotate(-90 21 21)"
                                ></circle>
                            ))}
                        </svg>
                        
                        {/* Centered Total Display text */}
                        <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', textAlign: 'center' }}>
                            <span style={{ fontSize: '0.7rem', textTransform: 'uppercase', color: 'var(--text-muted)', display: 'block', fontWeight: 500 }}>Total</span>
                            <span style={{ fontSize: '0.95rem', fontWeight: 700, color: 'var(--text-main)' }}>
                                {getCurrencySymbol(settings?.currency || "INR")}{Math.round(total)}
                            </span>
                        </div>
                    </div>

                    {/* Donut Legend */}
                    <ul className="chart-legend">
                        {segments.map((seg, idx) => (
                            <li key={idx} className="chart-legend-item">
                                <div className="legend-color-label">
                                    <span className="legend-color-dot" style={{ backgroundColor: seg.color }}></span>
                                    <span style={{ fontWeight: 500, color: 'var(--text-muted)' }}>{seg.label}</span>
                                </div>
                                <span className="legend-value-percent">
                                    {getCurrencySymbol(settings?.currency || "INR")}{Math.round(seg.value)} ({Math.round(seg.percentage)}%)
                                </span>
                            </li>
                        ))}
                    </ul>
                </div>
            );
        };


        // --- SUB-PAGE: Transactions ---
        const TransactionsPage = ({ transactions, settings, onDelete, onPatch, onAdd, tags, updateSetting }) => {
            const [search, setSearch] = React.useState("");

                                <option value="all">All Accounts</option>
                                {accounts.map(a => <option key={a} value={a}>{a}</option>)}
                            </select>
                        </div>
                    </div>

                    {/* Ledger Table */}
                    {filtered.length === 0 ? (
                        <div className="empty-state">
                            <Icon name="transactions" currency={settings.currency} />
                            <h3>No Records Matching Filters</h3>
                            <p>Try refining your search terms or date filter options.</p>
                        </div>
                    ) : (
                        <div className="table-responsive">
                            <table className="table">

                                    <tr>
                                        <th>Date</th>

                                        <th>Account</th>
                                        <th>Tags</th>
                                        <th>Amount</th>
                                        <th style={{ width: '60px' }}></th>
                                    </tr>
                                </thead>
                                <tbody>

                                                {t.receipt === 1 && (
                                                    <span title="Receipt attached" style={{ marginLeft: '6px', color: 'var(--primary)', cursor: 'pointer' }}>
                                                        📎
                                                    </span>
                                                )}
                                            </td>
                                            
                                            {/* Inline category editor cell (Section 7.1) */}
                                            <td>
                                                <select 
                                                    className="select-cell-inline"
                                                    value={t.category}
                                                    onChange={(e) => onPatch(t.id, { category: e.target.value })}

        // --- SUB-PAGE: Recurring (Section 10) ---
        const RecurringPage = ({ transactions, settings, suggested, updateSetting, showToast }) => {
            const confirmedList = settings.recurring || [];

            // Calculate metrics (Section 10 - monthly and annual estimates without double counting)
            const confirmedMonthlySum = confirmedList.reduce((sum, item) => {
                let monthlyEquivalent = item.amount;
                if (item.cadence === "weekly") monthlyEquivalent = (item.amount * 52) / 12;
                else if (item.cadence === "biweekly") monthlyEquivalent = (item.amount * 26) / 12;
                else if (item.cadence === "quarterly") monthlyEquivalent = item.amount / 3;
                else if (item.cadence === "annual") monthlyEquivalent = item.amount / 12;
                return sum + monthlyEquivalent;
            }, 0);

            const formatCurrency = (val) => formatCurrencyVal(val, settings.currency || "INR");

            const handleKeepSuggestion = async (item) => {
                const updatedList = [...confirmedList, {
                    id: crypto.randomUUID(),
                    name: item.merchantDisplay,
                    category: item.category,
                    amount: item.averageCharge,
                    cadence: item.cadence,
                    nextDate: item.nextDate,
                    active: true
                }];
                await updateSetting("recurring", updatedList);
                showToast(`Kept suggestion for "${item.merchantDisplay}"`);
            };

            const handleIgnoreSuggestion = async (item) => {
                const dismissed = settings.dismissedPatterns || [];
                const updatedDismissed = [...dismissed, item.merchantNormalized];
                await updateSetting("dismissedPatterns", updatedDismissed);
                showToast(`Ignored suggestion for "${item.merchantDisplay}"`);
            };

            const handleRemoveConfirmed = async (id) => {
                const updatedList = confirmedList.filter(c => c.id !== id);
                await updateSetting("recurring", updatedList);
                showToast("Confirmed recurring payment removed");

            return (

                        </div>
                        <div className="card">
                            <span className="card-title">Estimated Annual Commitment</span>
                            <div className="card-value" style={{ color: 'var(--primary)', marginTop: '8px' }}>{formatCurrency(confirmedMonthlySum * 12)}</div>

                            <div className="table-responsive">
                                <table className="table">
                                    <thead>
                                        <tr>
                                            <th>Service/Merchant</th>
                                            <th>Category</th>
                                            <th>Cadence</th>
                                            <th>Charges</th>
                                            <th>Monthly Eq.</th>
                                            <th>Next Expected</th>
                                            <th>Confidence</th>
                                            <th>Actions</th>

                                    </thead>
                                    <tbody>
                                        {suggested.map((s, idx) => (

                                                <td>{s.category}</td>
                                                <td>{s.cadence}</td>
                                                <td>{s.occurrences}x ({formatCurrency(s.averageCharge)})</td>
                                                <td>{formatCurrency(s.monthlyEquivalent)}</td>
                                                <td>{s.nextDate}</td>
                                                <td>
                                                    <span className={`badge ${s.confidence === "high" ? "badge-income" : "badge-queued"}`}>
                                                        {s.confidence}
                                                    </span>
                                                </td>

                                                    <div style={{ display: 'flex', gap: '6px' }}>

                                                        <button className="btn btn-secondary btn-sm" onClick={() => handleIgnoreSuggestion(s)}>Ignore</button>
                                                    </div>

                        showToast(`File "${file.name}" exceeds 20 MB size limit`, "error");
                        continue;

                        id: docId,
                        filename: file.name,
                        mimeType: file.type || "application/octet-stream",
                        size: file.size,
                        status: "stored",
                        source: "upload",
                        createdAt: new Date().toISOString(),
                        fileData: file // Save Blob bytes locally
                    });
                    uploadCount++;

                    loadState();
                }

                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB'];

        // --- MODAL COMPONENT: Import File Dialog (PDF default, CSV fallback) ---
        const ImportFileModal = ({ onClose, onCsvParsed, onPdfParsed, showToast }) => {
            const [importType, setImportType] = React.useState("pdf");
            const [processing, setProcessing] = React.useState(false);

            const handleFileChange = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;

                setProcessing(true);
                try {
                    if (importType === "pdf" || file.name.toLowerCase().endsWith(".pdf")) {
                        // PDF parsing
                        const text = await extractTextFromPDF(file);
                        const parsedTx = parseTransactionsFromPDFText(text, file.name);
                        onPdfParsed(parsedTx, file.name, file);
                    } else {
                        // CSV parsing
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const text = event.target.result;
                            const rows = parseCSVText(text);
                            onCsvParsed(rows, file.name);
                        };
                        reader.readAsText(file);
                    }
                } catch (err) {
                    console.error("Manual upload parse error:", err);
                    showToast(`Error parsing file: ${err.message}`, "error");
                } finally {
                    setProcessing(false);
                }
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-container">
                        <div className="modal-header">
                            <h3 className="modal-title">Import Statement / Receipt</h3>
                            <button className="modal-close-btn" onClick={onClose} disabled={processing}>
                                <Icon name="close" />
                            </button>
                        </div>
                        <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                            <p style={{ color: 'var(--text-muted)', fontSize: '0.875rem' }}>
                                Import your financial data. Choose your file type below. PDF is preferred and selected by default.
                            </p>

                            {/* Segmented Selection Control */}
                            <div className="segmented-control">
                                <button 
                                    className={`segmented-btn ${importType === "pdf" ? "active income" : ""}`}
                                    onClick={() => setImportType("pdf")}
                                    disabled={processing}
                                    style={{ padding: '6px 10px', fontSize: '0.85rem' }}
                                >
                                    PDF Statement / Receipt (Default)
                                </button>
                                <button 
                                    className={`segmented-btn ${importType === "csv" ? "active expense" : ""}`}
                                    onClick={() => setImportType("csv")}
                                    disabled={processing}
                                    style={{ padding: '6px 10px', fontSize: '0.85rem' }}
                                >
                                    CSV Bank Statement
                                </button>
                            </div>

                            {processing ? (
                                <div style={{ textAlign: 'center', padding: '30px 0' }}>
                                    <div style={{ border: '3px solid #f3f3f3', borderTop: '3px solid var(--primary)', borderRadius: '50%', width: '30px', height: '30px', animation: 'spin 1s linear infinite', margin: '0 auto 12px auto' }}></div>
                                    <p style={{ color: 'var(--text-muted)', fontWeight: 500 }}>Extracting text and identifying transactions...</p>
                                </div>
                            ) : (
                                <label className="upload-zone">
                                    <Icon name="download" />
                                    <div>
                                        <h4 style={{ fontWeight: 600, color: 'var(--text-main)' }}>
                                            {importType === "pdf" ? "Click to pick PDF statement or receipt" : "Click to pick CSV statement"}
                                        </h4>
                                        <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '4px' }}>
                                            {importType === "pdf" ? "Accepts protected or unprotected PDFs" : "CSV spreadsheet format"}
                                        </p>
                                    </div>
                                    <input 
                                        type="file" 
                                        style={{ display: 'none' }} 
                                        accept={importType === "pdf" ? ".pdf" : ".csv"} 
                                        onChange={handleFileChange} 
                                    />
                                </label>
                            )}
                        </div>
                        <div className="modal-footer">
                            <button className="btn btn-secondary" onClick={onClose} disabled={processing}>Cancel</button>
                        </div>
                    </div>
                </div>
            );
        };


        // --- DIALOG COMPONENT: PDF Transaction Verification Dialog ---
        const PdfImportConfirmDialog = ({ pdfImportData, onClose, onConfirm, settings }) => {
            const { transactions, filename } = pdfImportData;
            
            // Local state to keep track of edited fields and selection status
            const [items, setItems] = React.useState(
                transactions.map((t, idx) => ({
                    ...t,
                    tempId: idx, // unique internal id
                    selected: true // default to selected
                }))
            );

            const handleToggleSelectAll = (e) => {
                const checked = e.target.checked;
                setItems(prev => prev.map(item => ({ ...item, selected: checked })));
            };

            const handleToggleItem = (tempId) => {
                setItems(prev => prev.map(item => 
                    item.tempId === tempId ? { ...item, selected: !item.selected } : item
                ));
            };

            const handleFieldChange = (tempId, field, value) => {
                setItems(prev => prev.map(item => 
                    item.tempId === tempId ? { ...item, [field]: value } : item
                ));
            };

            const handleSave = () => {
                const selectedItems = items
                    .filter(item => item.selected)
                    .map(({ tempId, selected, ...rest }) => rest);
                onConfirm(selectedItems);
            };

            const allSelected = items.length > 0 && items.every(item => item.selected);
            const selectedCount = items.filter(item => item.selected).length;
            const categories = settings.categories || ["Needs review"];

            return (
                <div className="modal-overlay">
                    <div className="modal-container modal-lg" style={{ maxWidth: '900px' }}>
                        <div className="modal-header">
                            <h3 className="modal-title">Verify Extracted Transactions: {filename}</h3>
                            <button className="modal-close-btn" onClick={onClose}>
                                <Icon name="close" />
                            </button>
                        </div>
                        <div className="modal-body" style={{ maxHeight: '60vh', overflowY: 'auto' }}>
                            <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem', marginBottom: '16px' }}>
                                We found <strong>{items.length}</strong> transactions in the PDF. Review the parsed values and select the ones you want to import.
                            </p>

                            {items.length === 0 ? (
                                <div className="empty-state" style={{ padding: '30px 10px' }}>
                                    <Icon name="alert" />
                                    <h3>No Transactions Detected</h3>
                                    <p>We couldn't extract any structured transactions from this PDF. You can upload it as a record or type your transaction manually.</p>
                                </div>
                            ) : (
                                <div className="table-responsive">
                                    <table className="table" style={{ minWidth: '800px' }}>
                                        <thead>
                                            <tr>
                                                <th style={{ width: '40px' }}>
                                                    <input 
                                                        type="checkbox" 
                                                        checked={allSelected} 
                                                        onChange={handleToggleSelectAll} 
                                                        style={{ transform: 'scale(1.2)' }}
                                                    />
                                                </th>
                                                <th style={{ width: '140px' }}>Date</th>
                                                <th>Merchant</th>
                                                <th style={{ width: '160px' }}>Category</th>
                                                <th style={{ width: '120px' }}>Amount</th>
                                                <th style={{ width: '120px' }}>Type</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {items.map((item) => (
                                                <tr key={item.tempId} style={{ opacity: item.selected ? 1 : 0.6 }}>
                                                    <td>
                                                        <input 
                                                            type="checkbox" 
                                                            checked={item.selected} 
                                                            onChange={() => handleToggleItem(item.tempId)}
                                                            style={{ transform: 'scale(1.2)' }}
                                                        />
                                                    </td>
                                                    <td>
                                                        <input 
                                                            type="date" 
                                                            className="form-control" 
                                                            style={{ height: '32px', fontSize: '0.85rem', width: '100%', padding: '4px 6px' }}
                                                            value={item.date} 
                                                            onChange={(e) => handleFieldChange(item.tempId, "date", e.target.value)}
                                                        />
                                                    </td>
                                                    <td>
                                                        <input 
                                                            type="text" 
                                                            className="form-control" 
                                                            style={{ height: '32px', fontSize: '0.85rem', width: '100%', padding: '4px 8px' }}
                                                            value={item.merchant} 
                                                            onChange={(e) => handleFieldChange(item.tempId, "merchant", e.target.value)}
                                                        />
                                                    </td>
                                                    <td>
                                                        <select 
                                                            className="form-control" 
                                                            style={{ height: '32px', fontSize: '0.85rem', width: '100%', padding: '4px 8px' }}
                                                            value={item.category} 
                                                            onChange={(e) => handleFieldChange(item.tempId, "category", e.target.value)}
                                                        >
                                                            {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                                        </select>
                                                    </td>
                                                    <td>
                                                        <input 
                                                            type="number" 
                                                            step="0.01"
                                                            className="form-control" 
                                                            style={{ height: '32px', fontSize: '0.85rem', width: '100%', padding: '4px 8px' }}
                                                            value={item.amount} 
                                                            onChange={(e) => handleFieldChange(item.tempId, "amount", parseFloat(e.target.value) || 0)}
                                                        />
                                                    </td>
                                                    <td>
                                                        <select 
                                                            className="form-control" 
                                                            style={{ height: '32px', fontSize: '0.85rem', width: '100%', padding: '4px 8px' }}
                                                            value={item.type} 
                                                            onChange={(e) => handleFieldChange(item.tempId, "type", e.target.value)}
                                                        >
                                                            <option value="expense">Expense</option>
                                                            <option value="income">Income</option>
                                                        </select>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                        <div className="modal-footer">
                            <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
                            <button 
                                className="btn btn-primary" 
                                onClick={handleSave}
                                disabled={selectedCount === 0}
                            >
                                Import {selectedCount} Transaction{selectedCount !== 1 ? 's' : ''}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };


        // --- DIALOG COMPONENT: CSV Column Mapping Dialog ---
        const CsvMappingDialog = ({ mappingData, onClose, onConfirm }) => {
            const { headers, filename } = mappingData;
            const [mappings, setMappings] = React.useState({
                date: 0,
                merchant: 1,
                amount: 2,
                type: -1,
                debit: -1,
                credit: -1
            });

            const [useDebitCredit, setUseDebitCredit] = React.useState(false);

            const handleSave = () => {
                onConfirm(mappings);
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-container modal-lg">
                        <div className="modal-header">
                            <h3 className="modal-title">Map Columns for: {filename}</h3>
                            <button className="modal-close-btn" onClick={onClose}>
                                <Icon name="close" />
                            </button>
                        </div>
                        <div className="modal-body">
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                                <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                                    Match the headers from your bank statement file columns to the correct schema properties.
                                </p>

                                <div style={{ display: 'flex', gap: '16px', alignItems: 'center' }}>
                                    <label style={{ display: 'flex', alignItems: 'center', gap: '8px', fontWeight: 500, fontSize: '0.9rem', cursor: 'pointer' }}>
                                        <input 
                                            type="checkbox" 
                                            checked={useDebitCredit} 
                                            onChange={(e) => setUseDebitCredit(e.target.checked)}
                                            style={{ transform: 'scale(1.2)' }}
                                        />
                                        <span>Use separate Debit & Credit columns</span>
                                    </label>
                                </div>

                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                                    
                                    <div className="form-field">
                                        <label>Transaction Date Column</label>
                                        <select 
                                            className="form-control" 
                                            value={mappings.date} 
                                            onChange={(e) => setMappings({ ...mappings, date: parseInt(e.target.value) })}
                                        >
                                            {headers.map(h => <option key={h.index} value={h.index}>{h.name}</option>)}
                                        </select>
                                    </div>

                                    <div className="form-field">
                                        <label>Merchant / Description Column</label>
                                        <select 
                                            className="form-control" 
                                            value={mappings.merchant} 
                                            onChange={(e) => setMappings({ ...mappings, merchant: parseInt(e.target.value) })}
                                        >
                                            {headers.map(h => <option key={h.index} value={h.index}>{h.name}</option>)}
                                        </select>
                                    </div>

                                    {!useDebitCredit ? (
                                        <>
                                            <div className="form-field">
                                                <label>Amount Column</label>
                                                <select 
                                                    className="form-control" 
                                                    value={mappings.amount} 
                                                    onChange={(e) => setMappings({ ...mappings, amount: parseInt(e.target.value) })}
                                                >
                                                    {headers.map(h => <option key={h.index} value={h.index}>{h.name}</option>)}
                                                </select>
                                            </div>

                                            <div className="form-field">
                                                <label>Income/Expense Flag Column (Optional)</label>
                                                <select 
                                                    className="form-control" 
                                                    value={mappings.type} 
                                                    onChange={(e) => setMappings({ ...mappings, type: parseInt(e.target.value) })}
                                                >
                                                    <option value={-1}>Detect from Amount (+/-)</option>
                                                    {headers.map(h => <option key={h.index} value={h.index}>{h.name}</option>)}
                                                </select>
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            <div className="form-field">
                                                <label>Debit Amount Column (Expenses)</label>
                                                <select 
                                                    className="form-control" 
                                                    value={mappings.debit} 
                                                    onChange={(e) => setMappings({ ...mappings, debit: parseInt(e.target.value) })}
                                                >
                                                    <option value={-1}>-- Select Column --</option>
                                                    {headers.map(h => <option key={h.index} value={h.index}>{h.name}</option>)}
                                                </select>
                                            </div>

                                            <div className="form-field">
                                                <label>Credit Amount Column (Incomes)</label>
                                                <select 
                                                    className="form-control" 
                                                    value={mappings.credit} 
                                                    onChange={(e) => setMappings({ ...mappings, credit: parseInt(e.target.value) })}
                                                >
                                                    <option value={-1}>-- Select Column --</option>
                                                    {headers.map(h => <option key={h.index} value={h.index}>{h.name}</option>)}
                                                </select>
                                            </div>
                                        </>
                                    )}

                                </div>

                                <div className="section-card" style={{ padding: '14px', backgroundColor: '#F9FAFB' }}>
                                    <h4 style={{ fontSize: '0.85rem', fontWeight: 600, marginBottom: '6px' }}>Row Sample Preview:</h4>
                                    <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                                        {headers.slice(0, 5).map(h => (
                                            <span key={h.index} style={{ fontSize: '0.75rem', backgroundColor: '#FFFFFF', padding: '4px 8px', borderRadius: '4px', border: '1px solid var(--border-color)' }}>
                                                <strong>{h.name}</strong>: {mappingData.rows[0]?.[h.index] || "-"}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="modal-footer">
                            <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
                            <button className="btn btn-primary" onClick={handleSave}>Confirm Map & Import</button>
                        </div>
                    </div>
                </div>
            );
        };


        // --- MODAL COMPONENT: Tag Manager Modal (Section 7.2) ---
        const TagManagerModal = ({ tx, tags, onClose, onSave }) => {
            const [selected, setSelected] = React.useState([...(tx.tags || [])]);
            const [newTagName, setNewTagName] = React.useState("");

            const handleToggle = (tag) => {
                if (selected.includes(tag)) {
                    setSelected(selected.filter(t => t !== tag));
                } else {
                    setSelected([...selected, tag]);
                }
            };

            const handleCreate = () => {
                const name = newTagName.trim();
                if (!name) return;
                
                if (!selected.includes(name)) {
                    setSelected([...selected, name]);
                }
                setNewTagName("");
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave(selected);
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-container">
                        <div className="modal-header">
                            <h3 className="modal-title">Tag Transaction: {tx.merchant}</h3>
                            <button className="modal-close-btn" onClick={onClose}>
                                <Icon name="close" />
                            </button>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="modal-body">
                                <div className="form-grid">
                                    <div className="form-field">
                                        <label>Attach New Tag</label>
                                        <div style={{ display: 'flex', gap: '8px' }}>
                                            <input 
                                                type="text" 
                                                className="form-control" 
                                                placeholder="Type Tag name..." 
                                                value={newTagName}
                                                onChange={(e) => setNewTagName(e.target.value)}
                                                style={{ flex: 1 }}
                                            />
                                            <button type="button" className="btn btn-secondary" onClick={handleCreate}>Add</button>
                                        </div>
                                    </div>

                                    <div className="form-field">
                                        <label>Available Tags</label>
                                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px', maxHeight: '120px', overflowY: 'auto', padding: '6px', border: '1px solid var(--border-color)', borderRadius: '6px' }}>
                                            {tags.length === 0 && selected.length === 0 ? (
                                                <span style={{ fontSize: '0.8rem', color: 'var(--text-light)' }}>No tags created</span>
                                            ) : (
                                                // Unique tags
                                                Array.from(new Set([...tags.map(t => t.name), ...selected])).map(tagName => (
                                                    <span 
                                                        key={tagName}
                                                        onClick={() => handleToggle(tagName)}
                                                        style={{
                                                            cursor: 'pointer',
                                                            padding: '4px 10px',
                                                            borderRadius: '6px',
                                                            fontSize: '0.75rem',
                                                            fontWeight: 500,
                                                            backgroundColor: selected.includes(tagName) ? 'var(--primary)' : 'var(--bg-color)',
                                                            color: selected.includes(tagName) ? '#FFFFFF' : 'var(--text-main)',
                                                            border: '1px solid var(--border-color)'
                                                        }}
                                                    >
                                                        {tagName}
                                                    </span>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                                <button type="submit" className="btn btn-primary">Save Tags</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };


        // --- MODAL COMPONENT: Create Budget Modal ---
        const CreateBudgetModal = ({ onClose, onSave, settings }) => {
            const categories = settings.categories || [];
            const [category, setCategory] = React.useState(categories[0] || "");
            const [limit, setLimit] = React.useState("");

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!category || !limit || isNaN(limit) || parseFloat(limit) <= 0) return;
                onSave({ category, limit: parseFloat(limit) });
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-container">
                        <div className="modal-header">
                            <h3 className="modal-title">Create Monthly Budget</h3>
                            <button className="modal-close-btn" onClick={onClose}>
                                <Icon name="close" />
                            </button>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="modal-body">
                                <div className="form-grid">
                                    <div className="form-field">
                                        <label>Category Envelope</label>
                                        <select className="form-control" value={category} onChange={(e) => setCategory(e.target.value)}>
                                            {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>

                                    <div className="form-field">
                                        <label>Monthly Limit ($)</label>
                                        <input 
                                            type="number" 
                                            step="1" 
                                            className="form-control" 
                                            placeholder="500" 
                                            value={limit} 
                                            onChange={(e) => setLimit(e.target.value)} 
                                            required 
                                        />
                                    </div>
                                </div>
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                                <button type="submit" className="btn btn-primary">Establish Limit</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };


        // --- MODAL COMPONENT: Create Goal Modal ---
        const CreateGoalModal = ({ onClose, onSave }) => {
            const [name, setName] = React.useState("");
            const [target, setTarget] = React.useState("");
            const [current, setCurrent] = React.useState("");
            const [dueDate, setDueDate] = React.useState("");
            const [note, setNote] = React.useState("");

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!name || !target || isNaN(target) || parseFloat(target) <= 0) return;
                
                onSave({
                    name,
                    target: parseFloat(target),
                    current: parseFloat(current || "0"),
                    dueDate,
                    note
                });
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-container">
                        <div className="modal-header">
                            <h3 className="modal-title">Create Savings Goal</h3>
                            <button className="modal-close-btn" onClick={onClose}>
                                <Icon name="close" />
                            </button>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="modal-body">
                                <div className="form-grid">
                                    <div className="form-field">
                                        <label>Goal Name</label>
                                        <input 
                                            type="text" 
                                            className="form-control" 
                                            placeholder="e.g. Vacation Trip, Emergency Fund" 
                                            value={name} 
                                            onChange={(e) => setName(e.target.value)} 
                                            required 
                                        />
                                    </div>

                                    <div className="form-row">
                                        <div className="form-field">
                                            <label>Target Amount ($)</label>
                                            <input 
                                                type="number" 
                                                className="form-control" 
                                                placeholder="5000" 
                                                value={target} 
                                                onChange={(e) => setTarget(e.target.value)} 
                                                required 
                                            />
                                        </div>
                                        <div className="form-field">
                                            <label>Current Capital ($)</label>
                                            <input 
                                                type="number" 
                                                className="form-control" 
                                                placeholder="500" 
                                                value={current} 
                                                onChange={(e) => setCurrent(e.target.value)} 
                                            />
                                        </div>
                                    </div>

                                    <div className="form-field">
                                        <label>Target Completion Date</label>
                                        <input 
                                            type="date" 
                                            className="form-control" 
                                            value={dueDate} 
                                            onChange={(e) => setDueDate(e.target.value)} 
                                        />
                                    </div>

                                    <div className="form-field">
                                        <label>Memo / Notes</label>
                                        <textarea 
                                            className="form-control" 
                                            placeholder="Notes about budget cuts..." 
                                            value={note} 
                                            onChange={(e) => setNote(e.target.value)}
                                            style={{ height: '60px', resize: 'none' }}
                                        />
                                    </div>
                                </div>
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                                <button type="submit" className="btn btn-primary">Create Goal</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };


        // --- MODAL COMPONENT: Create Rule Modal ---
        const CreateRuleModal = ({ onClose, onSave, categories }) => {
            const [whenText, setWhenText] = React.useState("");
            const [thenText, setThenText] = React.useState(categories[0] || "");

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!whenText || !thenText) return;
                
                onSave({
                    id: crypto.randomUUID(),
                    whenText,
                    thenText,
                    enabled: 1,
                    createdAt: new Date().toISOString()
                });
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-container">
                        <div className="modal-header">
                            <h3 className="modal-title">Create Categorization Rule</h3>
                            <button className="modal-close-btn" onClick={onClose}>
                                <Icon name="close" />
                            </button>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="modal-body">
                                <div className="form-grid">
                                    <div className="form-field">
                                        <label>When Merchant Name Contains:</label>
                                        <input 
                                            type="text" 
                                            className="form-control" 
                                            placeholder="e.g. netflix, chevron, groceries" 
                                            value={whenText} 
                                            onChange={(e) => setWhenText(e.target.value)} 
                                            required 
                                        />
                                    </div>

                                    <div className="form-field">
                                        <label>Then Categorize As:</label>
                                        <select className="form-control" value={thenText} onChange={(e) => setThenText(e.target.value)}>
                                            {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                                <button type="submit" className="btn btn-primary">Establish Rule</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- Render React App ---
        const container = document.getElementById("root");
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

    </script>
</body>
</html>
