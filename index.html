                                                        </label>
                                                    );
                                                })}
                                            </div>
                                            <p style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>
                                                Would you like to match this payment to the selected transaction or create a new transaction?
                                            </p>
                                        </div>
                                    ) : (
                                        <div>
                                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '10px 12px', borderRadius: '8px', background: '#FFFBEB', border: '1px solid #FCD34D', color: '#92400E', fontSize: '0.82rem', marginBottom: '12px' }}>
                                                <Icon name="info" />
                                                <span>No existing transaction found on <strong>{formatDate(markPaidModalItem.date, settings.dateFormat)}</strong> matching <strong>{formatCurrency(markPaidModalItem.amount)}</strong>.</span>
                                            </div>
                                            <p style={{ fontSize: '0.84rem', color: 'var(--text-main)' }}>
                                                Would you like to create a new transaction for this payment?
                                            </p>
                                        </div>
                                    )}
                                </div>
                                <div className="modal-footer" style={{ display: 'flex', gap: '8px', justifyContent: 'flex-end', padding: '12px 16px' }}>
                                    <button className="btn btn-secondary btn-sm" onClick={() => { setMarkPaidModalItem(null); setSelectedTxIdToLink(null); }}>
                                        Cancel
                                    </button>
                                    {candidateMatches.length > 0 ? (
                                        <>
                                            <button className="btn btn-secondary btn-sm" onClick={() => confirmMarkPaid(markPaidModalItem, null)}>
                                                Create New Transaction
                                            </button>
                                            <button className="btn btn-primary btn-sm" onClick={() => confirmMarkPaid(markPaidModalItem, selectedTxIdToLink || candidateMatches[0].id)}>
                                                Link Selected Transaction
                                            </button>
                                        </>
                                    ) : (
                                        <button className="btn btn-primary btn-sm" onClick={() => confirmMarkPaid(markPaidModalItem, null)}>
                                            Confirm & Create Transaction
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- SUB-COMPONENT: Custom SVG Line/Area Cash Flow Chart ---
        const CashFlowSvgChart = ({ transactions, settings }) => {
            const [hoveredIdx, setHoveredIdx] = React.useState(null);

            // Group transactions by month (last 7 months)
            const monthsNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const monthlyTotals = {};

            const today = new Date();
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
                const label = `${monthsNames[d.getMonth()]} ${String(d.getFullYear()).slice(-2)}`;
                monthlyTotals[label] = { income: 0, expense: 0, dateObj: d };
            }

            transactions.forEach(t => {
                const tDate = new Date(t.date);
                if (isNaN(tDate.getTime())) return;
                const label = `${monthsNames[tDate.getMonth()]} ${String(tDate.getFullYear()).slice(-2)}`;
                if (monthlyTotals[label]) {
                    if (t.type === "income") monthlyTotals[label].income += t.amount;
                    else monthlyTotals[label].expense += t.amount;
                }
            });

            const keys = Object.keys(monthlyTotals);
            const dataPoints = keys.map(k => ({
                label: k,
                income: monthlyTotals[k].income,
                expense: monthlyTotals[k].expense,
                net: monthlyTotals[k].income - monthlyTotals[k].expense
            }));

            const activeIdx = hoveredIdx !== null ? hoveredIdx : dataPoints.length - 1;
            const activePoint = dataPoints[activeIdx] || dataPoints[0];

            const maxVal = Math.max(
                ...dataPoints.map(d => Math.max(d.income, d.expense)),
                100
            );

            const width = 500;
            const height = 210;
            const paddingLeft = 45;
            const paddingRight = 15;
            const paddingTop = 20;
            const paddingBottom = 30;

            const chartWidth = width - paddingLeft - paddingRight;
            const chartHeight = height - paddingTop - paddingBottom;

            const getX = (idx) => paddingLeft + (idx / Math.max(1, dataPoints.length - 1)) * chartWidth;
            const getY = (val) => height - paddingBottom - (val / maxVal) * chartHeight;

            // Generate smooth Bezier curve string
            const generateSmoothPath = (points) => {
                if (!points || points.length === 0) return "";
                if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
                let path = `M ${points[0].x} ${points[0].y}`;
                for (let i = 0; i < points.length - 1; i++) {
                    const p0 = points[i];
                    const p1 = points[i + 1];
                    const mx = (p0.x + p1.x) / 2;
                    path += ` C ${mx} ${p0.y}, ${mx} ${p1.y}, ${p1.x} ${p1.y}`;
                }
                return path;
            };

            const incomePts = dataPoints.map((d, i) => ({ x: getX(i), y: getY(d.income) }));
            const expensePts = dataPoints.map((d, i) => ({ x: getX(i), y: getY(d.expense) }));

            const incomePath = generateSmoothPath(incomePts);
            const expensePath = generateSmoothPath(expensePts);

            const yBottom = getY(0);
            const x0 = getX(0);
            const xN = getX(dataPoints.length - 1);

            const incomeArea = incomePath ? `${incomePath} L ${xN} ${yBottom} L ${x0} ${yBottom} Z` : "";
            const expenseArea = expensePath ? `${expensePath} L ${xN} ${yBottom} L ${x0} ${yBottom} Z` : "";

            const formatCurrency = (val) => formatCurrencyVal(val, settings.currency || "INR");

            return (
                <div style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    {/* Header line with title and active point highlight */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div>
                            <span style={{ fontWeight: 600, fontSize: '1.05rem', color: 'var(--text-main)' }}>Cash Flow Trends</span>
                            <span style={{ fontSize: '0.78rem', color: 'var(--text-muted)', marginLeft: '8px' }}>
                                ({activePoint.label})
                            </span>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px', fontSize: '0.82rem' }}>
                            <span style={{ color: 'var(--text-muted)' }}>Net:</span>
                            <span className="dashboard-badge-pill" style={{
                                background: activePoint.net >= 0 ? '#ECFDF5' : '#FEF2F2',
                                color: activePoint.net >= 0 ? '#059669' : '#DC2626',
                                border: activePoint.net >= 0 ? '1px solid #A7F3D0' : '1px solid #FECACA'
                            }}>
                                {activePoint.net >= 0 ? '+' : ''}{formatCurrency(activePoint.net)}
                            </span>
                        </div>
                    </div>

                    <div style={{ position: 'relative', width: '100%' }}>
                        <svg viewBox={`0 0 ${width} ${height}`} width="100%" height="100%" style={{ overflow: 'visible' }}>
                            <defs>
                                <linearGradient id="incGrad" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stopColor="#10B981" stopOpacity="0.22" />
                                    <stop offset="100%" stopColor="#10B981" stopOpacity="0.0" />
                                </linearGradient>
                                <linearGradient id="expGrad" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stopColor="#F59E0B" stopOpacity="0.22" />
                                    <stop offset="100%" stopColor="#F59E0B" stopOpacity="0.0" />
                                </linearGradient>
                            </defs>

                            {/* Horizontal Grid lines */}
                            {[0, 0.25, 0.5, 0.75, 1].map((ratio, idx) => {
                                const val = maxVal * ratio;
                                const y = getY(val);
                                return (
                                    <g key={idx}>
                                        <line x1={paddingLeft} y1={y} x2={width - paddingRight} y2={y} stroke="var(--border-color)" strokeWidth="0.5" strokeDasharray="4 4" />
                                        <text x={paddingLeft - 8} y={y + 3} textAnchor="end" fill="var(--text-light)" fontSize="8px">
                                            {getCurrencySymbol(settings?.currency || "INR")}{Math.round(val)}
                                        </text>
                                    </g>
                                );
                            })}

                            {/* Fill Areas */}
                            {incomeArea && <path d={incomeArea} fill="url(#incGrad)" />}
                            {expenseArea && <path d={expenseArea} fill="url(#expGrad)" />}

                            {/* Smooth Stroke Curves */}
                            {incomePath && <path d={incomePath} fill="none" stroke="#10B981" strokeWidth="2.5" strokeLinecap="round" />}
                            {expensePath && <path d={expensePath} fill="none" stroke="#F59E0B" strokeWidth="2.5" strokeLinecap="round" />}

                            {/* Vertical Focus Line for hovered month */}
                            {activeIdx !== null && (
                                <line
                                    x1={getX(activeIdx)}
                                    y1={paddingTop}
                                    x2={getX(activeIdx)}
                                    y2={height - paddingBottom}
                                    stroke="var(--primary)"
                                    strokeWidth="1.5"
                                    strokeDasharray="3 3"
                                    opacity="0.6"
                                />
                            )}

                            {/* Interactive Data Dots & Month Columns */}
                            {dataPoints.map((d, idx) => {
                                const cx = getX(idx);
                                const cyInc = getY(d.income);
                                const cyExp = getY(d.expense);
                                const isSelected = idx === activeIdx;

                                return (
                                    <g key={idx}
                                        onMouseEnter={() => setHoveredIdx(idx)}
                                        onMouseLeave={() => setHoveredIdx(null)}
                                        style={{ cursor: 'pointer' }}
                                    >
                                        {/* Invisible wide hit target column */}
                                        <rect
                                            x={cx - 20}
                                            y={paddingTop}
                                            width="40"
                                            height={chartHeight}
                                            fill="transparent"
                                        />

                                        {/* Income point */}
                                        <circle cx={cx} cy={cyInc} r={isSelected ? "5" : "3.5"} fill="#10B981" stroke="#FFFFFF" strokeWidth="1.5" />
                                        {/* Expense point */}
                                        <circle cx={cx} cy={cyExp} r={isSelected ? "5" : "3.5"} fill="#F59E0B" stroke="#FFFFFF" strokeWidth="1.5" />
                                    </g>
                                );
                            })}

                            {/* Month X Axis Labels */}
                            {dataPoints.map((d, idx) => (
                                <text
                                    key={idx}
                                    x={getX(idx)}
                                    y={height - 8}
                                    textAnchor="middle"
                                    fill={idx === activeIdx ? 'var(--text-main)' : 'var(--text-muted)'}
                                    fontWeight={idx === activeIdx ? "700" : "500"}
                                    fontSize="9px"
                                >
                                    {d.label}
                                </text>
                            ))}
                        </svg>
                    </div>

                    {/* Chart Legend & Focus Summary */}
                    <div style={{ display: 'flex', gap: '20px', justifyContent: 'center', fontSize: '0.8rem', paddingTop: '4px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                            <span style={{ width: '10px', height: '10px', backgroundColor: '#10B981', borderRadius: '50%' }}></span>
                            <span style={{ color: 'var(--text-muted)', fontWeight: 500 }}>
                                Income ({formatCurrency(activePoint.income)})
                            </span>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                            <span style={{ width: '10px', height: '10px', backgroundColor: '#F59E0B', borderRadius: '50%' }}></span>
                            <span style={{ color: 'var(--text-muted)', fontWeight: 500 }}>
                                Expenses ({formatCurrency(activePoint.expense)})
                            </span>
                        </div>
                    </div>
                </div>
            );
        };

        // --- SUB-COMPONENT: Custom SVG Category Donut Spend Chart ---
        const CategoryDonutSvgChart = ({ breakdown, total, settings }) => {
            const [hoveredIndex, setHoveredIndex] = React.useState(null);

            const categories = Object.keys(breakdown);
            const data = categories.map(cat => ({
                label: cat,
                value: breakdown[cat],
                percentage: total > 0 ? (breakdown[cat] / total) * 100 : 0
            })).sort((a, b) => b.value - a.value);

            const colors = ["#6558D3", "#3B82F6", "#10B981", "#F59E0B", "#EF4444", "#EC4899", "#8B5CF6", "#06B6D4", "#10B981", "#6B7280"];

            let accumulatedAngle = 0;
            const segments = data.map((d, idx) => {
                const angle = (d.value / total) * 360;
                const strokeDashOffset = 100 - (accumulatedAngle / 360) * 100;
                const strokeDashArray = `${(d.value / total) * 100} ${100 - (d.value / total) * 100}`;
                accumulatedAngle += angle;
                return {
                    ...d,
                    color: colors[idx % colors.length],
                    strokeDashArray,
                    strokeDashOffset
                };
            });

            const activeSeg = hoveredIndex !== null ? segments[hoveredIndex] : null;
            const formatCurrency = (val) => formatCurrencyVal(val, settings.currency || "INR");

            return (
                <div style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: '16px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span style={{ fontWeight: 600, fontSize: '1.05rem', color: 'var(--text-main)' }}>Expenses by Category</span>
                        <span style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>
                            {segments.length} Categor{segments.length === 1 ? 'y' : 'ies'}
                        </span>
                    </div>

                    <div style={{ display: 'flex', alignItems: 'center', gap: '20px' }}>
                        {/* Interactive SVG Donut */}
                        <div style={{ width: '135px', height: '135px', position: 'relative', flexShrink: 0 }}>
                            <svg width="100%" height="100%" viewBox="0 0 42 42" style={{ overflow: 'visible' }}>
                                <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="#F1F5F9" strokeWidth="3.5"></circle>

                                {segments.map((seg, idx) => (
                                    <circle
                                        key={idx}
                                        cx="21"
                                        cy="21"
                                        r="15.915"
                                        fill="transparent"
                                        stroke={seg.color}
                                        strokeWidth={hoveredIndex === idx ? "5" : "3.8"}
                                        strokeDasharray={seg.strokeDashArray}
                                        strokeDashoffset={seg.strokeDashOffset}
                                        transform="rotate(-90 21 21)"
                                        onMouseEnter={() => setHoveredIndex(idx)}
                                        onMouseLeave={() => setHoveredIndex(null)}
                                        style={{ transition: 'stroke-width 0.2s ease, opacity 0.2s ease', opacity: (hoveredIndex === null || hoveredIndex === idx) ? 1 : 0.45, cursor: 'pointer' }}
                                    ></circle>
                                ))}
                            </svg>

                            {/* Centered Total / Focused Category Display text */}
                            <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', textAlign: 'center', width: '80%' }}>
                                <span style={{ fontSize: '0.65rem', textTransform: 'uppercase', color: 'var(--text-muted)', display: 'block', fontWeight: 600, letterSpacing: '0.04em' }}>
                                    {activeSeg ? activeSeg.label : "Total Spend"}
                                </span>
                                <span style={{ fontSize: '0.9rem', fontWeight: 700, color: 'var(--text-main)', display: 'block' }}>
                                    {formatCurrency(activeSeg ? activeSeg.value : total)}
                                </span>
                                {activeSeg && (
                                    <span style={{ fontSize: '0.7rem', fontWeight: 600, color: activeSeg.color }}>
                                        {activeSeg.percentage.toFixed(1)}%
                                    </span>
                                )}
                            </div>
                        </div>

                        {/* Donut Legend */}
                        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: '8px', maxHeight: '150px', overflowY: 'auto' }}>
                            {segments.slice(0, 5).map((seg, idx) => (
                                <div
                                    key={idx}
                                    onMouseEnter={() => setHoveredIndex(idx)}
                                    onMouseLeave={() => setHoveredIndex(null)}
                                    style={{
                                        display: 'flex',
                                        flexDirection: 'column',
                                        gap: '3px',
                                        padding: '4px 6px',
                                        borderRadius: '6px',
                                        background: hoveredIndex === idx ? 'var(--bg-color)' : 'transparent',
                                        cursor: 'pointer',
                                        transition: 'background-color 0.15s ease'
                                    }}
                                >
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '0.8rem' }}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px', textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap' }}>
                                            <span style={{ width: '8px', height: '8px', borderRadius: '50%', backgroundColor: seg.color, flexShrink: 0 }}></span>
                                            <span style={{ fontWeight: 500, color: 'var(--text-main)', textOverflow: 'ellipsis', overflow: 'hidden' }}>{seg.label}</span>
                                        </div>
                                        <span style={{ fontWeight: 600, color: 'var(--text-main)' }}>{seg.percentage.toFixed(0)}%</span>
                                    </div>
                                    {/* Mini Progress Bar */}
                                    <div style={{ height: '3px', width: '100%', background: '#F1F5F9', borderRadius: '2px', overflow: 'hidden' }}>
                                        <div style={{ height: '100%', width: `${seg.percentage}%`, background: seg.color, borderRadius: '2px' }}></div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- SUB-PAGE: Transactions ---
        const TransactionsPage = ({
            transactions,
            settings,
            onDelete,
            onPatch,
            onAdd,
            tags,
            updateSetting,
            search = "",
            typeFilter = "all",
            categoryFilter = "all",
            accountFilter = "all",
            customFromDate = "",
            customToDate = ""
        }) => {
            const [sortField, setSortField] = React.useState("date");
            const [sortDirection, setSortDirection] = React.useState("desc");
            const [txToDelete, setTxToDelete] = React.useState(null);
            const [txToEdit, setTxToEdit] = React.useState(null);
            const [activeTagTx, setActiveTagTx] = React.useState(null);
            const [linkModalTx, setLinkModalTx] = React.useState(null);

            const categories = settings.categories || [];
            const accounts = settings.accounts || [];
            const recurringList = settings.recurring || [];

            const handleSort = (field) => {
                if (sortField === field) {
                    setSortDirection(prev => prev === "asc" ? "desc" : "asc");
                } else {
                    setSortField(field);
                    setSortDirection("asc");
                }
            };

            const filtered = transactions.filter(t => {
                const q = search.toLowerCase().trim();
                const formattedD = formatDate(t.date, settings.dateFormat).toLowerCase();
                const matchesSearch = !q || (
                    (t.merchant && t.merchant.toLowerCase().includes(q)) ||
                    (t.narration && t.narration.toLowerCase().includes(q)) ||
                    (t.category && t.category.toLowerCase().includes(q)) ||
                    (t.account && t.account.toLowerCase().includes(q)) ||
                    (t.notes && t.notes.toLowerCase().includes(q)) ||
                    (t.tags && t.tags.some(tag => tag.toLowerCase().includes(q))) ||
                    (t.date && t.date.includes(q)) ||
                    formattedD.includes(q)
                );

                const matchesType = typeFilter === "all" ? true : t.type === typeFilter;
                const matchesCategory = categoryFilter === "all" ? true : t.category === categoryFilter;
                const matchesAccount = accountFilter === "all" ? true : t.account === accountFilter;

                let matchesDateRange = true;
                if (settings.selectedPeriod === "custom-range") {
                    if (customFromDate && t.date < customFromDate) matchesDateRange = false;
                    if (customToDate && t.date > customToDate) matchesDateRange = false;
                }

                return matchesSearch && matchesType && matchesCategory && matchesAccount && matchesDateRange;
            });

            // Column sorting
            const sorted = [...filtered].sort((a, b) => {
                let valA = a[sortField];
                let valB = b[sortField];
                if (sortField === "date") {
                    valA = new Date(a.date).getTime();
                    valB = new Date(b.date).getTime();
                } else if (sortField === "amount") {
                    valA = Number(a.amount || 0);
                    valB = Number(b.amount || 0);
                } else if (typeof valA === "string") {
                    valA = (valA || "").toLowerCase();
                    valB = (valB || "").toLowerCase();
                }
                if (valA < valB) return sortDirection === "asc" ? -1 : 1;
                if (valA > valB) return sortDirection === "asc" ? 1 : -1;
                return 0;
            });

            const handleRemoveTag = (tx, tagToRemove) => {
                const updatedTags = (tx.tags || []).filter(t => t !== tagToRemove);
                onPatch(tx.id, { tags: updatedTags });
            };

            const formatCurrency = (val) => formatCurrencyVal(val, settings.currency || "INR");

            const handlePeriodChange = (val) => {
                updateSetting("selectedPeriod", val);
            };

            return (
                <div>

                    {/* Ledger Table */}
                    {sorted.length === 0 ? (
                        <div className="empty-state">
                            <Icon name="transactions" currency={settings.currency} />
                            <h3>No Records Matching Filters</h3>
                            <p>Try refining your search terms or date filter options.</p>
                        </div>
                    ) : (
                        <div className="table-responsive" style={{ maxHeight: 'calc(100vh - 220px)', overflowY: 'auto', position: 'relative' }}>
                            <table className="table" style={{ borderCollapse: 'separate', borderSpacing: 0 }}>
                                <thead>
                                    <tr>
                                        <th style={{ position: 'sticky', top: 0, zIndex: 80, backgroundColor: '#F9FAFB', borderBottom: '1px solid var(--border-color)', width: '120px', cursor: 'pointer', userSelect: 'none' }} onClick={() => handleSort("date")}>
                                            Date {sortField === "date" ? (sortDirection === "asc" ? "▲" : "▼") : ""}
                                        </th>
                                        <th style={{ position: 'sticky', top: 0, zIndex: 80, backgroundColor: '#F9FAFB', borderBottom: '1px solid var(--border-color)', cursor: 'pointer', userSelect: 'none' }} onClick={() => handleSort("narration")}>
                                            Narration {sortField === "narration" ? (sortDirection === "asc" ? "▲" : "▼") : ""}
                                        </th>
                                        <th style={{ position: 'sticky', top: 0, zIndex: 80, backgroundColor: '#F9FAFB', borderBottom: '1px solid var(--border-color)', width: '160px', cursor: 'pointer', userSelect: 'none' }} onClick={() => handleSort("category")}>
                                            Category {sortField === "category" ? (sortDirection === "asc" ? "▲" : "▼") : ""}
                                        </th>
                                        <th style={{ position: 'sticky', top: 0, zIndex: 80, backgroundColor: '#F9FAFB', borderBottom: '1px solid var(--border-color)', width: '130px', cursor: 'pointer', userSelect: 'none' }} onClick={() => handleSort("account")}>
                                            Account {sortField === "account" ? (sortDirection === "asc" ? "▲" : "▼") : ""}
                                        </th>
                                        <th style={{ position: 'sticky', top: 0, zIndex: 80, backgroundColor: '#F9FAFB', borderBottom: '1px solid var(--border-color)', width: '150px' }}>Tags</th>
                                        <th style={{ position: 'sticky', top: 0, zIndex: 80, backgroundColor: '#F9FAFB', borderBottom: '1px solid var(--border-color)', width: '120px', cursor: 'pointer', userSelect: 'none' }} onClick={() => handleSort("amount")}>
                                            Amount {sortField === "amount" ? (sortDirection === "asc" ? "▲" : "▼") : ""}
                                        </th>
                                        <th style={{ position: 'sticky', top: 0, zIndex: 80, backgroundColor: '#F9FAFB', borderBottom: '1px solid var(--border-color)', width: '110px' }}>Notes</th>
                                        <th style={{ position: 'sticky', top: 0, zIndex: 80, backgroundColor: '#F9FAFB', borderBottom: '1px solid var(--border-color)', width: '100px' }}>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {sorted.map(t => {
                                        const catParts = t.category && t.category.includes(" - ") ? t.category.split(" - ") : [t.category, ""];
                                        const catParent = catParts[0];
                                        const catSub = catParts.slice(1).join(" - ");
                                        const linkedRec = recurringList.find(r => r.id === t.linkedRecurringId);

                                        return (
                                            <tr key={t.id}>
                                                <td style={{ fontSize: '0.82rem', color: 'var(--text-muted)', whiteSpace: 'nowrap' }}>{formatDate(t.date, settings.dateFormat)}</td>
                                                <td>
                                                    <div style={{ fontWeight: 500, fontSize: '0.88rem' }}>
                                                        {t.narration || t.merchant}
                                                        {t.receipt === 1 && (
                                                            <span title="Receipt attached" style={{ marginLeft: '6px', color: 'var(--primary)', cursor: 'pointer' }}>📎</span>
                                                        )}
                                                        {linkedRec && (
                                                            <span className="badge badge-info" style={{ marginLeft: '6px', fontSize: '0.68rem' }} title={`Mapped to Recurring: ${linkedRec.name}`}>
                                                                🔄 {linkedRec.name}
                                                            </span>
                                                        )}
                                                    </div>
                                                </td>

                                                <td>
                                                    <div style={{ fontWeight: 500, fontSize: '0.82rem' }}>{catParent}</div>
                                                    {catSub && (
                                                        <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '2px' }}>{catSub}</div>
                                                    )}
                                                </td>

                                                <td style={{ fontSize: '0.82rem' }}>{t.account}</td>

                                                <td>
                                                    <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '3px' }}>
                                                        {(t.tags || []).map(tag => (
                                                            <span key={tag} className="tag-pill">
                                                                {tag}
                                                                <button className="remove-btn" onClick={() => handleRemoveTag(t, tag)}>×</button>
                                                            </span>
                                                        ))}
                                                        <button
                                                            className="btn btn-secondary btn-sm"
                                                            style={{ padding: '2px 6px', height: '22px', borderRadius: '4px', display: 'flex', alignItems: 'center' }}
                                                            onClick={() => setActiveTagTx(t)}
                                                        >
                                                            +
                                                        </button>
                                                    </div>
                                                </td>

                                                <td style={{ fontWeight: 600, color: t.type === "income" ? "var(--success)" : "var(--danger)", whiteSpace: 'nowrap' }}>
                                                    {t.type === "income" ? "+" : "-"}{formatCurrency(t.amount)}
                                                </td>

                                                <td style={{ fontSize: '0.78rem', color: 'var(--text-muted)', maxWidth: '110px' }}>
                                                    <span title={t.notes || ""}>{t.notes ? (t.notes.length > 35 ? t.notes.slice(0, 35) + "…" : t.notes) : "—"}</span>
                                                </td>

                                                <td>
                                                    <div style={{ display: 'flex', gap: '4px', alignItems: 'center' }}>
                                                        <button
                                                            className="btn btn-secondary btn-sm"
                                                            style={{ border: 'none', color: 'var(--primary)', padding: '4px 6px' }}
                                                            onClick={() => setLinkModalTx(t)}
                                                            title="Map to Recurring"
                                                        >
                                                            🔄
                                                        </button>
                                                        <button
                                                            className="btn btn-secondary btn-sm"
                                                            style={{ border: 'none', color: 'var(--primary)', padding: '4px 6px' }}
                                                            onClick={() => setTxToEdit(t)}
                                                            title="Edit transaction"
                                                        >
                                                            ✏️
                                                        </button>
                                                        <button
                                                            className="btn btn-secondary btn-sm"
                                                            style={{ border: 'none', color: 'var(--danger)', padding: '4px 6px' }}
                                                            onClick={() => setTxToDelete(t)}
                                                            title="Delete row"
                                                        >
                                                            <Icon name="trash" />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* Tag Editor modal overlay */}
                    {activeTagTx && (
                        <TagManagerModal
                            tx={activeTagTx}
                            tags={tags}
                            onClose={() => setActiveTagTx(null)}
                            onSave={async (updatedTags) => {
                                await onPatch(activeTagTx.id, { tags: updatedTags });
                                setActiveTagTx(null);
                            }}
                        />
                    )}

                    {/* Link to Recurring Transaction Modal */}
                    {linkModalTx && (
                        <div className="modal-overlay">
                            <div className="modal-container" style={{ maxWidth: '420px' }}>
                                <div className="modal-header">
                                    <h3 className="modal-title">Map to Recurring</h3>
                                    <button className="modal-close-btn" onClick={() => setLinkModalTx(null)}><Icon name="close" /></button>
                                </div>
                                <div className="modal-body">
                                    <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: '12px' }}>
                                        Link <strong>"{linkModalTx.narration || linkModalTx.merchant}"</strong> ({formatCurrency(linkModalTx.amount)}) to a recurring template for monthly tracking.
                                    </p>
                                    <div className="form-field">
                                        <label>Select Recurring Item</label>
                                        <select
                                            className="form-control"
                                            value={linkModalTx.linkedRecurringId || ""}
                                            onChange={async (e) => {
                                                const val = e.target.value || null;
                                                await onPatch(linkModalTx.id, { linkedRecurringId: val });
                                                setLinkModalTx(null);
                                            }}
                                        >
                                            <option value="">-- Not Mapped (Unlink) --</option>
                                            {recurringList.map(r => {
                                                const linkNow = new Date();
                                                const linkTodayStr = `${linkNow.getFullYear()}-${String(linkNow.getMonth() + 1).padStart(2, '0')}-${String(linkNow.getDate()).padStart(2, '0')}`;
                                                const isExp = r.endDate && r.endDate < linkTodayStr;
                                                return (
                                                    <option key={r.id} value={r.id}>
                                                        {r.name} ({formatCurrency(r.amount)}){isExp ? " [Expired]" : ""}
                                                    </option>
                                                );
                                            })}
                                        </select>
                                    </div>
                                </div>
                                <div className="modal-footer">
                                    <button className="btn btn-secondary" onClick={() => setLinkModalTx(null)}>Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Edit Transaction Modal */}
                    {txToEdit && (
                        <EditTransactionModal
                            tx={txToEdit}
                            settings={settings}
                            tags={tags}
                            onClose={() => setTxToEdit(null)}
                            onSave={async (patch) => {
                                await onPatch(txToEdit.id, patch);
                                setTxToEdit(null);
                            }}
                        />
                    )}

                    {/* Delete Transaction Confirmation Modal */}
                    {txToDelete && (
                        <div className="modal-overlay">
                            <div className="modal-container">
                                <div className="modal-header">
                                    <h3 className="modal-title" style={{ color: 'var(--danger)' }}>Confirm Transaction Deletion</h3>
                                    <button className="modal-close-btn" onClick={() => setTxToDelete(null)}>
                                        <Icon name="close" />
                                    </button>
                                </div>
                                <div className="modal-body">
                                    <p style={{ marginBottom: '12px' }}>Are you sure you want to permanently delete this transaction?</p>
                                    <div style={{ padding: '12px', backgroundColor: 'var(--bg-color)', borderRadius: '8px', border: '1px solid var(--border-color)', fontSize: '0.9rem' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                                            <span style={{ color: 'var(--text-muted)' }}>Date:</span>
                                            <span style={{ fontWeight: 500 }}>{formatDate(txToDelete.date, settings.dateFormat)}</span>
                                        </div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                                            <span style={{ color: 'var(--text-muted)' }}>Merchant:</span>
                                            <span style={{ fontWeight: 500 }}>{txToDelete.merchant}</span>
                                        </div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                                            <span style={{ color: 'var(--text-muted)' }}>Amount:</span>
                                            <span style={{ fontWeight: 600, color: txToDelete.type === 'income' ? 'var(--success)' : 'var(--danger)' }}>
                                                {txToDelete.type === 'income' ? '+' : '-'}{formatCurrency(txToDelete.amount)}
                                            </span>
                                        </div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                            <span style={{ color: 'var(--text-muted)' }}>Category:</span>
                                            <span className="badge" style={{ backgroundColor: 'var(--border-color)', color: 'var(--text-main)', padding: '2px 6px', borderRadius: '4px' }}>{txToDelete.category}</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="modal-footer">
                                    <button className="btn btn-secondary" onClick={() => setTxToDelete(null)}>Cancel</button>
                                    <button className="btn btn-danger" onClick={async () => {
                                        await onDelete(txToDelete.id);
                                        setTxToDelete(null);
                                    }}>
                                        Confirm Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- SUB-PAGE: Recurring Transactions (Section 10) ---
        const RecurringPage = ({
            transactions,
            settings,
            suggested,
            updateSetting,
            showToast,
            subpageActionSignal,
            selectedPeriod = "next_6_months",
            setSelectedPeriod,
            customStart = "",
            setCustomStart,
            customEnd = "",
            setCustomEnd,
            displayStartDate,
            displayEndDate,
            normPeriodKey,
            handleStartDateChange,
            handleEndDateChange,
            handleUnifiedPeriodChange,
            PeriodSelectOptions
        }) => {
            const confirmedList = settings.recurring || [];
            const [showModal, setShowModal] = React.useState(false);
            const [editingItem, setEditingItem] = React.useState(null);
            const [itemToDelete, setItemToDelete] = React.useState(null);

            const prevSubpageActionSignal = React.useRef(subpageActionSignal);
            React.useEffect(() => {
                if (subpageActionSignal > prevSubpageActionSignal.current) {
                    setEditingItem(null);
                    setShowModal(true);
                }
                prevSubpageActionSignal.current = subpageActionSignal;
            }, [subpageActionSignal]);
            const [mappedModalItem, setMappedModalItem] = React.useState(null);

            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            const activeList = confirmedList.filter(c => !c.endDate || c.endDate >= todayStr);
            const activeInflowList = activeList.filter(c => c.type === "income");
            const activeOutflowList = activeList.filter(c => c.type !== "income");
            const expiredList = confirmedList.filter(c => c.endDate && c.endDate < todayStr);

            const toggleExcludeRecurring = async (id) => {
                const updatedList = confirmedList.map(c => {
                    if (c.id === id) {
                        const nextState = !c.excludeFromMonthlyCalculations;
                        showToast(nextState ? `"${c.name}" excluded from monthly calculations` : `"${c.name}" included in monthly calculations`);
                        return { ...c, excludeFromMonthlyCalculations: nextState };
                    }
                    return c;
                });
                await updateSetting("recurring", updatedList);
            };

            const formatCurrency = (val) => formatCurrencyVal(val, settings.currency || "INR");

            // Calculate monthly equivalent amount
            const getItemMonthlyEq = (item) => {
                let monthlyEquivalent = Number(item.amount || 0);
                if (item.cadence === "weekly" || item.cadence === "weekly_days") monthlyEquivalent = (item.amount * 52) / 12;
                else if (item.cadence === "biweekly") monthlyEquivalent = (item.amount * 26) / 12;
                else if (item.cadence === "quarterly") monthlyEquivalent = item.amount / 3;
                else if (item.cadence === "annual" || item.cadence === "yearly") monthlyEquivalent = item.amount / 12;
                else if (item.cadence === "once") monthlyEquivalent = 0;
                else if (item.cadence === "custom_interval" && item.customIntervalDays) monthlyEquivalent = (item.amount * 30) / Number(item.customIntervalDays);
                return monthlyEquivalent;
            };

            const getPeriodRange = () => {
                if (displayStartDate && displayEndDate) {
                    return { pStartStr: displayStartDate, pEndStr: displayEndDate };
                }
                return calculatePeriodDateRange(selectedPeriod, new Date(), customStart, customEnd);
            };

            const getPeriodItemAmount = (item) => {
                if (item.excludeFromMonthlyCalculations) return 0;
                const { pStartStr, pEndStr } = getPeriodRange();
                const count = getOccurrencesInPeriod(item, pStartStr, pEndStr);
                return count * Number(item.amount || 0);
            };

            // Period total sums (Items with active occurrences in selected period)
            const confirmedPeriodInflow = confirmedList.reduce((sum, item) => {
                if (item.excludeFromMonthlyCalculations || item.type !== "income") return sum;
                return sum + getPeriodItemAmount(item);
            }, 0);

            const confirmedPeriodOutflow = confirmedList.reduce((sum, item) => {
                if (item.excludeFromMonthlyCalculations || item.type === "income") return sum;
                return sum + getPeriodItemAmount(item);
            }, 0);

            const netPeriodSurplus = confirmedPeriodInflow - confirmedPeriodOutflow;

            const confirmedMonthlyOutflow = activeList.reduce((sum, item) => {
                if (item.excludeFromMonthlyCalculations || item.type === "income") return sum;
                return sum + getItemMonthlyEq(item);
            }, 0);

            const getPeriodBadgeLabel = () => {
                const range = getPeriodRange();
                return `${range.pStartStr} to ${range.pEndStr}`;
            };

            const handleSaveRecurring = async (item) => {
                let updatedList;
                if (editingItem) {
                    updatedList = confirmedList.map(c => c.id === editingItem.id ? { ...c, ...item } : c);
                } else {
                    updatedList = [...confirmedList, { id: crypto.randomUUID(), ...item }];
                }
                await updateSetting("recurring", updatedList);
                showToast(editingItem ? "Recurring item updated" : "Recurring item added");
                setShowModal(false);
                setEditingItem(null);
            };

            const handleKeepSuggestion = async (item) => {
                const updatedList = [...confirmedList, {
                    id: crypto.randomUUID(),
                    name: item.merchantDisplay,
                    category: item.category,
                    amount: item.averageCharge,
                    cadence: item.cadence,
                    nextDate: item.nextDate,
                    active: true,
                    excludeFromMonthlyCalculations: false
                }];
                await updateSetting("recurring", updatedList);
                showToast(`Kept suggestion for "${item.merchantDisplay}"`);
            };

            const handleIgnoreSuggestion = async (item) => {
                const dismissed = settings.dismissedPatterns || [];
                const updatedDismissed = [...dismissed, item.merchantNormalized];
                await updateSetting("dismissedPatterns", updatedDismissed);
                showToast(`Ignored suggestion for "${item.merchantDisplay}"`);
            };

            const handleRemoveConfirmed = async (id) => {
                const updatedList = confirmedList.filter(c => c.id !== id);
                await updateSetting("recurring", updatedList);
                showToast("Recurring item removed");
            };

            const getCadenceLabel = (c) => {
                if (c.cadence === "once") return `Once (${c.nextDate ? formatDate(c.nextDate, settings.dateFormat) : "Single"})`;
                if (c.cadence === "monthly") return `Monthly (${c.nextDate ? `due ${c.nextDate.split('-')[2] || ""}` : ""})`;
                if (c.cadence === "yearly" || c.cadence === "annual") return `Yearly`;
                if (c.cadence === "weekly_days") return `Weekly (${(c.weeklyDays || []).join(", ")})`;
                if (c.cadence === "monthly_days") return `Monthly Days (${c.monthlyDays || ""})`;
                if (c.cadence === "custom_interval") return `Every ${c.customIntervalDays || 14} Days`;
                if (c.cadence === "custom_days") return `Custom Dates`;
                return c.cadence || "Monthly";
            };

            const renderRecurringTable = (itemsList) => (
                <div className="table-responsive">
                    <table className="table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Per Payment</th>
                                <th>Period Total</th>
                                <th>Frequency / Cadence</th>
                                <th>Next Expected Date</th>
                                <th>End Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {itemsList.map(c => {
                                const linkedTxns = transactions.filter(t => t.linkedRecurringId === c.id);
                                const periodAmt = getPeriodItemAmount(c);

                                return (
                                    <tr key={c.id}>
                                        <td style={{ fontWeight: 600 }}>{c.name}</td>
                                        <td>{c.category}</td>
                                        <td style={{ fontWeight: 600, color: c.type === "income" ? "var(--success)" : "var(--danger)" }}>
                                            {c.type === "income" ? "+" : "-"}{formatCurrency(c.amount)}
                                        </td>
                                        <td style={{ fontWeight: 700, color: c.type === "income" ? "var(--success)" : (c.excludeFromMonthlyCalculations ? "var(--text-muted)" : "var(--danger)") }}>
                                            {c.type === "income" ? "+" : "-"}{formatCurrency(periodAmt)}
                                        </td>
                                        <td><span className="badge badge-info">{getCadenceLabel(c)}</span></td>
                                        <td>{c.nextDate ? formatDate(c.nextDate, settings.dateFormat) : "—"}</td>
                                        <td>{c.endDate ? formatDate(c.endDate, settings.dateFormat) : "No End Date"}</td>
                                        <td>
                                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'nowrap' }}>
                                                <button
                                                    className="btn btn-secondary btn-sm"
                                                    style={{ fontSize: '0.75rem', padding: '2px 8px', whiteSpace: 'nowrap' }}
                                                    onClick={() => setMappedModalItem(c)}
                                                    title={`${linkedTxns.length} Mapped`}
                                                >
                                                    🔄 {linkedTxns.length}
                                                </button>
                                                <button
                                                    type="button"
                                                    className={`badge ${c.excludeFromMonthlyCalculations ? "badge-queued" : "badge-income"}`}
                                                    style={{
                                                        cursor: 'pointer',
                                                        border: 'none',
                                                        padding: '3px 8px',
                                                        fontSize: '0.85rem',
                                                        display: 'inline-flex',
                                                        alignItems: 'center',
                                                        justifyContent: 'center',
                                                        userSelect: 'none'
                                                    }}
                                                    onClick={() => toggleExcludeRecurring(c.id)}
                                                    title={c.excludeFromMonthlyCalculations ? "Excluded from monthly calculations (Click to include)" : "Included in monthly calculations (Click to exclude)"}
                                                >
                                                    {c.excludeFromMonthlyCalculations ? "❌" : "✅"}
                                                </button>
                                                <div style={{ display: 'flex', gap: '4px' }}>
                                                    <button
                                                        className="btn btn-secondary btn-sm"
                                                        style={{ border: 'none', color: 'var(--primary)', padding: '4px 6px' }}
                                                        onClick={() => { setEditingItem(c); setShowModal(true); }}
                                                        title="Edit recurring item"
                                                    >
                                                        ✏️
                                                    </button>
                                                    <button
                                                        className="btn btn-secondary btn-sm"
                                                        style={{ border: 'none', color: 'var(--danger)', padding: '4px 6px' }}
                                                        onClick={() => setItemToDelete(c)}
                                                        title="Delete recurring item"
                                                    >
                                                        <Icon name="trash" />
                                                    </button>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );

            return (
                <div>

                    {/* Section 1: Detected Suggestions */}
                    {suggested.length > 0 && (
                        <div className="section-card" style={{ marginBottom: '24px', borderColor: 'var(--primary)' }}>
                            <div className="section-card-title" style={{ color: 'var(--primary)' }}>
                                <Icon name="alert" style={{ marginRight: '6px' }} />
                                <span>Detected Recurring Suggestions</span>
                            </div>
                            <div className="table-responsive">
                                <table className="table">
                                    <thead>
                                        <tr>
                                            <th>Service/Merchant</th>
                                            <th>Category</th>
                                            <th>Cadence</th>
                                            <th>Charges</th>
                                            <th>Monthly Eq.</th>
                                            <th>Next Expected</th>
                                            <th>Confidence</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {suggested.map((s, idx) => (
                                            <tr key={idx}>
                                                <td style={{ fontWeight: 600 }}>{s.merchantDisplay}</td>
                                                <td>{s.category}</td>
                                                <td>{s.cadence}</td>
                                                <td>{s.occurrences}x ({formatCurrency(s.averageCharge)})</td>
                                                <td>{formatCurrency(s.monthlyEquivalent)}</td>
                                                <td>{s.nextDate}</td>
                                                <td>
                                                    <span className={`badge ${s.confidence === "high" ? "badge-income" : "badge-queued"}`}>
                                                        {s.confidence}
                                                    </span>
                                                </td>
                                                <td>
                                                    <div style={{ display: 'flex', gap: '6px' }}>
                                                        <button className="btn btn-primary btn-sm" onClick={() => handleKeepSuggestion(s)}>Keep</button>
                                                        <button className="btn btn-secondary btn-sm" onClick={() => handleIgnoreSuggestion(s)}>Ignore</button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* Section 2: Active Recurring Items - Segregated Inflow & Outflow */}
                    {activeList.length === 0 ? (
                        <div className="section-card" style={{ marginBottom: '24px' }}>
                            <div className="section-card-title" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                <span>Active Recurring Transactions</span>
                                <span className="badge badge-income" style={{ fontSize: '0.78rem' }}>0 Active</span>
                            </div>
                            <div className="empty-state">
                                <Icon name="recurring" />
                                <h3>No Active Recurring Items</h3>
                                <p>Add SIPs, rent, EMIs, salary or recurring bills using the button above.</p>
                                <button className="btn btn-primary" onClick={() => setShowModal(true)}>Add Recurring Item</button>
                            </div>
                        </div>
                    ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '24px', marginBottom: '24px' }}>
                            {/* Inflow Section */}
                            <div className="section-card" style={{ marginBottom: 0, borderLeft: '4px solid var(--success)', background: 'var(--card-bg)' }}>
                                <div className="section-card-title" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                    <span style={{ display: 'flex', alignItems: 'center', gap: '8px', color: 'var(--success)', fontWeight: 700, fontSize: '0.95rem' }}>
                                        <Icon name="arrowDown" />
                                        <span>Recurring Inflows (Income &amp; Deposits)</span>
                                    </span>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                        <span className="badge badge-income" style={{ fontSize: '0.78rem', fontWeight: 600 }}>
                                            +{formatCurrency(confirmedPeriodInflow)} Total
                                        </span>
                                        <span className="badge badge-income" style={{ fontSize: '0.78rem' }}>
                                            {activeInflowList.length} {activeInflowList.length === 1 ? 'Item' : 'Items'}
                                        </span>
                                    </div>
                                </div>
                                {activeInflowList.length === 0 ? (
                                    <div className="empty-state" style={{ padding: '20px 16px' }}>
                                        <p style={{ margin: 0, color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                                            No active recurring inflows (salary, deposits, interest) configured.
                                        </p>
                                    </div>
                                ) : (
                                    renderRecurringTable(activeInflowList)
                                )}
                            </div>

                            {/* Outflow Section */}
                            <div className="section-card" style={{ marginBottom: 0, borderLeft: '4px solid var(--danger)', background: 'var(--card-bg)' }}>
                                <div className="section-card-title" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                    <span style={{ display: 'flex', alignItems: 'center', gap: '8px', color: 'var(--danger)', fontWeight: 700, fontSize: '0.95rem' }}>
                                        <Icon name="arrowUp" />
                                        <span>Recurring Outflows (Expenses &amp; Payments)</span>
                                    </span>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                        <span className="badge badge-queued" style={{ background: 'rgba(239, 68, 68, 0.12)', color: 'var(--danger)', fontWeight: 600, fontSize: '0.78rem' }}>
                                            −{formatCurrency(confirmedPeriodOutflow)} Total
                                        </span>
                                        <span className="badge badge-queued" style={{ background: 'rgba(239, 68, 68, 0.12)', color: 'var(--danger)', fontWeight: 600, fontSize: '0.78rem' }}>
                                            {activeOutflowList.length} {activeOutflowList.length === 1 ? 'Item' : 'Items'}
                                        </span>
                                    </div>
                                </div>
                                {activeOutflowList.length === 0 ? (
                                    <div className="empty-state" style={{ padding: '20px 16px' }}>
                                        <p style={{ margin: 0, color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                                            No active recurring outflows (EMIs, SIPs, rent, subscriptions) configured.
                                        </p>
                                    </div>
                                ) : (
                                    renderRecurringTable(activeOutflowList)
                                )}
                            </div>
                        </div>
                    )}

                    {/* Section 3: Expired Recurring Items list */}
                    <div className="section-card" style={{ borderColor: expiredList.length > 0 ? 'var(--border-color)' : 'transparent', background: 'var(--card-bg)' }}>
                        <div className="section-card-title" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', color: 'var(--text-muted)' }}>
                            <span style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                ⌛ Expired Recurring Transactions
                            </span>
                            <span className="badge badge-queued" style={{ background: 'var(--bg-color)', border: '1px solid var(--border-color)', color: 'var(--text-muted)', fontSize: '0.78rem' }}>
                                {expiredList.length} Expired
                            </span>
                        </div>
                        {expiredList.length === 0 ? (
                            <div className="empty-state" style={{ padding: '20px 16px' }}>
                                <p style={{ margin: 0, color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                                    No expired recurring transactions. Items automatically move here once their End Date passes.
                                </p>
                            </div>
                        ) : (
                            <div className="table-responsive">
                                <table className="table">
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Category</th>
                                            <th>Per Payment</th>
                                            <th>Period Total</th>
                                            <th>Frequency / Cadence</th>
                                            <th>Expired Date</th>
                                            <th>Status</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {expiredList.map(c => {
                                            const linkedTxns = transactions.filter(t => t.linkedRecurringId === c.id);

                                            return (
                                                <tr key={c.id} style={{ opacity: 0.85 }}>
                                                    <td style={{ fontWeight: 600 }}>
                                                        <span style={{ textDecoration: 'line-through', textDecorationColor: 'var(--text-muted)' }}>{c.name}</span>
                                                    </td>
                                                    <td>{c.category}</td>
                                                    <td style={{ fontWeight: 600, color: c.type === "income" ? "var(--success)" : "var(--danger)" }}>
                                                        {c.type === "income" ? "+" : "-"}{formatCurrency(c.amount)}
                                                    </td>
                                                    <td style={{ fontWeight: 700, color: c.type === "income" ? "var(--success)" : (c.excludeFromMonthlyCalculations ? "var(--text-muted)" : "var(--danger)") }}>
                                                        {c.type === "income" ? "+" : "-"}{formatCurrency(getPeriodItemAmount(c))}
                                                    </td>
                                                    <td><span className="badge badge-info">{getCadenceLabel(c)}</span></td>
                                                    <td>
                                                        <span className="badge badge-queued" style={{ background: 'rgba(239, 68, 68, 0.12)', color: 'var(--danger)', fontWeight: 600 }}>
                                                            Ended {c.endDate}
                                                        </span>
                                                    </td>
                                                    <td>
                                                        <span className="badge badge-queued" style={{ background: 'var(--bg-color)', color: 'var(--text-muted)' }}>
                                                            Expired
                                                        </span>
                                                    </td>
                                                    <td>
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'nowrap' }}>
                                                            <button
                                                                className="btn btn-secondary btn-sm"
                                                                style={{ fontSize: '0.75rem', padding: '2px 8px', whiteSpace: 'nowrap' }}
                                                                onClick={() => setMappedModalItem(c)}
                                                                title={`${linkedTxns.length} Mapped`}
                                                            >
                                                                🔄 {linkedTxns.length}
                                                            </button>
                                                            <button
                                                                type="button"
                                                                className={`badge ${c.excludeFromMonthlyCalculations ? "badge-queued" : "badge-income"}`}
                                                                style={{
                                                                    cursor: 'pointer',
                                                                    border: 'none',
                                                                    padding: '3px 8px',
                                                                    fontSize: '0.85rem',
                                                                    display: 'inline-flex',
                                                                    alignItems: 'center',
                                                                    justifyContent: 'center',
                                                                    userSelect: 'none'
                                                                }}
                                                                onClick={() => toggleExcludeRecurring(c.id)}
                                                                title={c.excludeFromMonthlyCalculations ? "Excluded from monthly calculations (Click to include)" : "Included in monthly calculations (Click to exclude)"}
                                                            >
                                                                {c.excludeFromMonthlyCalculations ? "❌" : "✅"}
                                                            </button>
                                                            <div style={{ display: 'flex', gap: '4px' }}>
                                                                <button
                                                                    className="btn btn-secondary btn-sm"
                                                                    style={{ border: 'none', color: 'var(--primary)', padding: '4px 6px' }}
                                                                    onClick={() => { setEditingItem(c); setShowModal(true); }}
                                                                    title="Edit / Extend End Date to Reactivate"
                                                                >
                                                                    ✏️
                                                                </button>
                                                                <button
                                                                    className="btn btn-secondary btn-sm"
                                                                    style={{ border: 'none', color: 'var(--danger)', padding: '4px 6px' }}
                                                                    onClick={() => setItemToDelete(c)}
                                                                    title="Delete recurring item"
                                                                >
                                                                    <Icon name="trash" />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    {/* Delete Confirmation Modal for Recurring Entries */}
                    {itemToDelete && (
                        <div className="modal-overlay">
                            <div className="modal-container" style={{ maxWidth: '420px' }}>
                                <div className="modal-header">
                                    <h3 className="modal-title" style={{ color: 'var(--danger)' }}>Confirm Deletion</h3>
                                    <button className="modal-close-btn" onClick={() => setItemToDelete(null)}>
                                        <Icon name="close" />
                                    </button>
                                </div>
                                <div className="modal-body">
                                    <p style={{ marginBottom: '12px', fontSize: '0.9rem' }}>Are you sure you want to delete this recurring ledger entry?</p>
