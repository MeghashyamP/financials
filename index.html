<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financials - Personal Financial Dashboard</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & Babel Standalone via CDN -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js" crossorigin></script>

    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>

    <!-- Vanilla CSS Design System styling -->
    <style>
        :root {
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --primary: #6558D3;
            --primary-hover: #4F46B5;
            --primary-light: #EEECFB;
            --success: #10B981;
            --success-light: #D1FAE5;
            --warning: #F59E0B;
            --warning-light: #FEF3C7;
            --danger: #EF4444;
            --danger-light: #FEE2E2;
            --info: #3B82F6;
            --info-light: #DBEAFE;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --text-light: #9CA3AF;
            --border-color: #E5E7EB;
            --sidebar-bg: #FFFFFF;
            --topbar-bg: #FFFFFF;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius-card: 16px;
            --radius-btn: 10px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            font-size: 14px;
            line-height: 1.5;
        }

        button, input, select, textarea {
            font-family: inherit;
            font-size: inherit;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
        }
        a:hover {
            color: var(--primary-hover);
        }

        /* App Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Sidebar - Desktop */
        .sidebar {
            width: 238px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 24px 16px;
            transition: var(--transition);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            margin-bottom: 32px;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary);
        }

        .sidebar-brand svg {
            width: 28px;
            height: 28px;
            color: var(--primary);
        }

        .sidebar-nav {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow-y: auto;
        }

        .sidebar-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-btn);
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .sidebar-nav-item:hover, .sidebar-nav-item.active {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .sidebar-nav-item svg {
            width: 20px;
            height: 20px;
        }

        /* Main Content Container */
        .main-wrapper {
            flex: 1;
            margin-left: 238px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Top Bar - Desktop */
        .topbar {
            height: 76px;
            background-color: var(--topbar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .topbar-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Common Button Styles */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            height: 40px;
            border-radius: var(--radius-btn);
            border: 1px solid transparent;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #FFFFFF;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #FFFFFF;
            border-color: var(--border-color);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background-color: var(--bg-color);
        }

        .btn-danger {
            background-color: var(--danger);
            color: #FFFFFF;
        }
        .btn-danger:hover {
            background-color: #DC2626;
        }

        .btn-sm {
            padding: 6px 12px;
            height: 32px;
            font-size: 0.85rem;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Main View Shell */
        .content-body {
            padding: 32px;
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* Page Layout Utilities */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 16px;
        }

        .page-title-desc h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .page-title-desc p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Summary Cards Grid */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-icon {
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon.primary { background-color: var(--primary-light); color: var(--primary); }
        .card-icon.success { background-color: var(--success-light); color: var(--success); }
        .card-icon.warning { background-color: var(--warning-light); color: var(--warning); }
        .card-icon.info { background-color: var(--info-light); color: var(--info); }

        .card-value {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 0.775rem;
            color: var(--text-muted);
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-subtitle.not-configured {
            color: var(--danger);
            font-weight: 500;
        }

        /* SVG Chart Layouts */
        .dashboard-charts {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }

        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 24px;
            display: flex;
            flex-direction: column;
            min-height: 380px;
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .chart-header-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .chart-container-inner {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Two-Column Section layout */
        .content-columns {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 24px;
            margin-bottom: 28px;
        }

        /* Section Cards */
        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 24px;
        }

        .section-card-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Empty state helper */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-card);
            background-color: #FAFAFA;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            color: var(--text-light);
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .empty-state p {
            max-width: 320px;
            margin-bottom: 16px;
            font-size: 0.875rem;
        }

        /* Table Responsive Design */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .table th {
            background-color: #F9FAFB;
            padding: 14px 18px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .table td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .table tr:last-child td {
            border-bottom: none;
        }

        .table tr:hover td {
            background-color: #F9FAFB;
        }

        /* Filters Bar */
        .filters-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-control {
            height: 38px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #FFFFFF;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .search-control {
            min-width: 220px;
        }

        /* Badge/Pill Elements */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.775rem;
            font-weight: 500;
            text-transform: capitalize;
        }

        .badge-expense { background-color: var(--warning-light); color: var(--warning); }
        .badge-income { background-color: var(--success-light); color: var(--success); }
        .badge-review { background-color: var(--danger-light); color: var(--danger); }
        .badge-stored { background-color: var(--info-light); color: var(--info); }
        .badge-queued { background-color: #F3F4F6; color: var(--text-muted); }

        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: #E0E7FF;
            color: #4F46E5;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.775rem;
            font-weight: 500;
            margin-right: 4px;
            margin-bottom: 4px;
            transition: var(--transition);
        }

        .tag-pill .remove-btn {
            cursor: pointer;
            border: none;
            background: none;
            color: #818CF8;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            padding: 0 2px;
        }

        .tag-pill .remove-btn:hover {
            color: #4F46E5;
        }

        /* Interactive Select Dropdown in Table Cells */
        .select-cell-inline {
            background-color: transparent;
            border: 1px solid transparent;
            padding: 4px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .select-cell-inline:hover {
            background-color: var(--bg-color);
            border-color: var(--border-color);
        }

        .select-cell-inline:focus {
            background-color: #FFFFFF;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        /* Dialog Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-container {
            background-color: var(--card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-container.modal-lg {
            max-width: 800px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.15rem;
            color: var(--text-main);
        }

        .modal-close-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .modal-close-btn:hover {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            background-color: #F9FAFB;
            border-bottom-left-radius: var(--radius-card);
            border-bottom-right-radius: var(--radius-card);
        }

        /* Form Layouts */
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-field label {
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Segmented control buttons for Expense / Income */
        .segmented-control {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 3px;
        }

        .segmented-btn {
            border: none;
            background: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
            color: var(--text-muted);
        }

        .segmented-btn.active.expense {
            background-color: var(--warning);
            color: #FFFFFF;
        }

        .segmented-btn.active.income {
            background-color: var(--success);
            color: #FFFFFF;
        }

        /* Checklist grids / items */
        .flex-row-gap {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* Progress trackers */
        .progress-container {
            width: 100%;
            margin-top: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-bar-fill.success { background-color: var(--success); }
        .progress-bar-fill.warning { background-color: var(--warning); }
        .progress-bar-fill.danger { background-color: var(--danger); }
        .progress-bar-fill.primary { background-color: var(--primary); }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.775rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Drag-and-drop file upload */
        .upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-card);
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            background-color: #FAFAFA;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-muted);
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .upload-zone svg {
            width: 48px;
            height: 48px;
            color: var(--text-light);
        }

        /* Settings configuration lists */
        .settings-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            margin-bottom: 8px;
        }

        /* Danger Zone style */
        .danger-zone-card {
            border-color: var(--danger);
        }

        .danger-zone-title {
            color: var(--danger);
            font-weight: 600;
        }

        /* Period Picker Select component */
        .period-picker {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-btn);
            padding: 8px 12px;
            background-color: #FFFFFF;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            height: 40px;
        }

        /* Custom SVG Donut Component Styles */
        .chart-legend {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            margin-top: 16px;
            max-height: 120px;
            overflow-y: auto;
        }

        .chart-legend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .legend-color-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .legend-value-percent {
            font-weight: 600;
            color: var(--text-main);
        }

        /* Notification Toast */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background-color: #1F2937;
            color: #FFFFFF;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            animation: slideInRight 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.success { background-color: var(--success); }
        .toast.error { background-color: var(--danger); }
        .toast.warning { background-color: var(--warning); }

        /* Sync Status Alert Banner */
        .status-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 12px 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-weight: 500;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Mobile Bottom Nav Navigation */
        .mobile-topbar {
            display: none;
            height: 60px;
            background-color: var(--topbar-bg);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--sidebar-bg);
            border-top: 1px solid var(--border-color);
            z-index: 100;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .mobile-nav-scroll {
            display: flex;
            padding: 8px 12px;
            gap: 16px;
            width: max-content;
        }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 500;
            padding: 4px 8px;
            min-width: 70px;
            cursor: pointer;
        }

        .mobile-nav-item.active {
            color: var(--primary);
        }

        .mobile-nav-item svg {
            width: 20px;
            height: 20px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .dashboard-charts {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .topbar {
                display: none;
            }
            .mobile-topbar {
                display: flex;
            }
            .mobile-bottom-nav {
                display: block;
            }
            .main-wrapper {
                margin-left: 0;
                padding-bottom: 70px; /* Space for bottom nav */
            }
            .content-body {
                padding: 16px;

            .content-columns {

                align-items: flex-start;
                gap: 12px;

            .page-header .btn, .page-header select {

<body>

    <!-- React App Definition (Babel JSX compile) -->
    <script type="text/babel">

        // --- global currency helper utilities ---
        const formatCurrencyVal = (val, currencyCode = "INR") => {
            const localeMap = {
                INR: "en-IN",

                EUR: "en-IE",
                GBP: "en-GB",
                JPY: "ja-JP",
                CAD: "en-CA",
                AUD: "en-AU"
            };
            const locale = localeMap[currencyCode] || "en-US";
            return new Intl.NumberFormat(locale, { style: 'currency', currency: currencyCode }).format(val);
        };

        const getCurrencySymbol = (currencyCode = "INR") => {
            const symbols = {
                INR: "₹",
                USD: "$",
                EUR: "€",
                GBP: "£",
                JPY: "¥",
                CAD: "$",
                AUD: "$"

            return symbols[currencyCode] || "₹";

        // --- inline SVG icon components to avoid external SVG dependencies ---
        const Icon = ({ name, currency = "INR", className = "" }) => {

                download: (

                close: (

                        <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>

            return (

                    {icons[name] || icons.home}
                </span>
            );
        };

        // --- IndexedDB Database wrapper engine ---
        const DB_NAME = "FinancialsDB";
        const DB_VERSION = 1;

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    
                    if (!db.objectStoreNames.contains("transactions")) {
                        const txStore = db.createObjectStore("transactions", { keyPath: "id" });
                        txStore.createIndex("fingerprint", "fingerprint", { unique: true });
                    }
                    if (!db.objectStoreNames.contains("tags")) {
                        db.createObjectStore("tags", { keyPath: "name" });
                    }
                    if (!db.objectStoreNames.contains("rules")) {
                        db.createObjectStore("rules", { keyPath: "id" });
                    }
                    if (!db.objectStoreNames.contains("settings")) {
                        db.createObjectStore("settings", { keyPath: "key" });
                    }
                    if (!db.objectStoreNames.contains("documents")) {
                        db.createObjectStore("documents", { keyPath: "id" });
                    }
                };

                request.onsuccess = (e) => {
                    const db = e.target.result;
                    resolve(db);
                };

                request.onerror = (e) => {
                    reject(e.target.error);
                };
            });
        };

        // Get single store transaction helper
        const getStore = (db, storeName, mode = "readonly") => {
            const tx = db.transaction(storeName, mode);
            return tx.objectStore(storeName);
        };

        // Read unified state from IndexedDB
        const fetchStateFromDB = async () => {
            const db = await initDB();
            
            const readStore = (storeName) => {
                return new Promise((resolve) => {
                    const tx = db.transaction(storeName, "readonly");
                    const store = tx.objectStore(storeName);
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve([]);
                });
            };

            const transactions = await readStore("transactions");
            const tags = await readStore("tags");
            const rules = await readStore("rules");
            const settingsRows = await readStore("settings");
            const documents = await readStore("documents");

            // Convert settings array of {key, value} to a hash map
            const settings = {};
            settingsRows.forEach(row => {
                try {
                    settings[row.key] = JSON.parse(row.value);
                } catch(e) {
                    settings[row.key] = row.value;
                }
            });

            // Set default settings if not exists
            const defaultSettings = {
                currency: "INR",
                categories: [
                    "Housing", "Groceries", "Shopping", "Dining", "Transportation", 
                    "Utilities", "Subscriptions", "Insurance", "Health", "Entertainment", 
                    "Income", "Needs review", "Other"
                ],
                accounts: ["Main Checking", "Everyday Visa", "Rewards Card", "Cash"],
                selectedPeriod: "all-time",
                netWorthConfigured: false,
                assetsTotal: 0,
                liabilitiesTotal: 0,
                goals: [],
                budgets: [],
                subscriptions: [],
                recurring: [],
                dismissedPatterns: [],
                processedFileIds: [],
                driveResetAt: null,
                freshStart: true
            };

            // Merge default settings
            Object.keys(defaultSettings).forEach(key => {
                if (settings[key] === undefined) {
                    settings[key] = defaultSettings[key];
                }
            });

            // Sort transactions: newest first, capped to 5000
            const sortedTransactions = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5000);
            // Sort documents: newest first, capped to 100
            const sortedDocuments = [...documents].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 100);

            return {
                transactions: sortedTransactions,
                tags,
                rules,
                settings,
                documents: sortedDocuments
            };
        };

        // Write settings/preferences directly to IndexedDB
        const saveSettingInDB = async (key, value) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("settings", "readwrite");
                const store = tx.objectStore("settings");
                const req = store.put({
                    key,
                    value: JSON.stringify(value),
                    updatedAt: new Date().toISOString()
                });
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        };

        // Write batch/single transactions to IndexedDB
        const saveTransactionsInDB = async (newTransactions) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("transactions", "readwrite");
                const store = tx.objectStore("transactions");
                let inserted = 0;
                let duplicates = 0;

                newTransactions.forEach(t => {
                    const req = store.add(t); // add fails if fingerprint index is not unique
                    req.onsuccess = () => {
                        inserted++;
                    };
                    req.onerror = (e) => {
                        // Check if it's a constraint error (duplicate fingerprint)
                        if (e.target.error.name === "ConstraintError") {
                            duplicates++;
                        }
                        e.preventDefault(); // prevent transaction abort
                    };
                });

                tx.oncomplete = () => {
                    resolve({ inserted, duplicates });
                };
                tx.onerror = () => {
                    reject(tx.error);
                };
            });
        };

        // Save a tag definition
        const saveTagInDB = async (tag) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("tags", "readwrite");
                const store = tx.objectStore("tags");
                const req = store.put(tag);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        };

        // Delete a tag definition
        const deleteTagFromDB = async (tagName) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("tags", "readwrite");
                const store = tx.objectStore("tags");
                const req = store.delete(tagName);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        };

        // Save a categorization rule
        const saveRuleInDB = async (rule) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("rules", "readwrite");
                const store = tx.objectStore("rules");
                const req = store.put(rule);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        };

        // Delete a rule
        const deleteRuleFromDB = async (ruleId) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("rules", "readwrite");
                const store = tx.objectStore("rules");
                const req = store.delete(ruleId);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        };

        // Update single transaction category/tags
        const updateTransactionInDB = async (transaction) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("transactions", "readwrite");
                const store = tx.objectStore("transactions");
                const req = store.put(transaction);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        };

        // Delete single transaction
        const deleteTransactionFromDB = async (id) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("transactions", "readwrite");
                const store = tx.objectStore("transactions");
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        };

        // Save a document file blob and metadata
        const saveDocumentInDB = async (doc) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("documents", "readwrite");
                const store = tx.objectStore("documents");
                const req = store.put(doc);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        };

        // Delete single document
        const deleteDocumentFromDB = async (id) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("documents", "readwrite");
                const store = tx.objectStore("documents");
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        };

        // Delete document and all associated transactions in a single transaction block
        const deleteDocumentAndTransactionsFromDB = async (docId) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(["documents", "transactions"], "readwrite");
                const docStore = tx.objectStore("documents");
                const txStore = tx.objectStore("transactions");
                
                docStore.delete(docId);
                
                const req = txStore.openCursor();
                req.onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) {
                        if (cursor.value.documentId === docId) {
                            cursor.delete();
                        }
                        cursor.continue();
                    }
                };
                
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        };

        // Complete database wipe
        const wipeDatabase = async () => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transactionStores = ["transactions", "tags", "rules", "settings", "documents"];
                const tx = db.transaction(transactionStores, "readwrite");
                
                transactionStores.forEach(storeName => {
                    tx.objectStore(storeName).clear();
                });

                tx.oncomplete = async () => {
                    // Recreate settings empty-state rows
                    const now = new Date().toISOString();
                    const db = await initDB();
                    const setTx = db.transaction("settings", "readwrite");
                    const store = setTx.objectStore("settings");
                    
                    const emptySettings = [
                        { key: "currency", value: JSON.stringify("INR") },
                        { key: "categories", value: JSON.stringify(["Housing", "Groceries", "Shopping", "Dining", "Transportation", "Utilities", "Subscriptions", "Insurance", "Health", "Entertainment", "Income", "Needs review", "Other"]) },
                        { key: "accounts", value: JSON.stringify(["Main Checking", "Everyday Visa", "Rewards Card", "Cash"]) },
                        { key: "selectedPeriod", value: JSON.stringify("all-time") },
                        { key: "netWorthConfigured", value: JSON.stringify(false) },
                        { key: "assetsTotal", value: JSON.stringify(0) },
                        { key: "liabilitiesTotal", value: JSON.stringify(0) },
                        { key: "goals", value: JSON.stringify([]) },
                        { key: "budgets", value: JSON.stringify([]) },
                        { key: "subscriptions", value: JSON.stringify([]) },
                        { key: "recurring", value: JSON.stringify([]) },
                        { key: "dismissedPatterns", value: JSON.stringify([]) },
                        { key: "processedFileIds", value: JSON.stringify([]) },
                        { key: "driveResetAt", value: JSON.stringify(now) },
                        { key: "freshStart", value: JSON.stringify(true) }
                    ];

                    emptySettings.forEach(s => {
                        store.put({ key: s.key, value: s.value, updatedAt: now });
                    });

                    setTx.oncomplete = () => resolve();
                    setTx.onerror = () => reject(setTx.error);
                };

                tx.onerror = () => {
                    reject(tx.error);
                };
            });
        };


        // --- Normalization & Processing Utilities ---

        // Generates the transaction duplicate detection fingerprint
        const generateFingerprint = (t) => {
            const dateStr = String(t.date || "").trim();
            const merchantStr = String(t.merchant || "").trim().toLowerCase();
            const amountVal = Number(t.amount || 0).toFixed(2);
            const accountStr = String(t.account || "Imported account").trim().toLowerCase();
            return `${dateStr}|${merchantStr}|${amountVal}|${accountStr}`;
        };

        // Lowercase and trim merchant, strip terminal # plus digits, reference numbers
        const normalizeMerchantName = (merchant) => {
            if (!merchant) return "";
            let name = merchant.trim().toLowerCase();
            // Remove common payment terminal suffix codes (e.g. "Merchant Name #12345", "Merchant Name *982", "Merchant Name Ref 8943")
            name = name.replace(/#\d+/g, '');
            name = name.replace(/\*\d+/g, '');
            name = name.replace(/ref\s*\d+/g, '');
            name = name.replace(/val\s*\d+/g, '');
            name = name.replace(/[\d]{6,}/g, ''); // Remove reference numbers longer than 6 digits
            name = name.replace(/[^\w\s]/g, ' '); // Replace punctuation with space
            name = name.replace(/\s+/g, ' ').trim(); // Collapse whitespace
            return name;
        };

        // Filter transactions by period selector
        const filterTransactionsByPeriod = (transactions, period) => {
            if (!period || period === "all-time") return transactions;

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth(); // 0-indexed

            return transactions.filter(t => {
                const tDate = new Date(t.date);
                if (isNaN(tDate.getTime())) return false;

                const tYear = tDate.getFullYear();
                const tMonth = tDate.getMonth();

                switch (period) {
                    case "this-month":
                        return tYear === currentYear && tMonth === currentMonth;
                    case "last-month": {
                        const targetMonth = currentMonth === 0 ? 11 : currentMonth - 1;
                        const targetYear = currentMonth === 0 ? currentYear - 1 : currentYear;
                        return tYear === targetYear && tMonth === targetMonth;
                    }
                    case "last-3-months": {
                        // Start of 3 months ago
                        const limitDate = new Date(currentYear, currentMonth - 3, 1);
                        return tDate >= limitDate && tDate <= now;
                    }
                    case "last-6-months": {
                        const limitDate = new Date(currentYear, currentMonth - 6, 1);
                        return tDate >= limitDate && tDate <= now;
                    }
                    case "this-year":
                        return tYear === currentYear;
                    default:
                        return true;
                }
            });
        };

        // Client-side CSV Text Parser
        const parseCSVText = (text) => {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        row[row.length - 1] += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push('');
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') {
                        i++;
                    }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += char;
                }
            }
            if (row.length > 1 || row[0] !== '') {
                lines.push(row);
            }
            return lines;
        };

        // Client-side PDF Text Extractor (with Password Protection decrypt)
        const extractTextFromPDF = async (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const arrayBuffer = e.target.result;
                        const pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
                        if (!pdfjsLib) {
                            throw new Error("PDF.js library is not loaded.");
                        }

                        let pdf = null;
                        let password = "";
                        let attempts = 0;

                        while (attempts < 3) {
                            try {
                                const loadingTask = pdfjsLib.getDocument({
                                    data: arrayBuffer,
                                    password: password
                                });
                                pdf = await loadingTask.promise;
                                break; // Success!
                            } catch (err) {
                                if (err.name === 'PasswordException') {
                                    attempts++;
                                    if (attempts >= 3) {
                                        throw new Error("Incorrect password entered too many times.");
                                    }
                                    const msg = attempts > 1
                                        ? `Incorrect password. Please enter the password for "${file.name}":`
                                        : `The file "${file.name}" is password-protected. Please enter the password:`;
                                    password = prompt(msg);
                                    if (password === null) {
                                        throw new Error("Password decryption cancelled by user");
                                    }
                                } else {
                                    throw err;
                                }
                            }
                        }

                        if (!pdf) {
                            throw new Error("Failed to load PDF");
                        }

                        let fullText = "";
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const textItems = textContent.items;

                            // Reconstruct line layout using translateY coordinates
                            const lines = {};
                            for (const item of textItems) {
                                const y = Math.round(item.transform[5] * 10) / 10;
                                if (!lines[y]) {
                                    lines[y] = [];
                                }
                                lines[y].push(item);
                            }

                            const sortedY = Object.keys(lines).sort((a, b) => parseFloat(b) - parseFloat(a));
                            const pageLines = sortedY.map(y => {
                                const lineItems = lines[y].sort((a, b) => a.transform[4] - b.transform[4]);
                                return lineItems.map(item => item.str).join(" ");
                            });

                            fullText += pageLines.join("\n") + "\n";
                        }
                        resolve(fullText);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = (err) => reject(err);
                reader.readAsArrayBuffer(file);
            });
        };

        // Heuristic date parser helper
        const parseHeuristicDate = (dateStr) => {
            try {
                let cleaned = dateStr.replace(/[\/.]/g, "-").trim();
                const parts = cleaned.split("-");
                if (parts.length === 3) {
                    let [p1, p2, p3] = parts;
                    if (p3.length === 2) {
                        p3 = "20" + p3;
                    }
                    if (p1.length === 4) {
                        const d = new Date(`${p1}-${p2}-${p3}`);
                        if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
                    } else {
                        // JS parser naturally accepts MM-DD-YYYY
                        // Let's check if the month and day parts are swapped
                        // If p1 > 12, assume it's DD-MM-YYYY
                        let mm = parseInt(p1);
                        let dd = parseInt(p2);
                        if (mm > 12 && dd <= 12) {
                            // Swapped
                            const d = new Date(`${p3}-${p2}-${p1}`);
                            if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
                        }
                        const d = new Date(`${p1}-${p2}-${p3}`);
                        if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
                    }
                }
                const d = new Date(dateStr);
                if (!isNaN(d.getTime()) && d.getFullYear() > 1990 && d.getFullYear() < 2100) {
                    return d.toISOString().split('T')[0];
                }
            } catch (e) {}
            return null;
        };

        // Heuristic PDF statement / receipt transaction extraction parser
        const parseTransactionsFromPDFText = (text, filename) => {
            const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
            const transactions = [];

            // Date regexes (matches YYYY-MM-DD, MM/DD/YYYY, Jan 12, 12 Jan, etc.)
            const dateRegex = /(?:\b)(\d{4}[-/]\d{1,2}[-/]\d{1,2}|\d{1,2}[-/]\d{1,2}[-/]\d{2,4}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* \d{1,2}(?:\s*,\s*\d{2,4})?|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*(?:\s+\d{2,4})?)(?:\b)/i;
            
            // Amount regex: matches values like $1,234.56, -12.34, 45.00, etc.
            const amountRegex = /(-?\$?\s?\d{1,3}(?:,\d{3})*(?:\.\d{2}))\b/;

            // Let's scan line by line for statement transactions
            for (const line of lines) {
                const dateMatch = line.match(dateRegex);
                const amtMatch = line.match(amountRegex);

                if (dateMatch && amtMatch) {
                    const dateStr = dateMatch[0];
                    const amtStr = amtMatch[0];

                    // Parse date
                    let parsedDate = parseHeuristicDate(dateStr);
                    if (!parsedDate) continue;

                    // Parse amount
                    const cleanAmtStr = amtStr.replace(/[^\d.-]/g, '');
                    const amount = parseFloat(cleanAmtStr);
                    if (isNaN(amount)) continue;

                    // Extract merchant by removing date and amount from the line
                    let merchant = line
                        .replace(dateStr, "")
                        .replace(amtStr, "")
                        .replace(/[\s,|#-]+/g, " ")
                        .trim();

                    // Clean transaction words
                    merchant = merchant.replace(/^(debit|credit|purchase|card|pos|withdrawal|deposit)\b/i, "").trim();

                    if (merchant.length > 2) {
                        transactions.push({
                            id: crypto.randomUUID(),
                            date: parsedDate,
                            merchant: merchant,
                            amount: Math.abs(amount),
                            type: amount < 0 ? "expense" : "income",
                            category: "Needs review",
                            account: "PDF Statement",
                            source: "pdf-import",
                            tags: [],
                            receipt: false
                        });
                    }
                }
            }

            // If no multiple list-like transactions found, check if it is a single receipt or invoice
            if (transactions.length <= 1) {
                // Try receipt heuristic
                const dateMatch = text.match(dateRegex);
                // Look for "total" or "amount due" or "grand total" or "total paid"
                const totalKeywords = /(?:total|amount due|grand total|net total|balance due|total paid|paid)\s*[:$]?\s*(-?\$?\s?\d{1,3}(?:,\d{3})*(?:\.\d{2}))/i;
                const totalMatch = text.match(totalKeywords);

                let dateVal = dateMatch ? parseHeuristicDate(dateMatch[0]) : new Date().toISOString().split('T')[0];
                let amountVal = null;
                if (totalMatch) {
                    const cleanAmtStr = totalMatch[1].replace(/[^\d.-]/g, '');
                    amountVal = Math.abs(parseFloat(cleanAmtStr));
                }

                let merchantVal = "";
                const cleanLines = lines.filter(l => !l.toLowerCase().includes("invoice") && !l.toLowerCase().includes("receipt") && l.length > 3);
                if (cleanLines.length > 0) {
                    merchantVal = cleanLines[0]; // first line is usually the store name
                } else {
                    merchantVal = filename.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " "); // fallback to filename
                }

                if (amountVal !== null && !isNaN(amountVal) && merchantVal) {
                    return [{
                        id: crypto.randomUUID(),
                        date: dateVal,
                        merchant: merchantVal,
                        amount: amountVal,
                        type: "expense", // receipts are usually expenses
                        category: "Needs review",
                        account: "PDF Receipt",
                        source: "pdf-import",
                        tags: [],
                        receipt: true
                    }];
                }
            }

            return transactions;
        };


        // --- Recurring & Subscription Detection Algorithm (Section 9) ---
        const detectRecurringTransactions = (transactions, rules, dismissedPatterns = []) => {
            // Group expenses only
            const expenses = transactions.filter(t => t.type === "expense");
            const groups = {};

            // 1. Merchant Normalization & Candidate Grouping
            expenses.forEach(t => {
                const normMerchant = normalizeMerchantName(t.merchant);
                if (!normMerchant) return;
                
                if (!groups[normMerchant]) {
                    groups[normMerchant] = [];
                }
                groups[normMerchant].push(t);
            });

            const suggestions = [];

            Object.keys(groups).forEach(merchantName => {
                const txList = [...groups[merchantName]].sort((a, b) => new Date(a.date) - new Date(b.date));
                if (txList.length < 2) return; // Require at least two unique occurrences

                // Skip if dismissed/ignored
                if (dismissedPatterns.includes(merchantName)) return;

                // Calculate consecutive intervals (in days)
                const dates = txList.map(t => new Date(t.date));
                const intervals = [];
                for (let i = 1; i < dates.length; i++) {
                    const diffTime = Math.abs(dates[i] - dates[i-1]);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    intervals.push(diffDays);
                }

                // Find the dominant/average interval
                const avgInterval = intervals.reduce((s, x) => s + x, 0) / intervals.length;
                
                // Determine Cadence Window matching (Section 9.2)
                let cadence = null;
                if (avgInterval >= 5 && avgInterval <= 9) cadence = "weekly";
                else if (avgInterval >= 12 && avgInterval <= 17) cadence = "biweekly";
                else if (avgInterval >= 24 && avgInterval <= 40) cadence = "monthly";
                else if (avgInterval >= 75 && avgInterval <= 110) cadence = "quarterly";
                else if (avgInterval >= 330 && avgInterval <= 400) cadence = "annual";

                if (!cadence) return; // Reject if doesn't fit cadence window

                // Calculate amount variation
                const amounts = txList.map(t => t.amount);
                const avgAmount = amounts.reduce((s, x) => s + x, 0) / amounts.length;
                const devAmounts = amounts.map(a => Math.abs(a - avgAmount) / avgAmount);
                const maxAmountDev = Math.max(...devAmounts);

                // Max variation checks
                const subHints = ["netflix", "spotify", "hulu", "disney", "youtube", "icloud", "dropbox", "adobe", "microsoft", "amazon prime", "patreon", "membership", "studio", "gym", "openai", "chatgpt", "canva", "notion", "zoom", "slack", "github"];
                const isSubHint = subHints.some(hint => merchantName.includes(hint)) || txList.some(t => t.category.toLowerCase() === "subscriptions" || t.tags.includes("subscription"));

                const billHints = ["mortgage", "rent", "loan", "insurance", "utility", "utilities", "electric", "water", "internet", "phone", "mobile", "daycare", "tuition", "lease", "car payment", "auto payment", "hoa", "property tax"];
                const isBillHint = billHints.some(hint => merchantName.includes(hint));

                // Deviation limit rules: Subscriptions <= 20%, other recurring <= 35%
                const allowedDev = isSubHint ? 0.20 : 0.35;
                if (maxAmountDev > allowedDev) return;

                // Section 9.5: Protection against false positives (require 3 occurrences and <=3% deviation if no hint)
                const hasHint = isSubHint || isBillHint;
                if (!hasHint) {
                    if (txList.length < 3) return; // 3 occurrences minimum
                    if (maxAmountDev > 0.03) return; // <= 3% amount variation
                }

                // Jitter (deviation from exact calendar cadence)
                const jitter = Math.max(...intervals.map(i => Math.abs(i - avgInterval)));

                // Confidence Calculation (Section 9.6)
                // High confidence: at least 3 occurrences, amount deviation <= 12%, interval jitter <= 5 days
                let confidence = "likely";
                if (txList.length >= 3 && maxAmountDev <= 0.12 && jitter <= 5) {
                    confidence = "high";
                }

                // Calculate Next Expected Date calendar-aware (Section 9.6)
                const lastDate = dates[dates.length - 1];
                let nextDate = new Date(lastDate);
                if (cadence === "weekly") nextDate.setDate(nextDate.getDate() + 7);
                else if (cadence === "biweekly") nextDate.setDate(nextDate.getDate() + 14);
                else if (cadence === "monthly") nextDate.setMonth(nextDate.getMonth() + 1);
                else if (cadence === "quarterly") nextDate.setMonth(nextDate.getMonth() + 3);
                else if (cadence === "annual") nextDate.setFullYear(nextDate.getFullYear() + 1);

                // Convert to monthly equivalents (Section 9.6)
                let monthlyEquivalent = avgAmount;
                if (cadence === "weekly") monthlyEquivalent = (avgAmount * 52) / 12;
                else if (cadence === "biweekly") monthlyEquivalent = (avgAmount * 26) / 12;
                else if (cadence === "quarterly") monthlyEquivalent = avgAmount / 3;
                else if (cadence === "annual") monthlyEquivalent = avgAmount / 12;

                suggestions.push({
                    merchantNormalized: merchantName,
                    merchantDisplay: txList[txList.length - 1].merchant,
                    category: txList[txList.length - 1].category,
                    cadence,
                    occurrences: txList.length,
                    confidence,
                    averageCharge: avgAmount,
                    monthlyEquivalent,
                    nextDate: nextDate.toISOString().split('T')[0],
                    isSubscription: isSubHint
                });
            });

            return suggestions;
        };


        // --- React Dashboard Application ---
        const App = () => {
            // Main unified states
            const [activePage, setActivePage] = React.useState("dashboard");
            const [transactions, setTransactions] = React.useState([]);
            const [tags, setTags] = React.useState([]);
            const [rules, setRules] = React.useState([]);
            const [settings, setSettings] = React.useState({});

                    setTags(state.tags);
                    setRules(state.rules);
                    setSettings(state.settings);
                    setDocuments(state.documents);
                } catch(e) {
                    showToast("Error loading local database", "error");
                } finally {
                    setLoading(false);
                }
            };

            React.useEffect(() => {
                loadState();
            }, []);

            // Helper to display floating toasts
            const showToast = (message, type = "success") => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3500);
            };

            // Updates settings store (Section 4.5 Preferences API)
            const updateSetting = async (key, value) => {
                try {
                    await saveSettingInDB(key, value);
                    setSettings(prev => ({ ...prev, [key]: value }));
                } catch(e) {
                    showToast("Failed to save preference settings", "error");

            };

            // Insert new transaction manually / batch CSV imports
            const handleAddTransactions = async (newItems) => {
                const processed = newItems.map(t => {

                    const item = {
                        id: t.id || crypto.randomUUID(),

                    // Categorization Rule checking
                    let matchedCategory = item.category;

                            matchedCategory = rule.thenText; // Map rule trigger
                        }
                    });
                    item.category = matchedCategory;

                    // Compute unique fingerprint
                    item.fingerprint = generateFingerprint(item);

                });

                try {

                }
            };

            // Delete transaction
            const handleDeleteTransaction = async (id) => {

            };

            // Delete document and its transactions
            const handleDeleteDocument = async (docId) => {

                }
            };

            // Quick category/tag updates inline in table cell
            const handlePatchTransaction = async (id, patch) => {

                if (!tx) return;

                const updated = { ...tx, ...patch };
                // Generate a new fingerprint since category/tag changes doesn't impact fingerprint,
                // but if we patch date/merchant/amount/account, it changes the fingerprint.
                updated.fingerprint = generateFingerprint(updated);

                try {

                    setTransactions(prev => prev.map(t => t.id === id ? updated : t));
                    showToast("Transaction updated");

                }
            };

            // PDF Bank Statement / Receipt Import handler
            const [pdfImportData, setPdfImportData] = React.useState(null);

            const handlePdfParsed = (parsedTransactions, filename, file) => {
                setPdfImportData({

                    }),

                });
            };

            const triggerPdfImport = async (selectedTransactions) => {

            // CSV Bank Statement Column Mapping UI Modal handler
            const [csvMappingData, setCsvMappingData] = React.useState(null);

            const handleCsvParsed = (rows, filename) => {
                if (rows.length < 2) {

                setCsvMappingData({

                    filename,
                    mappings: {
                        date: 0,

                    }
                });
            };

            const triggerCsvImport = async (mappings) => {

                const itemsToInsert = [];
                const docId = crypto.randomUUID();

                rows.forEach(row => {
                    const dateVal = row[mappings.date] || "";
                    const merchantVal = row[mappings.merchant] || "";
                    let amountVal = 0;
                    let typeVal = "expense";

                    if (mappings.debit !== -1 && mappings.credit !== -1) {

                        const cred = Math.abs(parseFloat(String(row[mappings.credit] || "0").replace(/[^\d.-]/g, '')));
                        if (cred > 0) {
                            amountVal = cred;
