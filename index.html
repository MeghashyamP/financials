<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financials - Personal Financial Dashboard</title>

    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- React & Babel Standalone via CDN -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js" crossorigin></script>

    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- PDF-lib CDN (Best for Pre-Processing & Info Extraction) -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- Tesseract.js CDN (Client-side OCR for Scanned Bank Statements) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>

    <!-- Vanilla CSS Design System styling -->
    <style>
        :root {
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --primary: #6558D3;
            --primary-hover: #4F46B5;
            --primary-light: #EEECFB;
            --success: #10B981;
            --success-light: #D1FAE5;
            --warning: #F59E0B;
            --warning-light: #FEF3C7;
            --danger: #EF4444;
            --danger-light: #FEE2E2;
            --info: #3B82F6;
            --info-light: #DBEAFE;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --text-light: #9CA3AF;
            --border-color: #E5E7EB;
            --sidebar-bg: #FFFFFF;
            --topbar-bg: #FFFFFF;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius-card: 16px;
            --radius-btn: 10px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            font-size: 14px;
            line-height: 1.5;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
            font-size: inherit;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
        }

        a:hover {
            color: var(--primary-hover);
        }

        /* App Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Sidebar - Desktop */
        .sidebar {
            width: 238px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 24px 14px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            padding: 0 6px;
            margin-bottom: 32px;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary);
            height: 32px;
            white-space: nowrap;
        }

        .sidebar-brand .inline-flex,
        .sidebar-brand svg {
            width: 28px !important;
            height: 28px !important;
            min-width: 28px;
            min-height: 28px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .sidebar-nav {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-nav-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: var(--radius-btn);
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            transition: background-color var(--transition), color var(--transition);
            white-space: nowrap;
            height: 40px;
            box-sizing: border-box;
        }

        .sidebar-nav-item:hover,
        .sidebar-nav-item.active {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .sidebar-nav-item .inline-flex,
        .sidebar-nav-item svg {
            width: 20px !important;
            height: 20px !important;
            min-width: 20px;
            min-height: 20px;
            flex-shrink: 0;
        }

        .sidebar-label {
            margin-left: 12px;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.2s ease, max-width 0.25s ease, margin-left 0.25s ease;
            max-width: 150px;
            opacity: 1;
            display: inline-block;
        }

        /* Collapsed Sidebar Styles */
        .sidebar.collapsed {
            width: 68px;
            overflow: visible;
        }

        .sidebar.collapsed .sidebar-nav {
            overflow: visible;
        }

        .sidebar.collapsed .sidebar-label {
            opacity: 0;
            max-width: 0;
            margin-left: 0;
            pointer-events: none;
        }

        /* Collapsed Sidebar Hover Tooltips */
        .sidebar.collapsed .sidebar-brand,
        .sidebar.collapsed .sidebar-nav-item {
            position: relative;
        }

        .sidebar.collapsed .sidebar-brand::after,
        .sidebar.collapsed .sidebar-nav-item::after {
            content: attr(title);
            position: absolute;
            left: calc(100% + 10px);
            top: 50%;
            transform: translateY(-50%) translateX(-4px);
            background-color: #0f172a;
            color: #f8fafc;
            padding: 5px 11px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
            z-index: 1000;
        }

        .sidebar.collapsed .sidebar-brand:hover::after,
        .sidebar.collapsed .sidebar-nav-item:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateY(-50%) translateX(0);
        }

        .sidebar-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 36px;
            padding: 8px;
            margin-top: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-btn);
            color: var(--text-muted);
            cursor: pointer;
            transition: background-color var(--transition), color var(--transition);
            flex-shrink: 0;
        }

        .sidebar-toggle-btn:hover {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        /* Main Content Container */
        .main-wrapper {
            flex: 1;
            margin-left: 238px;
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .main-wrapper.sidebar-collapsed {
            margin-left: 68px;
        }

        /* Top Bar - Desktop */
        .topbar {
            min-height: 76px;
            padding: 14px 32px;
            background-color: var(--topbar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .topbar-title-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .topbar-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
            line-height: 1.2;
        }

        .topbar-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.3;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-left: auto;
        }

        .topbar-actions .btn-primary {
            min-width: 170px;
            height: 40px;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Common Button Styles */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            height: 40px;
            border-radius: var(--radius-btn);
            border: 1px solid transparent;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #FFFFFF;
            border-color: var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--bg-color);
        }

        .btn-danger {
            background-color: var(--danger);
            color: #FFFFFF;
        }

        .btn-danger:hover {
            background-color: #DC2626;
        }

        .btn-sm {
            padding: 6px 12px;
            height: 32px;
            font-size: 0.85rem;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Main View Shell */
        .content-body {
            padding: 32px;
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            transition: max-width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease;
        }

        .main-wrapper.sidebar-collapsed .content-body {
            max-width: 100%;
            width: 100%;
        }

        /* Page Layout Utilities */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 16px;
        }

        .page-title-desc h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .page-title-desc p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Summary Cards Grid */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-icon {
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon.primary {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .card-icon.success {
            background-color: var(--success-light);
            color: var(--success);
        }

        .card-icon.warning {
            background-color: var(--warning-light);
            color: var(--warning);
        }

        .card-icon.info {
            background-color: var(--info-light);
            color: var(--info);
        }

        .card-value {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 0.775rem;
            color: var(--text-muted);
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-subtitle.not-configured {
            color: var(--danger);
            font-weight: 500;
        }

        /* SVG Chart Layouts */
        .dashboard-charts {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }

        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 24px;
            display: flex;
            flex-direction: column;
            min-height: 380px;
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .chart-header-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .chart-container-inner {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Two-Column Section layout */
        .content-columns {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 24px;
            margin-bottom: 28px;
        }

        /* Section Cards & Dashboard Polish */
        .section-card,
        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .section-card:hover,
        .chart-card:hover {
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.03);
        }

        .section-card-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .insight-metric-card {
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            transition: all 0.2s ease;
        }

        .insight-metric-card:hover {
            border-color: #CBD5E1;
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .progress-bar-stacked {
            display: flex;
            height: 10px;
            border-radius: 6px;
            overflow: hidden;
            background: #E2E8F0;
            width: 100%;
        }

        .dashboard-badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .merchant-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            color: #FFFFFF;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 2px 6px rgba(99, 102, 241, 0.25);
            flex-shrink: 0;
        }

        /* Empty state helper */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-card);
            background-color: #FAFAFA;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            color: var(--text-light);
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .empty-state p {
            max-width: 320px;
            margin-bottom: 16px;
            font-size: 0.875rem;
        }

        /* Table Responsive Design */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .table th {
            background-color: #F9FAFB;
            padding: 14px 18px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .table td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .table tr:last-child td {
            border-bottom: none;
        }

        .table tr:hover td {
            background-color: #F9FAFB;
        }

        /* Filters Bar */
        .filters-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-control {
            height: 38px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #FFFFFF;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .search-control {
            min-width: 220px;
        }

        /* Badge/Pill Elements */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.775rem;
            font-weight: 500;
            text-transform: capitalize;
        }

        .badge-expense {
            background-color: var(--warning-light);
            color: var(--warning);
        }

        .badge-income {
            background-color: var(--success-light);
            color: var(--success);
        }

        .badge-review {
            background-color: var(--danger-light);
            color: var(--danger);
        }

        .badge-stored {
            background-color: var(--info-light);
            color: var(--info);
        }

        .badge-queued {
            background-color: #F3F4F6;
            color: var(--text-muted);
        }

        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: #E0E7FF;
            color: #4F46E5;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.775rem;
            font-weight: 500;
            margin-right: 4px;
            margin-bottom: 4px;
            transition: var(--transition);
        }

        .tag-pill .remove-btn {
            cursor: pointer;
            border: none;
            background: none;
            color: #818CF8;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            padding: 0 2px;
        }

        .tag-pill .remove-btn:hover {
            color: #4F46E5;
        }

        /* Interactive Select Dropdown in Table Cells */
        .select-cell-inline {
            background-color: transparent;
            border: 1px solid transparent;
            padding: 4px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .select-cell-inline:hover {
            background-color: var(--bg-color);
            border-color: var(--border-color);
        }

        .select-cell-inline:focus {
            background-color: #FFFFFF;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        /* Dialog Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-container {
            background-color: var(--card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-container.modal-lg {
            max-width: 800px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.15rem;
            color: var(--text-main);
        }

        .modal-close-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .modal-close-btn:hover {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;

                opacity: 1;

            const merch = String(tx?.merchant || tx?.narration || "Unknown").trim();

            // 1. Initial category prediction if missing, invalid, or generic
            let categoryVal = tx?.category || "";
            const isValidCategory = categoriesPool.includes(categoryVal);

            if (!categoryVal || !isValidCategory || categoryVal === "Needs review" || categoryVal === "Uncategorized") {
                categoryVal = predictBestCategory(merch, typeVal, categoriesPool);
            }

            // 2. Evaluate user categorization rules (Rules OVERWRITE initial suggestions)
            (rules || []).forEach(rule => {
                if (rule && rule.enabled === 1 && rule.whenText && merch.toLowerCase().includes(String(rule.whenText).toLowerCase())) {
                    if (rule.thenText) {
                        categoryVal = rule.thenText;
                    }
                }
            });

            if (!categoriesPool.includes(categoryVal)) {
                const matched = categoriesPool.find(c => c.toLowerCase() === categoryVal.toLowerCase() || c.toLowerCase().includes(categoryVal.toLowerCase()));

        };

        // --- IndexedDB Database wrapper engine ---
        const DB_NAME = "FinancialsDB";
        const DB_VERSION = 1;

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onupgradeneeded = (e) => {
                    const db = e.target.result;

                    if (!db.objectStoreNames.contains("transactions")) {
                        const txStore = db.createObjectStore("transactions", { keyPath: "id" });
                        txStore.createIndex("fingerprint", "fingerprint", { unique: true });
                    }
                    if (!db.objectStoreNames.contains("tags")) {
                        db.createObjectStore("tags", { keyPath: "name" });
                    }
                    if (!db.objectStoreNames.contains("rules")) {
                        db.createObjectStore("rules", { keyPath: "id" });
                    }
                    if (!db.objectStoreNames.contains("settings")) {
                        db.createObjectStore("settings", { keyPath: "key" });
                    }
                    if (!db.objectStoreNames.contains("documents")) {
                        db.createObjectStore("documents", { keyPath: "id" });
                    }
                };

                request.onsuccess = (e) => {
                    const db = e.target.result;
                    resolve(db);
                };

                request.onerror = (e) => {
                    reject(e.target.error);
                };
            });
        };

        // Get single store transaction helper
        const getStore = (db, storeName, mode = "readonly") => {
            const tx = db.transaction(storeName, mode);
            return tx.objectStore(storeName);
        };

        // Read unified state from IndexedDB
        const fetchStateFromDB = async () => {
            const db = await initDB();

            const readStore = (storeName) => {
                return new Promise((resolve) => {
                    const tx = db.transaction(storeName, "readonly");
                    const store = tx.objectStore(storeName);
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve([]);
                });
            };

            const transactions = await readStore("transactions");
            const tags = await readStore("tags");
            const rules = await readStore("rules");
            const settingsRows = await readStore("settings");
            const documents = await readStore("documents");

            // Convert settings array of {key, value} to a hash map
            const settings = {};
            settingsRows.forEach(row => {
                try {
                    settings[row.key] = JSON.parse(row.value);
                } catch (e) {
                    settings[row.key] = row.value;
                }
            });

            // Set default settings if not exists
            const defaultSettings = {
                currency: "INR",
                dateFormat: "24/Jun/2002 Sun",
                categories: DEFAULT_CATEGORIES,
                accounts: ["Main Checking", "Everyday Visa", "Rewards Card", "Cash"],
                selectedPeriod: "all-time",
                netWorthConfigured: false,
                assetsTotal: 0,
                liabilitiesTotal: 0,
                goals: [],
                budgets: [],
                recurring: [],
                networthItems: [],
                forecast: { incomeOverride: null, expenseOverride: null, note: "" },
                dismissedPatterns: [],
                processedFileIds: [],
                driveResetAt: null,
                freshStart: true
            };

            // Merge default settings
            Object.keys(defaultSettings).forEach(key => {
                if (settings[key] === undefined) {
                    settings[key] = defaultSettings[key];
                }
            });

            // Migrate categories if needed
            const isOld = !settings.categories || settings.categories.length === 0 ||
                !settings.categories.includes("Food & Drinks - Breakfast 🍳");

            if (isOld) {
                settings.categories = DEFAULT_CATEGORIES;
                saveSettingInDB("categories", DEFAULT_CATEGORIES);

                // Migrate transactions
                const CATEGORY_MIGRATION_MAP = {
                    "Housing": "Home - Essentials 🧻",
                    "Groceries": "Groceries - Staples 🌾",
                    "Shopping": "Shopping - Clothes 👕",
                    "Dining": "Food & Drinks - Others ⚙️",
                    "Transportation": "Transport - Uber 🚗",
                    "Utilities": "Bill - Electricity ⚡",
                    "Subscriptions": "Subscription - Software 💾",
                    "Insurance": "Insurance - Others ⚙️",
                    "Health": "Medical - Medicines 💊",
                    "Entertainment": "Entertainment - Movies 🎬",
                    "Income": "Business - Salary 💵",
                    "Needs review": "Misc. - Verification ⏱️",
                    "Other": "Others - General ⚙️"
                };

                let txsUpdated = false;
                const migratedTransactions = transactions.map(t => {
                    if (CATEGORY_MIGRATION_MAP[t.category]) {
                        txsUpdated = true;
                        return { ...t, category: CATEGORY_MIGRATION_MAP[t.category] };
                    }
                    if (t.category && !t.category.includes(" - ")) {
                        txsUpdated = true;
                        return { ...t, category: `Others - ${t.category} ⚙️` };
                    }
                    return t;
                });

                if (txsUpdated) {
                    const updateTxsInDB = async () => {
                        const dbConn = await initDB();
                        const updateTx = dbConn.transaction("transactions", "readwrite");
                        const store = updateTx.objectStore("transactions");
                        migratedTransactions.forEach(t => {
                            store.put(t);
                        });
                    };
                    updateTxsInDB();
                    transactions.length = 0;
                    transactions.push(...migratedTransactions);
                }

                // Migrate budgets
                let budgetsUpdated = false;
                const migratedBudgets = (settings.budgets || []).map(b => {
                    if (CATEGORY_MIGRATION_MAP[b.category]) {
                        budgetsUpdated = true;
                        return { ...b, category: CATEGORY_MIGRATION_MAP[b.category] };
                    }
                    if (b.category && !b.category.includes(" - ")) {
                        budgetsUpdated = true;
                        return { ...b, category: `Others - ${b.category} ⚙️` };
                    }
                    return b;
                });
                if (budgetsUpdated) {
                    settings.budgets = migratedBudgets;
                    saveSettingInDB("budgets", migratedBudgets);
                }

                // Migrate rules
                let rulesUpdated = false;
                const migratedRules = rules.map(r => {
                    let changed = false;
                    let newThen = r.thenText;
                    if (CATEGORY_MIGRATION_MAP[r.thenText]) {
                        changed = true;
                        newThen = CATEGORY_MIGRATION_MAP[r.thenText];
                    } else if (r.thenText && !r.thenText.includes(" - ")) {
                        changed = true;
                        newThen = `Others - ${r.thenText} ⚙️`;
                    }
                    if (changed) {
                        rulesUpdated = true;
                        return { ...r, thenText: newThen };
                    }
                    return r;
                });
                if (rulesUpdated) {
                    const updateRulesInDB = async () => {
                        const dbConn = await initDB();
                        const updateTx = dbConn.transaction("rules", "readwrite");
                        const store = updateTx.objectStore("rules");
                        migratedRules.forEach(r => {
                            store.put(r);
                        });
                    };
                    updateRulesInDB();
                    rules.length = 0;
                    rules.push(...migratedRules);
                }
            }

            // Sort transactions: newest first, capped to 5000
            const sortedTransactions = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5000);
            // Sort documents: newest first, capped to 100
            const sortedDocuments = [...documents].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 100);

            return {
                transactions: sortedTransactions,
                tags,
                rules,
                settings,
                documents: sortedDocuments
            };
        };

        // Write settings/preferences directly to IndexedDB
        const saveSettingInDB = async (key, value) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("settings", "readwrite");
                const store = tx.objectStore("settings");
                const req = store.put({
                    key,
                    value: JSON.stringify(value),
                    updatedAt: new Date().toISOString()
                });
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        };

        // Write batch/single transactions to IndexedDB
        const saveTransactionsInDB = async (newTransactions) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("transactions", "readwrite");
                const store = tx.objectStore("transactions");
                let inserted = 0;
                let duplicates = 0;

                newTransactions.forEach(t => {
                    const req = store.add(t); // add fails if fingerprint index is not unique
                    req.onsuccess = () => {
                        inserted++;
                    };
                    req.onerror = (e) => {
                        // Check if it's a constraint error (duplicate fingerprint)
                        if (e.target.error.name === "ConstraintError") {
                            duplicates++;
                        }
                        e.preventDefault(); // prevent transaction abort
                    };
                });

                tx.oncomplete = () => {
                    resolve({ inserted, duplicates });
                };
                tx.onerror = () => {
                    reject(tx.error);
                };
            });
        };

        // Save a tag definition
        const saveTagInDB = async (tag) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("tags", "readwrite");
                const store = tx.objectStore("tags");
                const req = store.put(tag);

        // Delete a tag definition
        const deleteTagFromDB = async (tagName) => {

        // Save a categorization rule
        const saveRuleInDB = async (rule) => {

        const updateTransactionInDB = async (transaction) => {

        // Delete single transaction
        const deleteTransactionFromDB = async (id) => {

        // Save a document file blob and metadata
        const saveDocumentInDB = async (doc) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("documents", "readwrite");

        // Delete single document
        const deleteDocumentFromDB = async (id) => {

                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        };

        // Delete document and all associated transactions in a single transaction block
        const deleteDocumentAndTransactionsFromDB = async (docId) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(["documents", "transactions"], "readwrite");
                const docStore = tx.objectStore("documents");
                const txStore = tx.objectStore("transactions");

                docStore.delete(docId);

                const req = txStore.openCursor();
                req.onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) {
                        if (cursor.value.documentId === docId) {
                            cursor.delete();
                        }
                        cursor.continue();
                    }
                };

                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        };

        // Complete database wipe
        const wipeDatabase = async () => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transactionStores = ["transactions", "tags", "rules", "settings", "documents"];
                const tx = db.transaction(transactionStores, "readwrite");

                transactionStores.forEach(storeName => {
                    tx.objectStore(storeName).clear();
                });

                tx.oncomplete = async () => {
                    // Recreate settings empty-state rows
                    const now = new Date().toISOString();
                    const db = await initDB();
                    const setTx = db.transaction("settings", "readwrite");
                    const store = setTx.objectStore("settings");

                    const emptySettings = [
                        { key: "currency", value: JSON.stringify("INR") },
                        { key: "categories", value: JSON.stringify(DEFAULT_CATEGORIES) },
                        { key: "accounts", value: JSON.stringify(["Main Checking", "Everyday Visa", "Rewards Card", "Cash"]) },
                        { key: "selectedPeriod", value: JSON.stringify("all-time") },
                        { key: "netWorthConfigured", value: JSON.stringify(false) },
                        { key: "assetsTotal", value: JSON.stringify(0) },
                        { key: "liabilitiesTotal", value: JSON.stringify(0) },
                        { key: "goals", value: JSON.stringify([]) },
                        { key: "budgets", value: JSON.stringify([]) },
                        { key: "recurring", value: JSON.stringify([]) },
                        { key: "networthItems", value: JSON.stringify([]) },
                        { key: "forecast", value: JSON.stringify({ incomeOverride: null, expenseOverride: null, note: "" }) },
                        { key: "dismissedPatterns", value: JSON.stringify([]) },
                        { key: "processedFileIds", value: JSON.stringify([]) },
                        { key: "driveResetAt", value: JSON.stringify(now) },
                        { key: "freshStart", value: JSON.stringify(true) }
                    ];

                    emptySettings.forEach(s => {
                        store.put({ key: s.key, value: s.value, updatedAt: now });
                    });

                    setTx.oncomplete = () => resolve();
                    setTx.onerror = () => reject(setTx.error);
                };

                tx.onerror = () => {
                    reject(tx.error);
                };
            });
        };


        // --- Normalization & Processing Utilities ---

        // Format dates according to selected style
        const formatDate = (dateInput, formatStyle = "24/Jun/2002 Sun") => {
            if (!dateInput) return "";
            let date;
            if (dateInput instanceof Date) {
                date = dateInput;
            } else if (typeof dateInput === "number") {
                date = new Date(dateInput);
            } else {
                const str = String(dateInput).trim();
                const parts = str.split(/[-/]/);
                if (parts.length === 3 && parts[0].length === 4 && !str.includes("T") && !str.includes(" ")) {
                    const year = parseInt(parts[0], 10);
                    const month = parseInt(parts[1], 10) - 1;
                    const day = parseInt(parts[2], 10);
                    date = new Date(year, month, day);
                } else {
                    date = new Date(str);
                }
            }

            if (isNaN(date.getTime())) return String(dateInput);

            const monthsShort = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const weekdaysShort = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');

                case "MM/DD/YY":

                case "DD/MM/YYYY":

                case "YYYY-MM-DD":

            name = name.replace(/#\d+/g, '');
            name = name.replace(/\*\d+/g, '');
            name = name.replace(/ref\s*\d+/g, '');
            name = name.replace(/val\s*\d+/g, '');

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        row[row.length - 1] += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push('');
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') {
                        i++;
                    }
                    lines.push(row);
                    row = [''];
                } else {

        // Heuristic date parser helper

                    }
                    if (p1.length === 4) {

                    } else {

                        let dd = parseInt(p2);

                            const d = new Date(`${p3}-${p2}-${p1}`);
                            if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
                        }
                        const d = new Date(`${p1}-${p2}-${p3}`);
                        if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];

        // Advanced position-based table parser with visual baseline clustering and multi-line narration stitching
        const parsePositionedPDFTable = (items, filename, bankProfile) => {

            const linesByPage = {};

                matchedLine.items.push(item);
            }

            // Build array of sorted lines per page (descending Y)
            const allSortedLines = [];
            Object.keys(linesByPage).sort((a, b) => parseInt(a) - parseInt(b)).forEach(p => {
                const pageLines = linesByPage[p];
                pageLines.sort((a, b) => b.y - a.y);
                pageLines.forEach(line => {
                    const sortedItems = line.items.sort((a, b) => a.x - b.x);

                    const candidate = (combinedText + " " + nextStr).toLowerCase();

                        candidate === "value dt" || candidate === "value date" ||
                        candidate === "withdrawal amt." || candidate === "withdrawal amt" || candidate === "withdrawal amount" ||
                        candidate === "deposit amt." || candidate === "deposit amt" || candidate === "deposit amount" ||
                        candidate === "closing balance" || candidate === "opening balance" || candidate === "running balance" ||
                        candidate === "chq./ref.no." || candidate === "chq/ref.no" || candidate === "chq / ref no" || candidate === "chq. / ref. no." ||
                        candidate === "txn date" || candidate === "transaction date" || candidate === "post date"

            // Define exact adaptive X bounding ranges for each column
            const columns = [];
            for (let idx = 0; idx < rawHeaderColumns.length; idx++) {
                const col = rawHeaderColumns[idx];

            // Regroup text items into table rows with Multi-Line Narration Stitching
            const dateRegex = /(?:\b)(\d{4}[-/.]\d{1,2}[-/.]\d{1,2}|\d{1,2}[-/.]\d{1,2}[-/.]\d{2,4}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* \d{1,2}(?:\s*,\s*\d{2,4})?|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*(?:\s+\d{2,4})?)(?:\b)/i;
            const amountRegex = /(-?[₹$€£¥]?\s?\d{1,3}(?:,\d{2,3})*(?:\.\d{1,2})?)\s*(cr|dr|crv|drv)?\b/i;

            const dateColIdx = columns.findIndex(c => /date|dt/i.test(c.name) && !/val/i.test(c.name));
            const dateCol = dateColIdx >= 0 ? columns[dateColIdx] : columns[0];

        // Fallback PDF parser for unstructured bank statements
        const parseFallbackPDFText = (text, filename) => {

        // --- Recurring & Subscription Detection Algorithm (Section 9) ---
        const detectRecurringTransactions = (transactions, rules, dismissedPatterns = []) => {
            // Group expenses only
            const expenses = transactions.filter(t => t.type === "expense");
            const groups = {};

            // 1. Merchant Normalization & Candidate Grouping
            expenses.forEach(t => {
                const normMerchant = normalizeMerchantName(t.merchant);
                if (!normMerchant) return;

                if (!groups[normMerchant]) {
                    groups[normMerchant] = [];
                }
                groups[normMerchant].push(t);
            });

            const suggestions = [];

            Object.keys(groups).forEach(merchantName => {
                const txList = [...groups[merchantName]].sort((a, b) => new Date(a.date) - new Date(b.date));
                if (txList.length < 2) return; // Require at least two unique occurrences

                // Skip if dismissed/ignored
                if (dismissedPatterns.includes(merchantName)) return;

                // Calculate consecutive intervals (in days)
                const dates = txList.map(t => new Date(t.date));
                const intervals = [];
                for (let i = 1; i < dates.length; i++) {
                    const diffTime = Math.abs(dates[i] - dates[i - 1]);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    intervals.push(diffDays);
                }

                // Find the dominant/average interval
                const avgInterval = intervals.reduce((s, x) => s + x, 0) / intervals.length;

                // Determine Cadence Window matching (Section 9.2)
                let cadence = null;
                if (avgInterval >= 5 && avgInterval <= 9) cadence = "weekly";
                else if (avgInterval >= 12 && avgInterval <= 17) cadence = "biweekly";
                else if (avgInterval >= 24 && avgInterval <= 40) cadence = "monthly";
                else if (avgInterval >= 75 && avgInterval <= 110) cadence = "quarterly";
                else if (avgInterval >= 330 && avgInterval <= 400) cadence = "annual";

                if (!cadence) return; // Reject if doesn't fit cadence window

                // Calculate amount variation
                const amounts = txList.map(t => t.amount);
                const avgAmount = amounts.reduce((s, x) => s + x, 0) / amounts.length;
                const devAmounts = amounts.map(a => Math.abs(a - avgAmount) / avgAmount);
                const maxAmountDev = Math.max(...devAmounts);

                // Max variation checks
                const subHints = ["netflix", "spotify", "hulu", "disney", "youtube", "icloud", "dropbox", "adobe", "microsoft", "amazon prime", "patreon", "membership", "studio", "gym", "openai", "chatgpt", "canva", "notion", "zoom", "slack", "github"];
                const isSubHint = subHints.some(hint => merchantName.includes(hint)) || txList.some(t => t.category.toLowerCase() === "subscriptions" || t.tags.includes("subscription"));

                const billHints = ["mortgage", "rent", "loan", "insurance", "utility", "utilities", "electric", "water", "internet", "phone", "mobile", "daycare", "tuition", "lease", "car payment", "auto payment", "hoa", "property tax"];
                const isBillHint = billHints.some(hint => merchantName.includes(hint));

                // Deviation limit rules: Subscriptions <= 20%, other recurring <= 35%
                const allowedDev = isSubHint ? 0.20 : 0.35;
                if (maxAmountDev > allowedDev) return;

                // Section 9.5: Protection against false positives (require 3 occurrences and <=3% deviation if no hint)
                const hasHint = isSubHint || isBillHint;
                if (!hasHint) {
                    if (txList.length < 3) return; // 3 occurrences minimum
                    if (maxAmountDev > 0.03) return; // <= 3% amount variation
                }

                // Jitter (deviation from exact calendar cadence)
                const jitter = Math.max(...intervals.map(i => Math.abs(i - avgInterval)));

                // Confidence Calculation (Section 9.6)
                // High confidence: at least 3 occurrences, amount deviation <= 12%, interval jitter <= 5 days
                let confidence = "likely";
                if (txList.length >= 3 && maxAmountDev <= 0.12 && jitter <= 5) {
                    confidence = "high";
                }

                // Calculate Next Expected Date calendar-aware (Section 9.6)
                const lastDate = dates[dates.length - 1];
                let nextDate = new Date(lastDate);
                if (cadence === "weekly") nextDate.setDate(nextDate.getDate() + 7);
                else if (cadence === "biweekly") nextDate.setDate(nextDate.getDate() + 14);
                else if (cadence === "monthly") nextDate.setMonth(nextDate.getMonth() + 1);
                else if (cadence === "quarterly") nextDate.setMonth(nextDate.getMonth() + 3);
                else if (cadence === "annual") nextDate.setFullYear(nextDate.getFullYear() + 1);

                // Convert to monthly equivalents (Section 9.6)
                let monthlyEquivalent = avgAmount;
                if (cadence === "weekly") monthlyEquivalent = (avgAmount * 52) / 12;
                else if (cadence === "biweekly") monthlyEquivalent = (avgAmount * 26) / 12;
                else if (cadence === "quarterly") monthlyEquivalent = avgAmount / 3;
                else if (cadence === "annual") monthlyEquivalent = avgAmount / 12;

                suggestions.push({
                    merchantNormalized: merchantName,
                    merchantDisplay: txList[txList.length - 1].merchant,
                    category: txList[txList.length - 1].category,
                    cadence,
                    occurrences: txList.length,
                    confidence,
                    averageCharge: avgAmount,
                    monthlyEquivalent,
                    nextDate: nextDate.toISOString().split('T')[0],
                    isSubscription: isSubHint
                });
            });

            return suggestions;
        };

        const calculatePeriodDateRange = (periodKey, refDate = new Date(), customStart = "", customEnd = "") => {
            const pad = (n) => String(n).padStart(2, '0');
            const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

            const today = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());
            const year = today.getFullYear();
            const month = today.getMonth();

            let startDate, endDate;

            const key = (periodKey || "this_month").toLowerCase().replace(/-/g, "_");

            switch (key) {
                // --- Past Periods ---
                case "last_month":
                case "prev_month":
                case "previous_month":
                    startDate = new Date(year, month - 1, 1);
                    endDate = new Date(year, month, 0);
                    break;
                case "last_3_months":
                case "prev_3_months":
                case "previous_3_months":
                    startDate = new Date(year, month - 3, 1);
                    endDate = new Date(year, month, 0);
                    break;
                case "last_6_months":
                case "prev_6_months":
                case "previous_6_months":
                    startDate = new Date(year, month - 6, 1);
                    endDate = new Date(year, month, 0);
                    break;
                case "last_12_months":
                case "prev_12_months":
                case "previous_12_months":
                case "last_year":
                case "past_year":
                    startDate = new Date(year, month - 12, 1);
                    endDate = new Date(year, month, 0);
                    break;

                // --- Current Period ---
                case "this_month":
                case "current_month":
                case "monthly":
                    startDate = new Date(year, month, 1);
                    endDate = new Date(year, month + 1, 0);
                    break;
                case "this_year":
                case "current_year":
                    startDate = new Date(year, 0, 1);
                    endDate = new Date(year, 11, 31);
                    break;

                // --- Future Projections ---
                case "next_30_days":
                    startDate = new Date(today);
                    endDate = new Date(today);
                    endDate.setDate(endDate.getDate() + 30);
                    break;
                case "next_month":
                    startDate = new Date(year, month + 1, 1);
                    endDate = new Date(year, month + 2, 0);
                    break;
                case "next_3_months":
                case "next_quarter":
                    startDate = new Date(year, month + 1, 1);
                    endDate = new Date(year, month + 4, 0);
                    break;
                case "next_6_months":
                case "next_half_year":
                    startDate = new Date(year, month + 1, 1);
                    endDate = new Date(year, month + 7, 0);
                    break;
                case "next_12_months":
                case "next_year":
                    startDate = new Date(year, month + 1, 1);
                    endDate = new Date(year, month + 13, 0);
                    break;

                // --- All Time & Custom ---
                case "all_time":
                case "all":
                    startDate = new Date(1970, 0, 1);
                    endDate = new Date(2099, 11, 31);
                    break;
                case "custom":
                case "custom_range":
                    if (customStart && customEnd) {
                        const sParts = customStart.split('-').map(Number);
                        const eParts = customEnd.split('-').map(Number);
                        startDate = new Date(sParts[0], sParts[1] - 1, sParts[2]);
                        endDate = new Date(eParts[0], eParts[1] - 1, eParts[2]);
                    } else {
                        startDate = new Date(today);
                        endDate = new Date(today);
                        endDate.setDate(endDate.getDate() + 30);
                    }
                    break;

                default:
                    startDate = new Date(year, month, 1);
                    endDate = new Date(year, month + 1, 0);
                    break;
            }

            return {
                pStartStr: fmt(startDate),
                pEndStr: fmt(endDate),
                displayRange: key === "all_time" || key === "all" ? "All Time" : `${fmt(startDate)} to ${fmt(endDate)}`
            };
        };

        const getOccurrencesInPeriod = (item, pStartStr, pEndStr) => {
            if (!pStartStr || !pEndStr) return 0;

            const pStart = new Date(pStartStr + "T00:00:00");
            const pEnd = new Date(pEndStr + "T23:59:59");
            if (isNaN(pStart.getTime()) || isNaN(pEnd.getTime()) || pEnd < pStart) return 0;

            const effectiveStart = item.startDate ? new Date(item.startDate + "T00:00:00") : null;
            const itemEnd = item.endDate ? new Date(item.endDate + "T23:59:59") : null;

            if (itemEnd && itemEnd < pStart) return 0;
            if (effectiveStart && effectiveStart > pEnd) return 0;

            const cadence = item.cadence || "monthly";
            const startStr = item.startDate || item.nextDate || pStartStr;
            const itemStart = new Date(startStr + "T00:00:00");
            const validAnchor = !isNaN(itemStart.getTime()) ? itemStart : pStart;

            if (cadence === "once") {
                if (validAnchor >= pStart && validAnchor <= pEnd) {
                    if ((!effectiveStart || validAnchor >= effectiveStart) && (!itemEnd || validAnchor <= itemEnd)) return 1;
                }
                return 0;
            }

            if (cadence === "custom_days") {
                if (!item.customDays) return 0;
                const datesList = typeof item.customDays === "string"
                    ? item.customDays.split(",").map(s => s.trim()).filter(Boolean)
                    : (Array.isArray(item.customDays) ? item.customDays : []);
                let count = 0;
                for (const dStr of datesList) {
                    const d = new Date(dStr + "T00:00:00");
                    if (!isNaN(d.getTime())) {
                        if (d >= pStart && d <= pEnd && (!effectiveStart || d >= effectiveStart) && (!itemEnd || d <= itemEnd)) {
                            count++;
                        }
                    }
                }
                return count;
            }

            let count = 0;

            if (cadence === "monthly") {
                const targetDay = validAnchor.getDate();
                let currYear = pStart.getFullYear();
                let currMonth = pStart.getMonth();

                while (true) {
                    const maxDays = new Date(currYear, currMonth + 1, 0).getDate();
                    const actualDay = Math.min(targetDay, maxDays);
                    const occDate = new Date(currYear, currMonth, actualDay, 12, 0, 0);

                    if (occDate > pEnd) break;

                    if (occDate >= pStart && occDate <= pEnd && (!effectiveStart || occDate >= effectiveStart) && (!itemEnd || occDate <= itemEnd)) {
                        count++;
                    }

                    currMonth++;
                    if (currMonth > 11) {
                        currMonth = 0;
                        currYear++;
                    }
                }
                return count;
            }

            if (cadence === "yearly" || cadence === "annual") {
                const targetMonth = validAnchor.getMonth();
                const targetDay = validAnchor.getDate();
                let currYear = pStart.getFullYear();

                while (true) {
                    const maxDays = new Date(currYear, targetMonth + 1, 0).getDate();
                    const actualDay = Math.min(targetDay, maxDays);
                    const occDate = new Date(currYear, targetMonth, actualDay, 12, 0, 0);

                    if (occDate > pEnd) break;

                    if (occDate >= pStart && occDate <= pEnd && (!effectiveStart || occDate >= effectiveStart) && (!itemEnd || occDate <= itemEnd)) {
                        count++;
                    }

                    currYear++;
                }
                return count;
            }

            if (cadence === "quarterly") {
                let curr = new Date(validAnchor.getTime());
                if (curr > pStart) {
                    while (curr > pStart) {
                        const prevQ = new Date(curr.getTime());
                        prevQ.setMonth(prevQ.getMonth() - 3);
                        if (prevQ >= pStart) {
                            curr = prevQ;
                        } else {
                            break;
                        }
                    }
                } else if (curr < pStart) {
                    while (curr < pStart) {
                        curr.setMonth(curr.getMonth() + 3);
                    }
                    curr.setMonth(curr.getMonth() - 3);
                }

                while (true) {
                    const occDate = new Date(curr.getFullYear(), curr.getMonth(), curr.getDate(), 12, 0, 0);
                    if (occDate > pEnd) break;

                    if (occDate >= pStart && occDate <= pEnd && (!effectiveStart || occDate >= effectiveStart) && (!itemEnd || occDate <= itemEnd)) {
                        count++;
                    }

                    curr.setMonth(curr.getMonth() + 3);
                }
                return count;
            }

            if (cadence === "weekly" || cadence === "biweekly" || cadence === "custom_interval") {
                let stepDays = 7;
                if (cadence === "biweekly") stepDays = 14;
                else if (cadence === "custom_interval") stepDays = Math.max(1, Number(item.customIntervalDays) || 14);

                let curr = new Date(validAnchor.getTime());
                if (curr < pStart) {
                    const diffMs = pStart.getTime() - curr.getTime();
                    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                    const stepsToSkip = Math.floor(diffDays / stepDays);
                    if (stepsToSkip > 0) {
                        curr.setDate(curr.getDate() + (stepsToSkip * stepDays));
                    }
                } else if (curr > pStart) {
                    const diffMs = curr.getTime() - pStart.getTime();
                    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                    const stepsBack = Math.ceil(diffDays / stepDays);
                    curr.setDate(curr.getDate() - (stepsBack * stepDays));
                }

                while (true) {
                    const occDate = new Date(curr.getFullYear(), curr.getMonth(), curr.getDate(), 12, 0, 0);
                    if (occDate > pEnd) break;

                    if (occDate >= pStart && occDate <= pEnd && (!effectiveStart || occDate >= effectiveStart) && (!itemEnd || occDate <= itemEnd)) {
                        count++;
                    }

                    curr.setDate(curr.getDate() + stepDays);
                }
                return count;
            }

            if (cadence === "weekly_days") {
                const dayMap = { "Sun": 0, "Mon": 1, "Tue": 2, "Wed": 3, "Thu": 4, "Fri": 5, "Sat": 6 };
                const targetDays = (item.weeklyDays || ["Mon"]).map(d => dayMap[d]).filter(d => d !== undefined);
                let curr = new Date(pStart.getTime());
                curr.setHours(12, 0, 0, 0);

                while (curr <= pEnd) {
                    if (targetDays.includes(curr.getDay())) {
                        if ((!effectiveStart || curr >= effectiveStart) && (!itemEnd || curr <= itemEnd)) {
                            count++;
                        }
                    }
                    curr.setDate(curr.getDate() + 1);
                }
                return count;
            }

            if (cadence === "monthly_days") {
                const days = (item.monthlyDays || "1").split(",").map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n) && n >= 1 && n <= 31);
                if (days.length === 0) return 0;
                days.sort((a, b) => a - b);
                let currYear = pStart.getFullYear();
                let currMonth = pStart.getMonth();

                while (true) {
                    const maxDaysInMonth = new Date(currYear, currMonth + 1, 0).getDate();
                    let monthDone = false;
                    for (const d of days) {
                        const actualDay = Math.min(d, maxDaysInMonth);
                        const occDate = new Date(currYear, currMonth, actualDay, 12, 0, 0);

                        if (occDate > pEnd) { monthDone = true; break; }

                        if (occDate >= pStart && occDate <= pEnd && (!effectiveStart || occDate >= effectiveStart) && (!itemEnd || occDate <= itemEnd)) {
                            count++;
                        }
                    }
                    if (monthDone) break;

                    currMonth++;
                    if (currMonth > 11) {
                        currMonth = 0;
                        currYear++;
                    }
                }
                return count;
            }

            // Default monthly fallback
            let curr = new Date(pStart.getTime());
            while (curr <= pEnd) {
                const occDate = new Date(curr.getFullYear(), curr.getMonth(), curr.getDate(), 12, 0, 0);
                if (occDate > pEnd) break;
                if ((!effectiveStart || occDate >= effectiveStart) && (!itemEnd || occDate <= itemEnd)) {
                    count++;
                }
                curr.setMonth(curr.getMonth() + 1);
            }
            return count;
        };
