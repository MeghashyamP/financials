            };

            // Delete document and its transactions
            const handleDeleteDocument = async (docId) => {
                try {
                    await deleteDocumentAndTransactionsFromDB(docId);
                    showToast("File and associated transactions deleted successfully");
                    await loadState();
                } catch (e) {
                    showToast("Failed to delete file and transactions", "error");
                }
            };

            // Quick category/tag updates inline in table cell
            const handlePatchTransaction = async (id, patch) => {
                const tx = transactions.find(t => t.id === id);
                if (!tx) return;

                const updated = { ...tx, ...patch };
                // Generate a new fingerprint since category/tag changes doesn't impact fingerprint,
                // but if we patch date/merchant/amount/account, it changes the fingerprint.
                updated.fingerprint = generateFingerprint(updated);

                try {
                    await updateTransactionInDB(updated);
                    setTransactions(prev => prev.map(t => t.id === id ? updated : t));
                    showToast("Transaction updated");
                } catch (e) {
                    showToast("Update failed", "error");
                }
            };

            // PDF Bank Statement / Receipt Import handler
            // Step 1: pdfMappingData → shows PdfColumnMappingDialog (how tokens map to fields)
            // Step 2: pdfImportData → shows PdfImportConfirmDialog (review all transactions)
            const [pdfMappingData, setPdfMappingData] = React.useState(null);
            const [pdfImportData, setPdfImportData] = React.useState(null);

            const handlePdfParsed = (parsedTransactions, filename, file, selectedAccount) => {
                // Go to mapping dialog first
                setPdfMappingData({ parsedTransactions, filename, file, selectedAccount });
                setShowImportModal(false); // close the upload modal
            };

            // Called when user confirms the column mapping — builds final transactions and opens review
            const confirmPdfMapping = (mappedTransactions, filename, file) => {
                try {
                    const availableCats = settings?.categories || DEFAULT_CATEGORIES;
                    const finalTxs = (mappedTransactions || []).map(t => {
                        const merch = String(t?.merchant || t?.narration || "Bank Transaction");
                        const rawItem = {
                            ...t,
                            narration: merch,
                            merchant: merch,
                            type: t?.type === "income" ? "income" : "expense",
                            category: t?.category || ""
                        };
                        return processImportedTransaction(rawItem, rules, availableCats);
                    });
                    setPdfImportData({
                        transactions: finalTxs,
                        filename,
                        file
                    });
                    setPdfMappingData(null);
                } catch (err) {
                    console.error("Error in confirmPdfMapping:", err);
                    showToast("Error preparing transaction review: " + err.message, "error");
                }
            };


            // Advance a cadence-based date forward by one cycle from a given anchor date
            const advanceDateByCadence = (dateStr, cadence) => {
                const d = new Date(dateStr || new Date());
                if (isNaN(d.getTime())) return dateStr;
                switch (cadence) {
                    case "weekly": d.setDate(d.getDate() + 7); break;
                    case "biweekly": d.setDate(d.getDate() + 14); break;
                    case "quarterly": d.setMonth(d.getMonth() + 3); break;
                    case "annual": d.setFullYear(d.getFullYear() + 1); break;
                    case "monthly":
                    default: d.setMonth(d.getMonth() + 1); break;
                }
                return d.toISOString().split('T')[0];
            };

            // Advance a Net Worth ledger item's Next Due Date based on its frequency-per-year
            const advanceNetWorthDate = (dateStr, frequencyPerYear) => {
                const d = new Date(dateStr || new Date());
                if (isNaN(d.getTime())) return dateStr;
                const monthsToAdd = frequencyPerYear >= 12 ? 1 : frequencyPerYear === 4 ? 3 : frequencyPerYear === 2 ? 6 : 12;
                d.setMonth(d.getMonth() + monthsToAdd);
                return d.toISOString().split('T')[0];
            };

            // Apply "Link to Ledger" selections made in the PDF review table: advances the linked
            // Recurring / Net Worth item's next due date so the ledger stays live.
            const applyLedgerLinks = async (selectedTransactions) => {
                const linked = selectedTransactions.filter(t => t.linkTo);
                if (linked.length === 0) return;

                let recurringList = settings.recurring || [];
                let networthList = settings.networthItems || [];
                let recurringChanged = false, networthChanged = false;

                linked.forEach(t => {
                    const [kind, id] = t.linkTo.split(":");
                    if (kind === "recurring") {
                        recurringList = recurringList.map(r => r.id === id ? { ...r, nextDate: advanceDateByCadence(t.date, r.cadence) } : r);
                        recurringChanged = true;
                    } else if (kind === "networth") {
                        networthList = networthList.map(it => {
                            if (it.id !== id) return it;
                            const updated = { ...it, nextDueDate: advanceNetWorthDate(t.date, it.frequencyPerYear) };
                            // For investments/SIPs, roll the payment into the tracked "invested" figure too
                            if (it.category === "Investments") {
                                updated.invested = Number(it.invested || 0) + Number(t.amount || 0);
                            }
                            return updated;
                        });
                        networthChanged = true;
                    }
                });

                if (recurringChanged) await updateSetting("recurring", recurringList);
                if (networthChanged) await updateSetting("networthItems", networthList);
            };

            const triggerPdfImport = async (selectedTransactions) => {
                if (selectedTransactions.length === 0) {
                    showToast("No transactions selected for import", "warning");
                    setPdfImportData(null);
                    return;
                }

                const docId = crypto.randomUUID();

                // Add source & account default mapping if needed
                const itemsToInsert = selectedTransactions.map(t => ({
                    ...t,
                    source: "pdf-import",
                    documentId: docId
                }));

                const res = await handleAddTransactions(itemsToInsert);
                await applyLedgerLinks(selectedTransactions);
                const linkedCount = selectedTransactions.filter(t => t.linkTo).length;
                showToast(`Import summary: ${res.inserted} transactions added, ${res.duplicates} duplicates skipped.${linkedCount ? ` ${linkedCount} linked to your ledger.` : ""}`);

                // Save PDF document in Vault
                await saveDocumentInDB({
                    id: docId,
                    filename: pdfImportData.filename,
                    mimeType: "application/pdf",
                    size: pdfImportData.file.size,
                    status: "stored",
                    source: "upload",
                    createdAt: new Date().toISOString(),
                    fileData: pdfImportData.file
                });

                setPdfImportData(null);
                setShowImportModal(false);
                loadState();
            };

            // CSV Bank Statement Column Mapping UI Modal handler
            const [csvMappingData, setCsvMappingData] = React.useState(null);

            const handleCsvParsed = (rows, filename) => {
                if (rows.length < 2) {
                    showToast("CSV file is too short or empty", "error");
                    return;
                }
                const headers = rows[0].map((h, idx) => ({ index: idx, name: h || `Column ${idx + 1}` }));
                setCsvMappingData({
                    rows: rows.slice(1),
                    headers,
                    filename,
                    mappings: {
                        date: 0,
                        merchant: 1,
                        amount: 2,
                        type: -1, // -1 means use expense/income toggle or separate debit/credit column
                        debit: -1,
                        credit: -1
                    }
                });
            };

            const triggerCsvImport = async (mappings) => {
                const { rows, filename } = csvMappingData;
                const itemsToInsert = [];
                const docId = crypto.randomUUID();

                rows.forEach(row => {
                    const dateVal = row[mappings.date] || "";
                    const merchantVal = row[mappings.merchant] || "";
                    let amountVal = 0;
                    let typeVal = "expense";

                    if (mappings.debit !== -1 && mappings.credit !== -1) {
                        const deb = Math.abs(parseFloat(String(row[mappings.debit] || "0").replace(/[^\d.-]/g, '')));
                        const cred = Math.abs(parseFloat(String(row[mappings.credit] || "0").replace(/[^\d.-]/g, '')));
                        if (cred > 0) {
                            amountVal = cred;
                            typeVal = "income";
                        } else {
                            amountVal = deb;
                            typeVal = "expense";
                        }
                    } else {
                        const amtStr = String(row[mappings.amount] || "0").replace(/[^\d.-]/g, '');
                        const parsedAmt = parseFloat(amtStr);
                        amountVal = Math.abs(parsedAmt);
                        if (mappings.type !== -1) {
                            const tStr = String(row[mappings.type]).toLowerCase();
                            typeVal = (tStr.includes("in") || tStr.includes("cred") || parsedAmt > 0) ? "income" : "expense";
                        } else {
                            typeVal = parsedAmt >= 0 ? "income" : "expense";
                        }
                    }

                    // Format date (YYYY-MM-DD)
                    let formattedDate = "";
                    try {
                        const dateObj = new Date(dateVal);
                        if (!isNaN(dateObj.getTime())) {
                            formattedDate = dateObj.toISOString().split('T')[0];
                        }
                    } catch (e) { }

                    if (formattedDate && merchantVal && amountVal > 0) {
                        itemsToInsert.push({
                            date: formattedDate,
                            merchant: merchantVal,
                            amount: amountVal,
                            type: typeVal,
                            account: "CSV Import",
                            source: "csv",
                            documentId: docId
                        });
                    }
                });

                if (itemsToInsert.length === 0) {
                    showToast("No valid transactions parsed from CSV", "warning");
                    setCsvMappingData(null);
                    return;
                }

                const res = await handleAddTransactions(itemsToInsert);
                showToast(`Import summary: ${res.inserted} transactions added, ${res.duplicates} duplicates skipped.`);

                // Add CSV document metadata in vault list (Section 8.2)
                await saveDocumentInDB({
                    id: docId,
                    filename,
                    mimeType: "text/csv",
                    size: csvMappingData.rows.length * 100, // mock size
                    status: "stored",
                    source: "manual-csv",
                    createdAt: new Date().toISOString()
                });

                setCsvMappingData(null);
                setShowImportModal(false);
                loadState();
            };

            // Modern client-side Directory Picker Watcher sync (Section 17/18 replacement)
            const handleSyncLocalFolder = async () => {
                try {
                    if (!window.showDirectoryPicker) {
                        showToast("Your browser does not support Directory Picker API. Please drag-and-drop files in Documents page.", "warning");
                        return;
                    }

                    const dirHandle = await window.showDirectoryPicker();
                    showToast(`Access granted to directory: ${dirHandle.name}`);

                    let newTxCount = 0;
                    let fileCount = 0;
                    let duplicateCount = 0;

                    const processedIds = [...(settings.processedFileIds || [])];
                    const resetAt = settings.driveResetAt ? new Date(settings.driveResetAt) : null;
                    const updatedProcessedIds = [...processedIds];

                    // Loop directory files
                    for await (const entry of dirHandle.values()) {
                        if (entry.kind === 'file') {
                            const file = await entry.getFile();
                            const fileId = `${file.name}-${file.size}-${file.lastModified}`;

                            // Skip files already processed or modified at/before driveResetAt
                            if (processedIds.includes(fileId)) continue;
                            if (resetAt && new Date(file.lastModified) <= resetAt) continue;

                            const docId = crypto.randomUUID();

                            fileCount++;
                            updatedProcessedIds.push(fileId);

                            // Handle PDF sync parsing (Default)
                            if (file.name.endsWith(".pdf")) {
                                try {
                                    const text = await extractTextFromPDF(file);
                                    const parsedItems = parseTransactionsFromPDFText(text, file.name);
                                    const syncItems = parsedItems.map(item => ({
                                        ...item,
                                        account: "Folder Import",
                                        source: "google-drive", // flag source as drive imports
                                        documentId: docId
                                    }));

                                    if (syncItems.length > 0) {
                                        const res = await handleAddTransactions(syncItems);
                                        newTxCount += res.inserted;
                                        duplicateCount += res.duplicates;
                                    }
                                } catch (err) {
                                    console.error("Error parsing PDF during sync:", err);
                                    showToast(`Failed to parse PDF "${file.name}": ${err.message}`, "error");
                                }
                            }
                            // Handle CSV sync parsing
                            else if (file.name.endsWith(".csv")) {
                                const text = await file.text();
                                const rows = parseCSVText(text);
                                if (rows.length >= 2) {
                                    // Parse with basic heuristic columns
                                    const headers = rows[0].map(h => String(h).toLowerCase());
                                    const dateIdx = headers.findIndex(h => h.includes("date"));
                                    const descIdx = headers.findIndex(h => h.includes("desc") || h.includes("merchant") || h.includes("payee") || h.includes("name"));
                                    const amtIdx = headers.findIndex(h => h.includes("amount") || h.includes("debit") || h.includes("credit"));

                                    if (dateIdx !== -1 && descIdx !== -1 && amtIdx !== -1) {
                                        const syncItems = [];
                                        for (let i = 1; i < rows.length; i++) {
                                            const r = rows[i];
                                            const dateVal = r[dateIdx];
                                            const descVal = r[descIdx];
                                            const amtVal = parseFloat(String(r[amtIdx] || "0").replace(/[^\d.-]/g, ''));

                                            if (dateVal && descVal && !isNaN(amtVal)) {
                                                syncItems.push({
                                                    date: new Date(dateVal).toISOString().split('T')[0],
                                                    merchant: descVal,
                                                    amount: Math.abs(amtVal),
                                                    type: amtVal >= 0 ? "income" : "expense",
                                                    account: "Folder Import",
                                                    source: "google-drive", // flag source as drive imports
                                                    documentId: docId
                                                });
                                            }
                                        }

                                        if (syncItems.length > 0) {
                                            const res = await handleAddTransactions(syncItems);
                                            newTxCount += res.inserted;
                                            duplicateCount += res.duplicates;
                                        }
                                    }
                                }
                            }

                            // Store Document vault metadata & binary contents (Section 17.2/4.2)
                            await saveDocumentInDB({
                                id: docId,
                                filename: file.name,
                                mimeType: file.type || "application/octet-stream",
                                size: file.size,
                                status: "stored",
                                source: "google-drive",
                                createdAt: new Date(file.lastModified).toISOString(),
                                fileData: file // Save original file bytes as Blob object
                            });
                        }
                    }

                    // Save settings changes
                    await updateSetting("processedFileIds", updatedProcessedIds);
                    await updateSetting("driveSyncMetadata", {
                        lastSync: new Date().toISOString(),
                        folderName: dirHandle.name,
                        filesScanned: fileCount,
                        transactionsAdded: newTxCount,
                        duplicatesSkipped: duplicateCount
                    });

                    showToast(`Sync Complete! Added ${newTxCount} transactions, stored ${fileCount} files.`);
                    loadState();
                } catch (e) {
                    if (e.name !== "AbortError") {
                        showToast("Folder sync cancelled or failed", "error");
                    }
                }
            };

            if (loading) {
                return (
                    <div style={{ display: 'flex', height: '100vh', alignItems: 'center', justifyContent: 'center', backgroundColor: '#F9FAFB' }}>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ border: '4px solid #f3f3f3', borderTop: '4px solid #6558D3', borderRadius: '50%', width: '40px', height: '40px', animation: 'spin 1s linear infinite', margin: '0 auto 16px auto' }}></div>
                            <p style={{ color: '#6B7280', fontWeight: 500 }}>Decrypting Local Financials Vault...</p>
                            <style>{`@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`}</style>
                        </div>
                    </div>
                );
            }

            // Shared computed values based on period selection
            const filteredTx = filterTransactionsByPeriod(transactions, activePeriod, calcCustomStart, calcCustomEnd);

            // Suggested recurring lists derived from algorithm
            const suggestedRecurring = detectRecurringTransactions(transactions, rules, settings.dismissedPatterns || []);

            return (
                <div className="app-container">

                    {/* Floating Toast Notification Containers */}
                    <div className="toast-container">
                        {toasts.map(t => (
                            <div key={t.id} className={`toast ${t.type}`}>
                                <Icon name={t.type === "error" ? "alert" : "check"} />
                                <span>{t.message}</span>
                            </div>
                        ))}
                    </div>

                    {/* Left Sidebar - Desktop Navigation */}
                    <aside className={`sidebar ${isSidebarCollapsed ? "collapsed" : ""}`}>
                        <div className="sidebar-brand" title="Financials">
                            <Icon name="transactions" currency={settings.currency} />
                            <span className="sidebar-label">Financials</span>
                        </div>
                        <ul className="sidebar-nav">
                            {[
                                { id: "dashboard", label: "Dashboard", icon: "home" },
                                { id: "transactions", label: "Transactions", icon: "transactions" },
                                { id: "networth", label: "Net Worth", icon: "networth" },
                                { id: "recurring", label: "Recurring", icon: "recurring" },
                                { id: "budgets", label: "Budgets", icon: "budgets" },
                                { id: "goals", label: "Goals", icon: "goals" },
                                { id: "documents", label: "Documents", icon: "documents" },
                                { id: "rules", label: "Rules", icon: "rules" },
                                { id: "settings", label: "Settings", icon: "settings" }
                            ].map(item => (
                                <li
                                    key={item.id}
                                    title={item.label}
                                    className={`sidebar-nav-item ${activePage === item.id ? "active" : ""}`}
                                    onClick={() => handleNavigatePage(item.id)}
                                >
                                    <Icon name={item.icon} currency={settings.currency} />
                                    <span className="sidebar-label">{item.label}</span>
                                </li>
                            ))}
                        </ul>
                        <button
                            className="sidebar-toggle-btn"
                            onClick={toggleSidebar}
                            title={isSidebarCollapsed ? "Expand sidebar" : "Collapse sidebar"}
                        >
                            <Icon name={isSidebarCollapsed ? "chevronRight" : "chevronLeft"} />
                        </button>
                    </aside>

                    {/* Mobile Navigation Header */}
                    <div className="mobile-topbar">
                        <div className="sidebar-brand" style={{ margin: 0, padding: 0 }}>
                            <Icon name="transactions" currency={settings.currency} />
                            <span style={{ fontSize: '1.15rem' }}>Financials</span>
                        </div>
                        <div style={{ display: 'flex', gap: '8px' }}>
                            {activePage === "documents" && (
                                <button className="btn btn-secondary btn-sm" onClick={handleSyncLocalFolder} title="Sync Folder">
                                    <Icon name="sync" />
                                </button>
                            )}
                            {(activePage === "transactions" || activePage === "documents") && (
                                <button className="btn btn-secondary btn-sm" onClick={() => setShowImportModal(true)} title="Import PDF/CSV">
                                    <Icon name="download" />
                                </button>
                            )}
                            {activePage === "transactions" && (
                                <button className="btn btn-primary btn-sm" onClick={() => setShowAddEntryModal(true)} title="Add Transaction">
                                    <Icon name="plus" />
                                </button>
                            )}
                            {["networth", "recurring", "budgets", "goals", "rules"].includes(activePage) && (
                                <button className="btn btn-primary btn-sm" onClick={() => setSubpageActionSignal(s => s + 1)} title="Add">
                                    <Icon name="plus" />
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Mobile Bottom Navigation bar (touch target 44px friendly) */}
                    <nav className="mobile-bottom-nav">
                        <div className="mobile-nav-scroll">
                            {[
                                { id: "dashboard", label: "Dashboard", icon: "home" },
                                { id: "transactions", label: "Txns", icon: "transactions" },
                                { id: "networth", label: "Net Worth", icon: "networth" },
                                { id: "recurring", label: "Recurring", icon: "recurring" },
                                { id: "budgets", label: "Budgets", icon: "budgets" },
                                { id: "goals", label: "Goals", icon: "goals" },
                                { id: "documents", label: "Docs", icon: "documents" },
                                { id: "rules", label: "Rules", icon: "rules" },
                                { id: "settings", label: "Settings", icon: "settings" }
                            ].map(item => (
                                <div
                                    key={item.id}
                                    className={`mobile-nav-item ${activePage === item.id ? "active" : ""}`}
                                    onClick={() => handleNavigatePage(item.id)}
                                >
                                    <Icon name={item.icon} currency={settings.currency} />
                                    <span>{item.label}</span>
                                </div>
                            ))}
                        </div>
                    </nav>

                    {/* Main Content Layout View */}
                    <div className={`main-wrapper ${isSidebarCollapsed ? "sidebar-collapsed" : ""}`}>

                        {/* Header top sticky bar - Desktop */}
                        <header className="topbar" style={["transactions", "dashboard", "recurring", "networth"].includes(activePage) ? { height: 'auto', minHeight: '115px', boxSizing: 'border-box', padding: '12px 32px' } : {}}>
                            {activePage === "dashboard" && (
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', width: '100%' }}>
                                    {/* Line 1: All the tiles */}
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '12px', width: '100%', alignItems: 'center' }}>
                                        {(() => {
                                            const expenseTx = filteredTx.filter(t => t.type === "expense");
                                            const incomeTx = filteredTx.filter(t => t.type === "income");

                                            const networthItems = settings.networthItems || [];
                                            const hasLedger = networthItems.length > 0;
                                            const ledgerAssets = networthItems
                                                .filter(it => ["asset", "balance"].includes((NET_WORTH_GROUPS.find(g => g.key === it.category) || {}).kind))
                                                .reduce((s, it) => s + Number(it.value || 0), 0);
                                            const ledgerInvestments = networthItems
                                                .filter(it => it.category === "Investments")
                                                .reduce((s, it) => s + Number(it.value || 0), 0);
                                            const ledgerLiabilities = networthItems
                                                .filter(it => (NET_WORTH_GROUPS.find(g => g.key === it.category) || {}).kind === "liability")
                                                .reduce((s, it) => s + Math.abs(Number(it.value || 0)), 0);

                                            const assets = hasLedger ? (ledgerAssets + ledgerInvestments) : (settings.assetsTotal || 0);
                                            const liabilities = hasLedger ? ledgerLiabilities : (settings.liabilitiesTotal || 0);
                                            const netWorthVal = assets - liabilities;
                                            const netWorthReady = hasLedger || settings.netWorthConfigured;

                                            const incomeSum = incomeTx.reduce((s, t) => s + t.amount, 0);
                                            const spendingSum = expenseTx.reduce((s, t) => s + t.amount, 0);
                                            const savingsRate = incomeSum > 0 ? (((incomeSum - spendingSum) / incomeSum) * 100) : 0;

                                            const fmt = (v) => formatCurrencyVal(v, settings.currency || "INR");

                                            const tiles = [
                                                { id: 'networth', title: 'Net Worth', displayVal: netWorthReady ? fmt(netWorthVal) : 'Not set', icon: 'networth', color: 'var(--text-main)', iconClass: 'primary', onClick: () => handleNavigatePage('networth'), cursor: 'pointer' },
                                                { id: 'income', title: 'Income', displayVal: fmt(incomeSum), icon: 'arrowDown', color: 'var(--success)', iconClass: 'success' },
                                                { id: 'expenses', title: 'Expenses', displayVal: fmt(spendingSum), icon: 'arrowUp', color: 'var(--warning)', iconClass: 'warning' },
                                                { id: 'savings', title: 'Savings Rate', displayVal: `${savingsRate.toFixed(1)}%`, icon: 'goals', color: savingsRate >= 0 ? 'var(--info)' : 'var(--danger)', iconClass: 'info' }
                                            ];

                                            return tiles.map((t, idx) => (
                                                <div
                                                    key={t.id || idx}
                                                    className="card"
                                                    style={{
                                                        padding: '8px 14px',
                                                        border: '1px solid var(--border-color)',
                                                        background: 'var(--card-bg)',
                                                        boxShadow: 'var(--shadow-sm)',
                                                        margin: 0,
                                                        cursor: t.onClick ? 'pointer' : 'default'
                                                    }}
                                                    onClick={t.onClick}
                                                    title={t.onClick ? "Click to view Net Worth ledger" : undefined}
                                                >
                                                    <div className="card-header" style={{ marginBottom: '2px' }}>
                                                        <span className="card-title" style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-muted)' }}>{t.title}</span>
                                                        <div className={`card-icon ${t.iconClass}`} style={{ width: '22px', height: '22px', padding: '2px', borderRadius: '6px' }}>
                                                            <Icon name={t.icon} currency={settings.currency} />
                                                        </div>
                                                    </div>
                                                    <div className="card-value" style={{ fontSize: '1.05rem', fontWeight: 700, color: t.color, lineHeight: 1.2 }}>
                                                        {t.displayVal}
                                                    </div>
                                                </div>
                                            ));
                                        })()}
                                    </div>

                                    {/* Line 2: Period (center aligned) */}
                                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%' }}>
                                        {/* Unified Date Selector controls */}
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px', flexWrap: 'nowrap', background: 'var(--card-bg)', padding: '3px 8px', height: '36px', borderRadius: '8px', border: '1px solid var(--border-color)', boxShadow: '0 1px 3px rgba(0,0,0,0.04)', boxSizing: 'border-box' }}>
                                            {/* Left: Start Date Picker */}
                                            <div
                                                style={{ position: 'relative', display: 'inline-flex', alignItems: 'center', cursor: 'pointer' }}
                                                onClick={(e) => {

            const expenseTx = transactions.filter(t => t.type === "expense");
            const incomeTx = transactions.filter(t => t.type === "income");

            const needsReviewCount = transactions.filter(t => t.category === "Needs review").length;

            const now = new Date();

            const categoryTotals = {};

            const topCategoryKey = Object.keys(categoryTotals).sort((a, b) => categoryTotals[b] - categoryTotals[a])[0];
            const topCategoryAmount = topCategoryKey ? categoryTotals[topCategoryKey] : 0;
            const topCategoryPct = spendingSum > 0 ? Math.round((topCategoryAmount / spendingSum) * 100) : 0;

            // Largest single transaction
            const largestTx = [...expenseTx].sort((a, b) => b.amount - a.amount)[0];

            // Savings rate status grade
            let savingsGrade = { label: "No Income", color: "var(--text-muted)", bg: "var(--bg-color)" };

                                <span style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                                    Savings Grade
                                </span>
                                <span className="dashboard-badge-pill" style={{ background: savingsGrade.bg, color: savingsGrade.color }}>
                                    {savingsGrade.label}
                                </span>
                            </div>
                            <div style={{ fontSize: '1.5rem', fontWeight: 700, color: 'var(--text-main)', marginBottom: '4px' }}>
                                {savingsRate.toFixed(1)}%

                                {netCashFlow >= 0 ? `+${formatCurrency(netCashFlow)} retained` : `${formatCurrency(Math.abs(netCashFlow))} overspent`}

                                {formatCurrency(dailySpend)}<span style={{ fontSize: '0.85rem', fontWeight: 500, color: 'var(--text-muted)' }}>/day</span>

                        {/* Metric 3: Top Expense Concentration */}
                        <div className="insight-metric-card">
                            <div style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '8px' }}>
                                Top Category
                            </div>
                            <div style={{ fontSize: '1.2rem', fontWeight: 700, color: 'var(--text-main)', marginBottom: '4px', textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap' }}>
                                {topCategoryKey || "None"}
                            </div>
                            <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                                {topCategoryKey ? `${formatCurrency(topCategoryAmount)} (${topCategoryPct}% of total)` : 'No expense data'}
                            </div>
                        </div>

                        {/* Metric 4: Peak Single Transaction */}
                        <div className="insight-metric-card">
                            <div style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '8px' }}>
                                Peak Transaction
                            </div>
                            <div style={{ fontSize: '1.2rem', fontWeight: 700, color: 'var(--danger)', marginBottom: '4px', textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap' }}>
                                {largestTx ? formatCurrency(largestTx.amount) : "₹0"}
                            </div>
                            <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap' }}>
                                {largestTx ? `${largestTx.merchant}` : "No expenses"}
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        // --- SUB-COMPONENT: Calendar widget for the Dashboard ---
        const PaymentsCalendarWidget = ({ settings, transactions, selectedDay, setSelectedDay, viewDate, setViewDate }) => {
            const toYYYYMMDD = (dStr) => {
                if (!dStr) return "";
                const d = new Date(dStr);
                if (isNaN(d.getTime())) return "";
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            };

            const getAnchorDayOfMonth = (dStr) => {
                if (!dStr) return 1;
                if (typeof dStr === 'string' && dStr.includes('-')) {
                    const parts = dStr.split('-');
                    if (parts.length === 3) {
                        const dayNum = parseInt(parts[2].substring(0, 2), 10);
                        if (!isNaN(dayNum) && dayNum >= 1 && dayNum <= 31) return dayNum;
                    }
                }
                const d = new Date(dStr);
                if (!isNaN(d.getTime())) return d.getDate();
                return 1;
            };

            const getDueDateInMonth = (anchorDay, viewYear, viewMonth) => {
                const maxDays = new Date(viewYear, viewMonth + 1, 0).getDate();
                const day = Math.min(Math.max(anchorDay, 1), maxDays);
                const m = String(viewMonth + 1).padStart(2, '0');
                const d = String(day).padStart(2, '0');
                return `${viewYear}-${m}-${d}`;
            };

            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();

            const dueItems = React.useMemo(() => {
                const items = [];
                const calNow = new Date();
                const calTodayStr = `${calNow.getFullYear()}-${String(calNow.getMonth() + 1).padStart(2, '0')}-${String(calNow.getDate()).padStart(2, '0')}`;
                const viewMonthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;

                (settings.recurring || []).forEach(r => {
                    if (r.active === false || (r.endDate && r.endDate < calTodayStr)) return;
                    const anchorDay = getAnchorDayOfMonth(r.nextDate || r.startDate);
                    const itemDueDateStr = getDueDateInMonth(anchorDay, year, month);

                    // Check if already paid in this view month
                    const isPaid = (transactions || []).some(t => {
                        const tDate = toYYYYMMDD(t.date);
                        return tDate && tDate.startsWith(viewMonthPrefix) && (t.linkedRecurringId === r.id || t.merchant === r.name);
                    });

                    if (!isPaid) {
                        items.push({ date: itemDueDateStr });
                    }
                });

                (settings.networthItems || []).forEach(it => {
                    if (!it.nextDueDate) return;
                    const anchorDay = getAnchorDayOfMonth(it.nextDueDate);
                    const itemDueDateStr = getDueDateInMonth(anchorDay, year, month);

                    const isPaid = (transactions || []).some(t => {
                        const tDate = toYYYYMMDD(t.date);
                        return tDate && tDate.startsWith(viewMonthPrefix) && (t.linkedRecurringId === it.id || t.merchant === it.name);
                    });

                    if (!isPaid) {
                        items.push({ date: itemDueDateStr });
                    }
                });
                return items.filter(i => !isNaN(new Date(i.date).getTime()));
            }, [settings.recurring, settings.networthItems, transactions, year, month]);

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Month grid calculation (starting from Monday)
            const firstDay = new Date(year, month, 1);
            // Sunday = 0 -> offset 6, Monday = 1 -> offset 0, Tue = 2 -> offset 1, etc.
            const startOffset = (firstDay.getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const cells = [];
            for (let i = 0; i < startOffset; i++) cells.push(null);
            for (let d = 1; d <= daysInMonth; d++) cells.push(d);

            const dueDaysInMonthMap = {};
            dueItems.forEach(i => {
                const d = new Date(i.date);
                if (d.getFullYear() === year && d.getMonth() === month) {
                    const dayNum = d.getDate();
                    dueDaysInMonthMap[dayNum] = (dueDaysInMonthMap[dayNum] || 0) + 1;
                }
            });

            return (
                <div className="section-card" style={{ background: 'var(--card-bg)', borderRadius: '16px', border: '1px solid var(--border-color)', boxShadow: 'var(--shadow-sm)' }}>
                    {/* Mini Month Calendar Header & Grid */}
                    <div style={{ background: 'var(--bg-color)', padding: '12px', borderRadius: '12px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                                <button className="btn btn-secondary btn-sm" style={{ padding: '3px 8px' }}
                                    onClick={() => {
                                        setViewDate(new Date(year, month - 1, 1));
                                        setSelectedDay(null);
                                    }}>
                                    <Icon name="chevronLeft" />
                                </button>
                                <span style={{ fontWeight: 700, fontSize: '0.9rem' }}>
                                    {viewDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}
                                </span>
                                <button className="btn btn-secondary btn-sm" style={{ padding: '3px 8px' }}
                                    onClick={() => {
                                        setViewDate(new Date(year, month + 1, 1));
                                        setSelectedDay(null);
                                    }}>
                                    <Icon name="chevronRight" />
                                </button>
                            </div>
                            <button className="btn btn-secondary btn-sm" style={{ fontSize: '0.72rem', padding: '2px 8px' }}
                                onClick={() => { setViewDate(new Date()); setSelectedDay(new Date()); }}>
                                Today
                            </button>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '4px', textAlign: 'center', fontSize: '0.72rem' }}>
                            {["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d, idx) => (
                                <div key={idx} style={{ color: 'var(--text-muted)', fontWeight: 600, padding: '4px 0' }}>{d}</div>
                            ))}
                            {cells.map((d, idx) => {
                                if (!d) return <div key={idx}></div>;
                                const cellDate = new Date(year, month, d);
                                const isToday = cellDate.toDateString() === today.toDateString();
                                const dueCount = dueDaysInMonthMap[d] || 0;
                                const isSelected = selectedDay && cellDate.toDateString() === selectedDay.toDateString();
                                return (
                                    <div
                                        key={idx}
                                        onClick={() => {
                                            if (isSelected) {
                                                setSelectedDay(null);
                                            } else {
                                                setSelectedDay(cellDate);
                                            }
                                        }}
                                        style={{
                                            position: 'relative', padding: '8px 0', borderRadius: '8px', cursor: 'pointer',
                                            fontWeight: isToday || isSelected ? 700 : 500,
                                            background: isSelected ? 'var(--primary)' : (isToday ? 'var(--primary-light)' : '#fff'),
                                            color: isSelected ? '#fff' : (isToday ? 'var(--primary)' : 'var(--text-main)'),
                                            border: isToday && !isSelected ? '1px solid var(--primary)' : '1px solid transparent',
                                            transition: 'var(--transition)'
                                        }}
                                    >
                                        {d}
                                        {dueCount > 0 && (
                                            <span style={{
                                                position: 'absolute', top: '2px', right: '4px',
                                                fontSize: '0.62rem', fontWeight: 700,
                                                background: isSelected ? '#fff' : 'var(--danger)',
                                                color: isSelected ? 'var(--primary)' : '#fff',
                                                borderRadius: '50%', width: '14px', height: '14px',
                                                display: 'flex', alignItems: 'center', justifyContent: 'center'
                                            }}>
                                                {dueCount}
                                            </span>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                </div>
            );
        };

        // --- SUB-COMPONENT: Payments section with Upcoming, Overdue, and Paid filters ---
        const PaymentsSectionWidget = ({ settings, transactions, updateSetting, loadState, showToast, selectedDay, setSelectedDay, viewDate }) => {
            const [filter, setFilter] = React.useState("upcoming");
            const [markPaidModalItem, setMarkPaidModalItem] = React.useState(null);
            const [selectedTxIdToLink, setSelectedTxIdToLink] = React.useState(null);

            const formatCurrency = (val) => formatCurrencyVal(val, settings.currency || "INR");

            const toYYYYMMDD = (dStr) => {
                if (!dStr) return "";
                const d = new Date(dStr);
                if (isNaN(d.getTime())) return "";
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            };

            const getAnchorDayOfMonth = (dStr) => {
                if (!dStr) return 1;
                if (typeof dStr === 'string' && dStr.includes('-')) {
                    const parts = dStr.split('-');
                    if (parts.length === 3) {
                        const dayNum = parseInt(parts[2].substring(0, 2), 10);
                        if (!isNaN(dayNum) && dayNum >= 1 && dayNum <= 31) return dayNum;
                    }
                }
                const d = new Date(dStr);
                if (!isNaN(d.getTime())) return d.getDate();
                return 1;
            };

            const getDueDateInMonth = (anchorDay, viewYear, viewMonth) => {
                const maxDays = new Date(viewYear, viewMonth + 1, 0).getDate();
                const day = Math.min(Math.max(anchorDay, 1), maxDays);
                const m = String(viewMonth + 1).padStart(2, '0');
                const d = String(day).padStart(2, '0');
                return `${viewYear}-${m}-${d}`;
            };

            const calNow = new Date();
            const todayStr = `${calNow.getFullYear()}-${String(calNow.getMonth() + 1).padStart(2, '0')}-${String(calNow.getDate()).padStart(2, '0')}`;
            const todayObj = new Date(calNow.getFullYear(), calNow.getMonth(), calNow.getDate());

            const viewYear = viewDate ? viewDate.getFullYear() : calNow.getFullYear();
            const viewMonth = viewDate ? viewDate.getMonth() : calNow.getMonth();
            const viewMonthPrefix = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}`;

            const { upcomingItems, overdueItems } = React.useMemo(() => {
                const upcoming = [];
                const overdue = [];

                (settings.recurring || []).forEach(r => {
                    if (r.active === false || (r.endDate && r.endDate < calNow.toISOString().split('T')[0])) return;
                    const anchorDay = getAnchorDayOfMonth(r.nextDate || r.startDate);
                    const itemDueDateStr = getDueDateInMonth(anchorDay, viewYear, viewMonth);
                    const itemDateObj = new Date(itemDueDateStr + "T00:00:00");

                    // Check if already paid in this view month
                    const isPaid = (transactions || []).some(t => {
                        const tDate = toYYYYMMDD(t.date);
                        return tDate && tDate.startsWith(viewMonthPrefix) && (t.linkedRecurringId === r.id || t.merchant === r.name);
                    });

                    if (isPaid) return;

                    const itemObj = {
                        id: r.id,
                        kind: "recurring",
                        date: itemDueDateStr,
                        dateObj: itemDateObj,
                        name: r.name,
                        amount: r.amount,
                        type: r.type || "expense",
                        category: r.category || "Recurring bill",
                        cadence: r.cadence || "monthly",
                        swatch: "warning"
                    };

                    if (itemDueDateStr < todayStr) {
                        const diffTime = Math.abs(todayObj - itemDateObj);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        itemObj.daysOverdue = diffDays;
                        overdue.push(itemObj);
                    } else {
                        upcoming.push(itemObj);
                    }
                });

                (settings.networthItems || []).forEach(it => {
                    if (!it.nextDueDate) return;
                    const anchorDay = getAnchorDayOfMonth(it.nextDueDate);
                    const itemDueDateStr = getDueDateInMonth(anchorDay, viewYear, viewMonth);
                    const itemDateObj = new Date(itemDueDateStr + "T00:00:00");

                    const isPaid = (transactions || []).some(t => {
                        const tDate = toYYYYMMDD(t.date);
                        return tDate && tDate.startsWith(viewMonthPrefix) && (t.linkedRecurringId === it.id || t.merchant === it.name);
                    });

                    if (isPaid) return;

                    const itemObj = {
                        id: it.id,
                        kind: "networth",
                        date: itemDueDateStr,
                        dateObj: itemDateObj,
                        name: it.name,
                        amount: Math.abs(Number(it.incomeExpense || 0)),
                        type: Number(it.incomeExpense || 0) < 0 ? "expense" : "income",
                        category: it.category || "Loans & Liabilities",
                        frequencyPerYear: it.frequencyPerYear || 12,
                        swatch: (NET_WORTH_GROUPS.find(g => g.key === it.category) || {}).swatch || "primary"
                    };

                    if (itemDueDateStr < todayStr) {
                        const diffTime = Math.abs(todayObj - itemDateObj);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        itemObj.daysOverdue = diffDays;
                        overdue.push(itemObj);
                    } else {
                        upcoming.push(itemObj);
                    }
                });

                upcoming.sort((a, b) => a.dateObj - b.dateObj);
                overdue.sort((a, b) => a.dateObj - b.dateObj);

                return { upcomingItems: upcoming, overdueItems: overdue };
            }, [settings.recurring, settings.networthItems, transactions, viewYear, viewMonth, todayStr]);

            const paidItems = React.useMemo(() => {
                const list = (transactions || []).filter(t => t.linkedRecurringId || t.linkTo || t.source === "recurring" || (t.notes && t.notes.includes("Marked as paid")));
                return list.sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [transactions]);

            const selectedDayStr = selectedDay ? toYYYYMMDD(selectedDay) : null;

            const filteredUpcoming = selectedDayStr ? upcomingItems.filter(i => i.date === selectedDayStr) : upcomingItems;
            const filteredOverdue = selectedDayStr ? overdueItems.filter(i => i.date === selectedDayStr) : overdueItems;
            const filteredPaid = selectedDayStr ? paidItems.filter(i => toYYYYMMDD(i.date) === selectedDayStr) : paidItems.filter(i => toYYYYMMDD(i.date).startsWith(viewMonthPrefix));

            // Auto-select active filter tab based on calendar view & date selection rules
            React.useEffect(() => {
                if (selectedDayStr) {
                    if (selectedDayStr > todayStr) {
                        // 3. Single future date selected: show upcoming filter, if empty show paid filter
                        if (filteredUpcoming.length > 0) {
                            setFilter("upcoming");
                        } else {
                            setFilter("paid");
                        }
                    } else {
                        // 4. Single past or present date selected: show overdue filter, if empty show paid filter
                        if (filteredOverdue.length > 0) {
                            setFilter("overdue");
                        } else {
                            setFilter("paid");
                        }
                    }
                } else {
                    // Month view level selection
                    const calYear = calNow.getFullYear();
                    const calMonth = calNow.getMonth();
                    const isPrevMonth = viewYear < calYear || (viewYear === calYear && viewMonth < calMonth);
                    const isNextMonth = viewYear > calYear || (viewYear === calYear && viewMonth > calMonth);

                    if (isPrevMonth) {
                        // 1. Previous month selected: show overdue filter, if nothing exists show paid filter
                        if (filteredOverdue.length > 0) {
                            setFilter("overdue");
                        } else {
                            setFilter("paid");
                        }
                    } else if (isNextMonth) {
                        // 2. Next month selected: show upcoming filter, if nothing exists show paid filter
                        if (filteredUpcoming.length > 0) {
                            setFilter("upcoming");
                        } else {
                            setFilter("paid");
                        }
                    } else {
                        // Current month
                        if (filteredOverdue.length > 0) {
                            setFilter("overdue");
                        } else if (filteredUpcoming.length > 0) {
                            setFilter("upcoming");
                        } else {
                            setFilter("paid");
                        }
                    }
                }
            }, [selectedDayStr, viewYear, viewMonth, filteredUpcoming.length, filteredOverdue.length, filteredPaid.length, todayStr]);

            // Candidate matching transactions for Mark Paid modal
            const candidateMatches = React.useMemo(() => {
                if (!markPaidModalItem) return [];
                const itemDateStr = markPaidModalItem.date;
                const itemAmount = Math.abs(Number(markPaidModalItem.amount));
                return (transactions || []).filter(t => {
                    const tDateStr = toYYYYMMDD(t.date);
                    const tAmount = Math.abs(Number(t.amount));
                    return tDateStr === itemDateStr && Math.abs(tAmount - itemAmount) < 0.01;
                });
            }, [markPaidModalItem, transactions]);

            const confirmMarkPaid = async (item, txIdToLink) => {
                try {
                    if (txIdToLink) {
                        const existingTx = transactions.find(t => t.id === txIdToLink);
                        if (existingTx) {
                            const updatedTx = {
                                ...existingTx,
                                linkedRecurringId: item.id,
                                notes: existingTx.notes ? (existingTx.notes.includes("Marked as paid") ? existingTx.notes : `${existingTx.notes} (Marked as paid)`) : `Marked as paid from Dashboard on ${new Date().toLocaleDateString()}`
                            };
                            await updateTransactionInDB(updatedTx);
                        }
                    } else {
                        const newTx = {
                            id: crypto.randomUUID(),
                            date: item.date || todayStr,
                            merchant: item.name,
                            narration: item.name,
                            amount: item.amount,
                            type: item.type || "expense",
                            category: item.category || "Subscriptions",
                            account: "Main Checking",
                            linkedRecurringId: item.id,
                            tags: [],
                            notes: `Marked as paid from Dashboard on ${new Date().toLocaleDateString()}`
                        };
                        await updateTransactionInDB(newTx);
                    }

                    // Advance schedule on item
                    if (item.kind === "recurring") {
                        const updatedList = (settings.recurring || []).map(r => {
                            if (r.id !== item.id) return r;
                            const d = new Date(r.nextDate || new Date());
                            switch (r.cadence) {
                                case "weekly": d.setDate(d.getDate() + 7); break;
                                case "biweekly": d.setDate(d.getDate() + 14); break;
                                case "quarterly": d.setMonth(d.getMonth() + 3); break;
                                case "annual": d.setFullYear(d.getFullYear() + 1); break;
                                case "monthly":
                                default: d.setMonth(d.getMonth() + 1); break;
                            }
                            return { ...r, nextDate: d.toISOString().split('T')[0] };
                        });
                        await updateSetting("recurring", updatedList);
                    } else if (item.kind === "networth") {
                        const updatedList = (settings.networthItems || []).map(it => {
                            if (it.id !== item.id) return it;
                            const d = new Date(it.nextDueDate || new Date());
                            const monthsToAdd = (it.frequencyPerYear >= 12) ? 1 : (it.frequencyPerYear === 4) ? 3 : (it.frequencyPerYear === 2) ? 6 : 12;
                            d.setMonth(d.getMonth() + monthsToAdd);
                            return { ...it, nextDueDate: d.toISOString().split('T')[0] };
                        });
                        await updateSetting("networthItems", updatedList);
                    }

                    // Refresh global state so new transaction and updated settings are immediately reflected across all views
                    if (typeof loadState === "function") {
                        await loadState();
                    }

                    if (typeof showToast === "function") {
                        showToast(`Marked "${item.name}" as paid`);
                    }
                } catch (e) {
                    console.error("Mark paid error:", e);
                } finally {
                    setMarkPaidModalItem(null);
                    setSelectedTxIdToLink(null);
                }
            };

            return (
                <div className="section-card" style={{ background: 'var(--card-bg)', borderRadius: '16px', border: '1px solid var(--border-color)', boxShadow: 'var(--shadow-sm)', display: 'flex', flexDirection: 'column', height: '100%' }}>
                    {/* 3 Filter Tabs: Upcoming, Overdue, Paid (No Payments Heading) */}
                    <div style={{ display: 'flex', justifyContent: 'flex-start', marginBottom: '16px' }}>
                        <div style={{ display: 'flex', gap: '4px', background: 'var(--bg-color)', padding: '3px', borderRadius: '10px', border: '1px solid var(--border-color)', width: '100%' }}>
                            <button
                                className={`btn btn-sm ${filter === 'upcoming' ? 'btn-primary' : 'btn-secondary'}`}
                                onClick={() => setFilter('upcoming')}
                                style={{ flex: 1, fontSize: '0.78rem', padding: '4px 10px', borderRadius: '7px', fontWeight: filter === 'upcoming' ? 600 : 500, border: 'none' }}
                            >
                                Upcoming ({filteredUpcoming.length})
                            </button>
                            <button
                                className={`btn btn-sm ${filter === 'overdue' ? 'btn-primary' : 'btn-secondary'}`}
                                onClick={() => setFilter('overdue')}
                                style={{
                                    flex: 1, fontSize: '0.78rem', padding: '4px 10px', borderRadius: '7px', fontWeight: filter === 'overdue' ? 600 : 500, border: 'none',
                                    color: filter === 'overdue' ? '#fff' : (filteredOverdue.length > 0 ? 'var(--danger)' : 'inherit')
                                }}
                            >
                                Overdue {filteredOverdue.length > 0 && (
                                    <span className="badge" style={{ backgroundColor: filter === 'overdue' ? '#fff' : 'var(--danger)', color: filter === 'overdue' ? 'var(--danger)' : '#fff', marginLeft: '4px', fontSize: '0.68rem', padding: '1px 5px' }}>
                                        {filteredOverdue.length}
                                    </span>
                                )}
                            </button>
                            <button
                                className={`btn btn-sm ${filter === 'paid' ? 'btn-primary' : 'btn-secondary'}`}
                                onClick={() => setFilter('paid')}
                                style={{ flex: 1, fontSize: '0.78rem', padding: '4px 10px', borderRadius: '7px', fontWeight: filter === 'paid' ? 600 : 500, border: 'none' }}
                            >
                                Paid ({filteredPaid.length})
                            </button>
                        </div>
                    </div>

                    {/* Active Filter Content */}
                    <div style={{ flex: 1, overflowY: 'auto', maxHeight: '280px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
                        {filter === "upcoming" && (
                            filteredUpcoming.length === 0 ? (
                                <div className="empty-state" style={{ padding: '24px 12px' }}>
                                    <Icon name="calendar" />
                                    <h3>No Upcoming Payments</h3>
                                    <p style={{ fontSize: '0.8rem' }}>{selectedDayStr ? "No scheduled payments for selected date." : "No upcoming commitments found for this month."}</p>
                                </div>
                            ) : (
                                filteredUpcoming.map((item, idx) => (
                                    <div key={item.id || idx} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', borderRadius: '10px', background: '#fff', border: '1px solid var(--border-color)' }}>
                                        <div>
                                            <div style={{ fontWeight: 600, fontSize: '0.86rem' }}>{item.name}</div>
                                            <div style={{ fontSize: '0.74rem', color: 'var(--text-muted)', marginTop: '2px', display: 'flex', alignItems: 'center', gap: '6px' }}>
                                                <span className="badge" style={{ backgroundColor: `var(--${item.swatch}-light)`, color: `var(--${item.swatch})` }}>{item.category}</span>
                                                <span>Due {formatDate(item.date, settings.dateFormat)}</span>
                                            </div>
                                        </div>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                            <span style={{ fontWeight: 700, fontSize: '0.9rem', color: item.type === 'income' ? 'var(--success)' : 'var(--danger)' }}>
                                                {item.type === 'income' ? '+' : '-'}{formatCurrency(item.amount)}
                                            </span>
                                            <button className="btn btn-secondary btn-sm" style={{ fontSize: '0.72rem', padding: '3px 8px' }} onClick={() => { setMarkPaidModalItem(item); setSelectedTxIdToLink(null); }}>
                                                Mark Paid
                                            </button>
                                        </div>
                                    </div>
                                ))
                            )
                        )}

                        {filter === "overdue" && (
                            filteredOverdue.length === 0 ? (
                                <div className="empty-state" style={{ padding: '24px 12px' }}>
                                    <Icon name="check" />
                                    <h3>All Caught Up!</h3>
                                    <p style={{ fontSize: '0.8rem' }}>No overdue payments found for this month.</p>
                                </div>
                            ) : (
                                filteredOverdue.map((item, idx) => (
                                    <div key={item.id || idx} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', borderRadius: '10px', background: '#FEF2F2', border: '1px solid #FCA5A5' }}>
                                        <div>
                                            <div style={{ fontWeight: 600, fontSize: '0.86rem', color: '#991B1B' }}>{item.name}</div>
                                            <div style={{ fontSize: '0.74rem', color: '#B91C1C', marginTop: '2px', display: 'flex', alignItems: 'center', gap: '6px' }}>
                                                <span className="badge" style={{ backgroundColor: '#FEE2E2', color: '#991B1B', fontWeight: 600 }}>
                                                    {item.daysOverdue} day{item.daysOverdue > 1 ? 's' : ''} overdue
                                                </span>
                                                <span>Due {formatDate(item.date, settings.dateFormat)}</span>
                                            </div>
                                        </div>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                            <span style={{ fontWeight: 700, fontSize: '0.9rem', color: '#991B1B' }}>
                                                -{formatCurrency(item.amount)}
                                            </span>
                                            <button className="btn btn-primary btn-sm" style={{ fontSize: '0.72rem', padding: '3px 8px', background: '#DC2626', borderColor: '#DC2626' }} onClick={() => { setMarkPaidModalItem(item); setSelectedTxIdToLink(null); }}>
                                                Mark Paid
                                            </button>
                                        </div>
                                    </div>
                                ))
                            )
                        )}

                        {filter === "paid" && (
                            filteredPaid.length === 0 ? (
                                <div className="empty-state" style={{ padding: '24px 12px' }}>
                                    <Icon name="transactions" />
                                    <h3>No Paid Payments</h3>
                                    <p style={{ fontSize: '0.8rem' }}>No completed payment history recorded for this month.</p>
                                </div>
                            ) : (
                                filteredPaid.map((item, idx) => (
                                    <div key={item.id || idx} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', borderRadius: '10px', background: '#fff', border: '1px solid var(--border-color)' }}>
                                        <div>
                                            <div style={{ fontWeight: 600, fontSize: '0.86rem' }}>{item.merchant || item.narration || "Payment"}</div>
                                            <div style={{ fontSize: '0.74rem', color: 'var(--text-muted)', marginTop: '2px', display: 'flex', alignItems: 'center', gap: '6px' }}>
                                                <span className="badge" style={{ backgroundColor: '#D1FAE5', color: '#065F46' }}>✓ Paid</span>
                                                <span>{formatDate(item.date, settings.dateFormat)}</span>
                                            </div>
                                        </div>
                                        <span style={{ fontWeight: 700, fontSize: '0.9rem', color: item.type === 'income' ? 'var(--success)' : 'var(--danger)' }}>
                                            {item.type === 'income' ? '+' : '-'}{formatCurrency(item.amount)}
                                        </span>
                                    </div>
                                ))
                            )
                        )}
                    </div>

                    {/* Mark Paid Confirmation / Transaction Match Modal */}
                    {markPaidModalItem && (
                        <div className="modal-overlay">
                            <div className="modal-container" style={{ maxWidth: '480px' }}>
                                <div className="modal-header">
                                    <h3 className="modal-title">Mark Payment as Paid</h3>
                                    <button className="modal-close-btn" onClick={() => { setMarkPaidModalItem(null); setSelectedTxIdToLink(null); }}>
                                        <Icon name="close" />
                                    </button>
                                </div>
                                <div className="modal-body" style={{ padding: '16px' }}>
                                    <div style={{ padding: '12px', borderRadius: '10px', background: 'var(--bg-color)', border: '1px solid var(--border-color)', marginBottom: '16px' }}>
                                        <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>Payment Item</div>
                                        <div style={{ fontWeight: 700, fontSize: '1rem', marginTop: '2px' }}>{markPaidModalItem.name}</div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '6px', fontSize: '0.82rem' }}>
                                            <span>Date: <strong>{formatDate(markPaidModalItem.date, settings.dateFormat)}</strong></span>
                                            <span>Amount: <strong style={{ color: 'var(--primary)' }}>{formatCurrency(markPaidModalItem.amount)}</strong></span>
                                        </div>
                                    </div>

                                    {candidateMatches.length > 0 ? (
                                        <div>
                                            <p style={{ fontSize: '0.84rem', fontWeight: 600, color: 'var(--text-main)', marginBottom: '8px' }}>
                                                Found {candidateMatches.length} existing transaction{candidateMatches.length > 1 ? 's' : ''} on this date with matching amount ({formatCurrency(markPaidModalItem.amount)}):
                                            </p>
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', maxHeight: '180px', overflowY: 'auto', marginBottom: '12px' }}>
                                                {candidateMatches.map(tx => {
                                                    const isChecked = (selectedTxIdToLink === tx.id) || (!selectedTxIdToLink && candidateMatches[0].id === tx.id);
                                                    return (
                                                        <label
                                                            key={tx.id}
                                                            style={{
                                                                display: 'flex', alignItems: 'center', gap: '10px', padding: '10px 12px',
                                                                borderRadius: '8px', border: isChecked ? '1px solid var(--primary)' : '1px solid var(--border-color)',
                                                                background: isChecked ? 'var(--primary-light)' : '#fff', cursor: 'pointer'
                                                            }}
                                                        >
                                                            <input
                                                                type="radio"
                                                                name="txMatch"
                                                                checked={isChecked}
                                                                onChange={() => setSelectedTxIdToLink(tx.id)}
                                                            />
                                                            <div style={{ flex: 1 }}>
                                                                <div style={{ fontWeight: 600, fontSize: '0.84rem' }}>{tx.merchant || tx.narration || "Transaction"}</div>
                                                                <div style={{ fontSize: '0.74rem', color: 'var(--text-muted)', display: 'flex', gap: '8px' }}>
                                                                    <span>{tx.category || "General"}</span>
                                                                    <span>• {tx.account || "Account"}</span>
                                                                </div>
                                                            </div>
                                                            <span style={{ fontWeight: 700, fontSize: '0.86rem' }}>{formatCurrency(tx.amount)}</span>
