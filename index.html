                                    <div style={{ padding: '12px', backgroundColor: 'var(--bg-color)', borderRadius: '8px', border: '1px solid var(--border-color)', fontSize: '0.88rem' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                                            <span style={{ color: 'var(--text-muted)' }}>Name:</span>
                                            <span style={{ fontWeight: 600 }}>{itemToDelete.name}</span>
                                        </div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                                            <span style={{ color: 'var(--text-muted)' }}>Category:</span>
                                            <span style={{ fontWeight: 500 }}>{itemToDelete.category}</span>
                                        </div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                            <span style={{ color: 'var(--text-muted)' }}>Amount:</span>
                                            <span style={{ fontWeight: 600, color: itemToDelete.type === "income" ? "var(--success)" : "var(--danger)" }}>
                                                {itemToDelete.type === "income" ? "+" : "-"}{formatCurrency(itemToDelete.amount)}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div className="modal-footer">
                                    <button className="btn btn-secondary" onClick={() => setItemToDelete(null)}>Cancel</button>
                                    <button className="btn btn-danger" onClick={async () => {
                                        await handleRemoveConfirmed(itemToDelete.id);
                                        setItemToDelete(null);
                                    }}>
                                        Confirm Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add/Edit Recurring Modal */}
                    {showModal && (
                        <CreateRecurringModal
                            settings={settings}
                            editingItem={editingItem}
                            onClose={() => { setShowModal(false); setEditingItem(null); }}
                            onSave={handleSaveRecurring}
                        />
                    )}

                    {/* Mapped Transactions View Modal */}
                    {mappedModalItem && (
                        <div className="modal-overlay">
                            <div className="modal-container" style={{ maxWidth: '550px' }}>
                                <div className="modal-header">
                                    <h3 className="modal-title">Mapped Ledger Transactions</h3>
                                    <button className="modal-close-btn" onClick={() => setMappedModalItem(null)}><Icon name="close" /></button>
                                </div>
                                <div className="modal-body">
                                    <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: '14px' }}>
                                        Transactions linked to <strong>"{mappedModalItem.name}"</strong> ({formatCurrency(mappedModalItem.amount)})
                                    </p>
                                    {transactions.filter(t => t.linkedRecurringId === mappedModalItem.id).length === 0 ? (
                                        <div className="empty-state" style={{ padding: '20px' }}>
                                            <Icon name="transactions" currency={settings.currency} />
                                            <p style={{ fontSize: '0.82rem' }}>No transactions mapped to this recurring rule yet. You can map transactions from the Transactions tab.</p>
                                        </div>
                                    ) : (
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', maxHeight: '250px', overflowY: 'auto' }}>
                                            {transactions.filter(t => t.linkedRecurringId === mappedModalItem.id).map(t => (
                                                <div key={t.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', borderRadius: '8px', border: '1px solid var(--border-color)', background: '#fff' }}>
                                                    <div>
                                                        <div style={{ fontWeight: 600, fontSize: '0.88rem' }}>{t.narration || t.merchant}</div>
                                                        <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>{formatDate(t.date, settings.dateFormat)} · {t.account}</div>
                                                    </div>
                                                    <span style={{ fontWeight: 700, fontSize: '0.9rem', color: t.type === 'income' ? 'var(--success)' : 'var(--danger)' }}>
                                                        {t.type === 'income' ? '+' : '-'}{formatCurrency(t.amount)}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <div className="modal-footer">
                                    <button className="btn btn-secondary" onClick={() => setMappedModalItem(null)}>Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- SUB-COMPONENT: Create / Edit Recurring Transaction Modal ---
        const CreateRecurringModal = ({ settings, editingItem, onClose, onSave }) => {
            const categories = settings?.categories || [];
            const e = editingItem || {};
            const [name, setName] = React.useState(e.name || "");
            const [category, setCategory] = React.useState(e.category || (categories[0] || "Utilities"));
            const [amount, setAmount] = React.useState(e.amount ?? "");
            const [type, setType] = React.useState(e.type || "expense");

            const handleTypeChange = (newType) => {
                setType(newType);
                const validCats = filterCategoriesByType(categories, newType);
                if (!validCats.includes(category)) {
                    setCategory(validCats[0] || "Food & Drinks - Breakfast 🍳");
                }
            };
            const [cadence, setCadence] = React.useState(e.cadence || "monthly");
            const [weeklyDays, setWeeklyDays] = React.useState(e.weeklyDays || ["Mon"]);
            const [monthlyDays, setMonthlyDays] = React.useState(e.monthlyDays || "1");
            const [customIntervalDays, setCustomIntervalDays] = React.useState(e.customIntervalDays || 14);
            const [customDays, setCustomDays] = React.useState(e.customDays || "");
            const [nextDate, setNextDate] = React.useState(e.nextDate || "");
            const [endDate, setEndDate] = React.useState(e.endDate || "");
            const [excludeFromMonthlyCalculations, setExcludeFromMonthlyCalculations] = React.useState(!!e.excludeFromMonthlyCalculations);

            const daysOfWeek = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

            const toggleDay = (day) => {
                if (weeklyDays.includes(day)) {
                    setWeeklyDays(weeklyDays.filter(d => d !== day));
                } else {
                    setWeeklyDays([...weeklyDays, day]);
                }
            };

            const handleSubmit = (ev) => {
                ev.preventDefault();
                if (!name.trim() || !amount) return;
                onSave({
                    name: name.trim(),
                    category,
                    amount: Number(amount),
                    type,
                    cadence,
                    weeklyDays,
                    monthlyDays,
                    customIntervalDays: Number(customIntervalDays),
                    customDays,
                    nextDate,
                    endDate,
                    excludeFromMonthlyCalculations,
                    active: true
                });
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-container" style={{ maxWidth: '520px' }}>
                        <div className="modal-header">
                            <h3 className="modal-title">{editingItem ? "Edit" : "Add"} Recurring Item</h3>
                            <button className="modal-close-btn" onClick={onClose}><Icon name="close" /></button>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="modal-body">
                                <div className="form-grid">
                                    <div className="form-row">
                                        <div className="form-field">
                                            <label>Name / Service</label>
                                            <input type="text" className="form-control" placeholder="e.g. HDFC Home Loan EMI, Zerodha SIP"
                                                value={name} onChange={(ev) => setName(ev.target.value)} required />
                                        </div>
                                        <div className="form-field">
                                            <label>Type</label>
                                            <select className="form-control" value={type} onChange={(ev) => handleTypeChange(ev.target.value)}>
                                                <option value="expense">Expense / Payment</option>
                                                <option value="income">Income / Deposit</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="form-row">
                                        <div className="form-field">
                                            <label>Category</label>
                                            <select className="form-control" value={category} onChange={(ev) => setCategory(ev.target.value)}>
                                                {renderCategoryOptions(categories, type)}
                                            </select>
                                        </div>
                                        <div className="form-field">
                                            <label>Amount ({getCurrencySymbol(settings?.currency || "INR")})</label>
                                            <input type="number" step="0.01" className="form-control" placeholder="0.00"
                                                value={amount} onChange={(ev) => setAmount(ev.target.value)} required />
                                        </div>
                                    </div>

                                    <div className="form-field">
                                        <label>Repeat Frequency / Pattern</label>
                                        <select className="form-control" value={cadence} onChange={(ev) => setCadence(ev.target.value)}>
                                            <option value="once">Repeated Only Once (Single date)</option>
                                            <option value="monthly">Monthly (e.g. every month on due date)</option>
                                            <option value="yearly">Yearly / Annual</option>
                                            <option value="weekly_days">Specific Days of Week (e.g. Mon, Wed, Fri)</option>
                                            <option value="monthly_days">Specific Days of Month (e.g. 1st & 15th)</option>
                                            <option value="custom_interval">Custom Days Interval (e.g. Every 14 days)</option>
                                            <option value="custom_days">Specific Set of Dates</option>
                                        </select>
                                    </div>

                                    {cadence === "weekly_days" && (
                                        <div className="form-field">
                                            <label>Select Days of the Week</label>
                                            <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '4px' }}>
                                                {daysOfWeek.map(day => (
                                                    <button
                                                        type="button"
                                                        key={day}
                                                        className={`btn ${weeklyDays.includes(day) ? "btn-primary" : "btn-secondary"} btn-sm`}
                                                        style={{ padding: '4px 8px', fontSize: '0.8rem' }}
                                                        onClick={() => toggleDay(day)}
                                                    >
                                                        {day}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {cadence === "monthly_days" && (
                                        <div className="form-field">
                                            <label>Specific Days of Month (comma separated)</label>
                                            <input type="text" className="form-control" placeholder="e.g. 1, 15, 30"
                                                value={monthlyDays} onChange={(ev) => setMonthlyDays(ev.target.value)} />
                                        </div>
                                    )}

                                    {cadence === "custom_interval" && (
                                        <div className="form-field">
                                            <label>Repeat Every N Days</label>
                                            <input type="number" className="form-control" placeholder="14"
                                                value={customIntervalDays} onChange={(ev) => setCustomIntervalDays(ev.target.value)} />
                                        </div>
                                    )}

                                    {cadence === "custom_days" && (
                                        <div className="form-field">
                                            <label>Custom Date List (comma separated YYYY-MM-DD)</label>
                                            <input type="text" className="form-control" placeholder="e.g. 2026-08-25, 2026-09-10"
                                                value={customDays} onChange={(ev) => setCustomDays(ev.target.value)} />
                                        </div>
                                    )}

                                    <div className="form-row">
                                        <div className="form-field">
                                            <label>Start / Next Expected Date</label>
                                            <input type="date" className="form-control" value={nextDate} onChange={(ev) => setNextDate(ev.target.value)} />
                                        </div>
                                        <div className="form-field">
                                            <label>End Date (Optional)</label>
                                            <input type="date" className="form-control" value={endDate} onChange={(ev) => setEndDate(ev.target.value)} placeholder="No end date" />

        // --- SUB-PAGE: Budgets (Section 12) ---
        const BudgetsPage = ({ transactions, settings, updateSetting, showToast, subpageActionSignal }) => {
            const budgetsList = settings.budgets || [];
            const [showCreateModal, setShowCreateModal] = React.useState(false);

            const prevSubpageActionSignal = React.useRef(subpageActionSignal);
            React.useEffect(() => {
                if (subpageActionSignal > prevSubpageActionSignal.current) {
                    setShowCreateModal(true);
                }
                prevSubpageActionSignal.current = subpageActionSignal;
            }, [subpageActionSignal]);

            // Filter transactions for this month to calculate budget progress
            const now = new Date();
            const thisMonthTx = transactions.filter(t => {
                const tDate = new Date(t.date);
                return tDate.getFullYear() === now.getFullYear() && tDate.getMonth() === now.getMonth();
            });

            // Calculate spent per category
            const spentByCategory = {};
            thisMonthTx.forEach(t => {
                if (t.type === "expense") {
                    spentByCategory[t.category] = (spentByCategory[t.category] || 0) + t.amount;
                }
            });

            const formatCurrency = (val) => formatCurrencyVal(val, settings.currency || "INR");

            const handleCreateBudget = async (item) => {
                const exists = budgetsList.some(b => b.category.toLowerCase() === item.category.toLowerCase());
                if (exists) {
                    showToast(`A budget for category "${item.category}" already exists`, "error");
                    return;
                }
                const updatedList = [...budgetsList, {
                    id: crypto.randomUUID(),
                    category: item.category,
                    limit: Number(item.limit),
                    active: true
                }];
                await updateSetting("budgets", updatedList);
                showToast("Budget limit established");
                setShowCreateModal(false);
            };

            const handleDeleteBudget = async (id) => {
                const updatedList = budgetsList.filter(b => b.id !== id);
                await updateSetting("budgets", updatedList);
                showToast("Budget limit deleted");
            };

            // Calculate budget health totals
            const totalBudgetLimit = budgetsList.reduce((sum, b) => sum + b.limit, 0);
            const totalBudgetSpent = budgetsList.reduce((sum, b) => sum + (spentByCategory[b.category] || 0), 0);
            const budgetHealthRatio = totalBudgetLimit > 0 ? (totalBudgetSpent / totalBudgetLimit) * 100 : 0;

            return (
                <div>
                    {budgetsList.length === 0 ? (
                        <div className="empty-state" style={{ padding: '60px 20px' }}>
                            <Icon name="budgets" />
                            <h3>No Budgets Set</h3>
                            <p>Track your spending categories by setting custom monthly envelopes.</p>
                            <button className="btn btn-primary" onClick={() => setShowCreateModal(true)}>Create budget</button>

                    ) : (
                        <div>

                            <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '24px', marginBottom: '28px' }}>

                                        <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem', marginBottom: '12px' }}>
                                            You have spent {formatCurrency(totalBudgetSpent)} out of {formatCurrency(totalBudgetLimit)} budgeted limit for this month.
                                        </p>
                                        <div className="progress-container">
                                            <div className="progress-bar-bg">
                                                <div
                                                    className={`progress-bar-fill ${budgetHealthRatio > 100 ? "danger" : budgetHealthRatio > 80 ? "warning" : "success"}`}
                                                    style={{ width: `${Math.min(budgetHealthRatio, 100)}%` }}
                                                ></div>
                                            </div>
                                            <div className="progress-labels">
                                                <span>{budgetHealthRatio.toFixed(0)}% Used</span>
                                                <span>{formatCurrency(Math.max(totalBudgetLimit - totalBudgetSpent, 0))} Remaining</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="card" style={{ justifyContent: 'center', alignItems: 'center', textAlign: 'center' }}>
                                    <span className="card-title">Envelopes Set</span>
                                    <div className="card-value" style={{ marginTop: '8px', color: 'var(--primary)' }}>{budgetsList.length}</div>
                                    <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Active Categories</span>
                                </div>
                            </div>

                            {/* Envelopes list */}
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: '20px' }}>
                                {budgetsList.map(b => {
                                    const spent = spentByCategory[b.category] || 0;
                                    const ratio = (spent / b.limit) * 100;
                                    const remaining = b.limit - spent;

                                    return (
                                        <div key={b.id} className="card" style={{ padding: '20px' }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '14px', alignItems: 'center' }}>
                                                <h4 style={{ fontWeight: 600, fontSize: '1rem' }}>{b.category}</h4>
                                                <button
                                                    className="btn btn-secondary btn-sm"
                                                    style={{ border: 'none', color: 'var(--danger)', padding: 0 }}
                                                    onClick={() => handleDeleteBudget(b.id)}
                                                >
                                                    <Icon name="trash" />
                                                </button>
                                            </div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.85rem', marginBottom: '6px' }}>
                                                <span style={{ color: 'var(--text-muted)' }}>Spent: <strong>{formatCurrency(spent)}</strong></span>
                                                <span>Limit: {formatCurrency(b.limit)}</span>
                                            </div>

                                            {/* Progress indicator bar */}
                                            <div className="progress-container" style={{ margin: 0 }}>
                                                <div className="progress-bar-bg" style={{ height: '6px' }}>
                                                    <div
                                                        className={`progress-bar-fill ${ratio > 100 ? "danger" : ratio > 80 ? "warning" : "success"}`}
                                                        style={{ width: `${Math.min(ratio, 100)}%` }}
                                                    ></div>
                                                </div>
                                            </div>

                                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', marginTop: '6px' }}>
                                                <span style={{ color: ratio > 100 ? 'var(--danger)' : 'var(--text-muted)' }}>
                                                    {ratio > 100 ? "Over Budget!" : `${ratio.toFixed(0)}% utilized`}
                                                </span>
                                                <span style={{ fontWeight: 600, color: remaining >= 0 ? "var(--success)" : "var(--danger)" }}>
                                                    {remaining >= 0 ? `${formatCurrency(remaining)} left` : `${formatCurrency(Math.abs(remaining))} over`}
                                                </span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* Create Budget Modal */}
                    {showCreateModal && (
                        <CreateBudgetModal
                            onClose={() => setShowCreateModal(false)}
                            onSave={handleCreateBudget}
                            settings={settings}
                        />
                    )}
                </div>
            );
        };


        // --- SUB-PAGE: Goals (Section 13) ---
        const GoalsPage = ({ settings, updateSetting, showToast, subpageActionSignal }) => {
            const goalsList = settings.goals || [];
            const [showCreateModal, setShowCreateModal] = React.useState(false);

            const prevSubpageActionSignal = React.useRef(subpageActionSignal);
            React.useEffect(() => {
                if (subpageActionSignal > prevSubpageActionSignal.current) {
                    setShowCreateModal(true);
                }
                prevSubpageActionSignal.current = subpageActionSignal;

            const handleCreateGoal = async (item) => {

                }];

            const handleDeleteGoal = async (id) => {
                const updatedList = goalsList.filter(g => g.id !== id);
                await updateSetting("goals", updatedList);
                showToast("Goal deleted");
            };

            const handleUpdateProgress = async (id, val) => {
                const updatedList = goalsList.map(g => {
                    if (g.id === id) {
                        return { ...g, current: Math.min(Number(val), g.target) };
                    }
                    return g;
                });
                await updateSetting("goals", updatedList);
                showToast("Goal progress updated");
            };

            return (
                <div>
                    {goalsList.length === 0 ? (

                        </div>
                    ) : (
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))', gap: '20px' }}>

                                const remaining = g.target - g.current;

                                return (

                                                {g.dueDate && <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Target Date: {formatDate(g.dueDate, settings.dateFormat)}</span>}
                                            </div>
                                            <button
                                                className="btn btn-secondary btn-sm"
                                                style={{ border: 'none', color: 'var(--danger)', padding: 0 }}
                                                onClick={() => handleDeleteGoal(g.id)}
                                            >
                                                <Icon name="trash" />
                                            </button>
                                        </div>

                                        {g.note && <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: '16px', fontStyle: 'italic' }}>{g.note}</p>}

                                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.85rem', marginBottom: '6px' }}>
                                            <span>Saved: <strong>{formatCurrency(g.current)}</strong></span>
                                            <span>Target: {formatCurrency(g.target)}</span>
                                        </div>

                                        {/* Progress Bar */}
                                        <div className="progress-container" style={{ margin: '0 0 16px 0' }}>

                                                    className="progress-bar-fill primary"
                                                    style={{ width: `${Math.min(ratio, 100)}%` }}

                                            </div>
                                        </div>

                                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.8rem', alignItems: 'center' }}>
                                            <span style={{ fontWeight: 500, color: 'var(--primary)' }}>{ratio.toFixed(0)}% Completed</span>
                                            <span style={{ color: 'var(--text-muted)' }}>{formatCurrency(remaining)} left</span>
                                        </div>

                                        {/* Inline Quick deposit input slider */}
                                        <div style={{ marginTop: '16px', borderTop: '1px solid var(--border-color)', paddingTop: '14px', display: 'flex', alignItems: 'center', gap: '10px' }}>
                                            <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', whiteSpace: 'nowrap' }}>Adjust:</span>
                                            <input
                                                type="range"
                                                min="0"
                                                max={g.target}
                                                value={g.current}
                                                onChange={(e) => handleUpdateProgress(g.id, e.target.value)}
                                                style={{ flex: 1, accentColor: 'var(--primary)' }}
                                            />
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {showCreateModal && (
                        <CreateGoalModal
                            onClose={() => setShowCreateModal(false)}
                            onSave={handleCreateGoal}
                            settings={settings}

        // --- SUB-PAGE: Net Worth Ledger (Fixed Assets, Passive Income, Pension, House Tax,
        // Insurance, Investments, Liabilities, Credit Cards, Current Balances) ---
        // --- SUB-PAGE: Net Worth Ledger ---
        const NetWorthPage = ({ settings, updateSetting, showToast, setActivePage, subpageActionSignal, activeSectionFilter: propActiveSectionFilter, setActiveSectionFilter: propSetActiveSectionFilter, collapsed: propCollapsed, setCollapsed: propSetCollapsed }) => {
            const items = settings.networthItems || [];
            const [showModal, setShowModal] = React.useState(false);
            const [editingItem, setEditingItem] = React.useState(null);
            const [defaultModalCategory, setDefaultModalCategory] = React.useState(null);
            const [localCollapsed, setLocalCollapsed] = React.useState({});
            const collapsed = propCollapsed !== undefined ? propCollapsed : localCollapsed;
            const setCollapsed = propSetCollapsed || setLocalCollapsed;
            const [quickBillItem, setQuickBillItem] = React.useState(null);
            const [quickBillAmount, setQuickBillAmount] = React.useState("");
            const [itemToDelete, setItemToDelete] = React.useState(null);
            const [localActiveSectionFilter, setLocalActiveSectionFilter] = React.useState("all");

            const activeSectionFilter = propActiveSectionFilter !== undefined ? propActiveSectionFilter : localActiveSectionFilter;
            const setActiveSectionFilter = propSetActiveSectionFilter || setLocalActiveSectionFilter;

            const prevSubpageActionSignal = React.useRef(subpageActionSignal);
            React.useEffect(() => {
                if (subpageActionSignal > prevSubpageActionSignal.current) {
                    setEditingItem(null);
                    setDefaultModalCategory(null);
                    setShowModal(true);
                }
                prevSubpageActionSignal.current = subpageActionSignal;
            }, [subpageActionSignal]);

            const formatCurrency = (val) => formatCurrencyVal(val, settings.currency || "INR");

            const persistItems = async (updatedList) => {
                await updateSetting("networthItems", updatedList);
                const activeList = updatedList.filter(it => it.includeInNetWorth !== false);
                const assetKinds = ["asset", "balance", "income"];
                const totalAssets = activeList
                    .filter(it => assetKinds.includes((NET_WORTH_GROUPS.find(g => g.key === it.category) || {}).kind))
                    .reduce((s, it) => s + Number(it.value || 0), 0);
                const totalLiabs = activeList
                    .filter(it => (NET_WORTH_GROUPS.find(g => g.key === it.category) || {}).kind === "liability")
                    .reduce((s, it) => s + Math.abs(Number(it.value || 0)), 0);
                await updateSetting("assetsTotal", totalAssets);
                await updateSetting("liabilitiesTotal", totalLiabs);
                await updateSetting("netWorthConfigured", true);
            };

            const handleSave = async (item) => {
                let updatedList;
                if (editingItem) {
                    updatedList = items.map(it => it.id === editingItem.id ? { ...it, ...item } : it);
                } else {
                    updatedList = [...items, { id: crypto.randomUUID(), ...item }];

                await persistItems(updatedList);
                showToast(editingItem ? "Ledger entry updated" : "Ledger entry added");
                setShowModal(false);
                setEditingItem(null);
                setDefaultModalCategory(null);
            };

            const handleDelete = async (id) => {
                const updatedList = items.filter(it => it.id !== id);
                await persistItems(updatedList);
                showToast("Ledger entry removed");

            const toggleIncludeInNetWorth = async (id) => {
                const updatedList = items.map(it => {

                        const nextState = it.includeInNetWorth === false ? true : false;
                        showToast(nextState ? `"${it.name}" included in Net Worth` : `"${it.name}" excluded from Net Worth`);
                        return { ...it, includeInNetWorth: nextState };
                    }
                    return it;
                });
                await persistItems(updatedList);
            };

            const handleQuickBillSave = async () => {
                if (!quickBillItem || quickBillAmount === "") return;
                const updatedList = items.map(it => {
                    if (it.id === quickBillItem.id) {
                        return { ...it, value: Number(quickBillAmount) };
                    }
                    return it;
                });
                await persistItems(updatedList);
                showToast(`Statement balance updated for "${quickBillItem.name}"`);
                setQuickBillItem(null);
                setQuickBillAmount("");
            };

            const toggleCollapse = (key) => setCollapsed(prev => ({ ...prev, [key]: !prev[key] }));

            const activeItems = items.filter(it => it.includeInNetWorth !== false);

            const totalCashVal = activeItems
                .filter(it => (NET_WORTH_GROUPS.find(g => g.key === it.category) || {}).kind === "balance")
                .reduce((s, it) => s + Number(it.value || 0), 0);
            const totalAssetsVal = activeItems
                .filter(it => (NET_WORTH_GROUPS.find(g => g.key === it.category) || {}).kind === "asset")
                .reduce((s, it) => s + Number(it.value || 0), 0);
            const totalInvestmentsVal = activeItems
                .filter(it => (NET_WORTH_GROUPS.find(g => g.key === it.category) || {}).kind === "investment")
                .reduce((s, it) => s + Number(it.value || 0), 0);
            const totalLiabilitiesVal = activeItems
                .filter(it => (NET_WORTH_GROUPS.find(g => g.key === it.category) || {}).kind === "liability")
                .reduce((s, it) => s + Math.abs(Number(it.value || 0)), 0);
            const netWorthVal = totalCashVal + totalAssetsVal + totalInvestmentsVal - totalLiabilitiesVal;

            const cashCount = items.filter(it => (NET_WORTH_GROUPS.find(g => g.key === it.category) || {}).kind === "balance").length;
            const assetCount = items.filter(it => (NET_WORTH_GROUPS.find(g => g.key === it.category) || {}).kind === "asset").length;
            const investmentCount = items.filter(it => (NET_WORTH_GROUPS.find(g => g.key === it.category) || {}).kind === "investment").length;

                    addBtnLabel: "+ Add Investment",
                    count: investmentCount,
                    totalVal: totalInvestmentsVal

                    defaultCategory: "Liabilities",
                    addBtnLabel: "+ Add Debt / Loan",

            const [deleteStep, setDeleteStep] = React.useState(1);

            const handleManualUpload = async (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                let uploadCount = 0;
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];

                    // Validate size limit (20MB)
                    if (file.size > 20 * 1024 * 1024) {
                        showToast(`File "${file.name}" exceeds 20 MB size limit`, "error");
                        continue;
                    }

                    const docId = crypto.randomUUID();
                    await saveDocumentInDB({
                        id: docId,
                        filename: file.name,
                        mimeType: file.type || "application/octet-stream",
                        size: file.size,
                        status: "stored",
                        source: "upload",
                        createdAt: new Date().toISOString(),
                        fileData: file // Save Blob bytes locally
                    });
                    uploadCount++;
                }

                if (uploadCount > 0) {
                    showToast(`Successfully uploaded ${uploadCount} file(s)`);
                    loadState();
                }
            };

            const formatBytes = (bytes) => {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            };

            const syncMeta = settings.driveSyncMetadata || null;

            return (
                <div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px', marginBottom: '28px' }}>

                        {/* Box 1: File Uploader dropzone */}
